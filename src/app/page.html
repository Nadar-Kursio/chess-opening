<body>
<a class="skip" href="#main">Skip to the board</a>

<!-- Where you are, how you are doing, and how the page looks. What you are
     TAUGHT is chosen in the nav, next to the list it filters. -->
<header class="appbar">
  <button class="appbar__menu" id="navtoggle" aria-expanded="false" aria-controls="nav"
    aria-label="Open the course menu"><span aria-hidden="true">&#9776;</span></button>
  <a class="appbar__brand" href="#" id="brand">
    <span class="appbar__mark" aria-hidden="true">&#9822;</span>
    <span class="appbar__name">Opening Lab</span>
  </a>
  <span class="appbar__where" id="appbar-where"></span>
  <div class="appbar__actions" id="appbar-actions"></div>
</header>

<button class="scrim" id="scrim" hidden aria-label="Close the course menu"></button>

<div class="shell">
  <nav class="nav scroller" id="nav" aria-label="Course"></nav>
  <main class="main" id="main" tabindex="-1">
    <div id="content"></div>
  </main>
</div>

<template id="primer">
__PRIMER__
</template>

<!-- Outside #content on purpose: a live region that render() destroys and
     recreates does not reliably announce. -->
<div class="sr" id="announce" role="status" aria-live="polite"></div>

__SCRIPTS__
</script>
