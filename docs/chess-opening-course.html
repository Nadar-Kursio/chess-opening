<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Safety shim: some embedded webviews/wrappers don't define every console method
   (console.debug in particular). Define any missing ones as no-ops BEFORE anything
   else runs, so no injected or app code can throw "console.debug is not a function". */
(function(){
  try{
    if(typeof window.console==="undefined"){ window.console={}; }
    var noop=function(){};
    var methods=["debug","log","info","warn","error","trace","group","groupCollapsed",
                 "groupEnd","table","assert","dir","dirxml","count","countReset","time",
                 "timeEnd","timeLog","profile","profileEnd","clear"];
    for(var i=0;i<methods.length;i++){
      if(typeof window.console[methods[i]]!=="function"){ window.console[methods[i]]=noop; }
    }
  }catch(e){/* never let the shim itself break the page */}
})();

/* ---------------- theme ---------------- */
/* Runs in <head>, ahead of the stylesheet and of any markup, so the page is
   painted in the chosen theme once instead of flashing the default and being
   repainted. That is the whole reason this is not part of store.js, which does
   not run until the bottom of the body.

   Being that early is also why the storage key is declared here: store.js needs
   the same key, and the scripts share one top-level scope, so a single
   declaration is what stops the two from drifting onto different keys. */
const DB_KEY = "chessopening";
const THEMES = ["dark", "light"];

function themeName(){
  return document.documentElement.getAttribute("data-theme") || "dark";
}

function themeSet(name){
  document.documentElement.setAttribute(
    "data-theme", THEMES.indexOf(name) < 0 ? "dark" : name);
}

/* A stored choice wins; without one, follow the system. Anything unreadable --
   matchMedia is missing in some embedded webviews -- means "dark".

   Separate from the bootstrap below because the store can be replaced whole
   after load, by an import or a reset, and those have to resolve the theme by
   the same rule rather than leaving the page on the old one. */
function themeResolve(stored){
  if(THEMES.indexOf(stored) >= 0) return stored;
  try{
    if(window.matchMedia("(prefers-color-scheme: light)").matches) return "light";
  }catch(e){}
  return "dark";
}

/* Read raw rather than through the store, which has not loaded yet, and
   defensively: localStorage can throw on the property alone from a file:// URL,
   and the payload may be from a build that never wrote a theme. */
themeSet(themeResolve((function(){
  try{
    const saved = JSON.parse(window.localStorage.getItem(DB_KEY) || "null");
    return saved && saved.ui && saved.ui.theme;
  }catch(e){ return null; }
})()));

</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Repertoire — an interactive course</title>
<style>
/* The palette is the whole of a theme: no rule anywhere names a colour, so
   switching is one attribute on <html>, set by theme.js before first paint.

   Every text token clears WCAG AA (4.5:1, and 7:1 for --text) against all four
   surfaces, not just against --ink. The raised panels are the tight case -- a
   label that reads fine on the page background is the one that goes muddy
   inside a card -- so --panel3 is what these values were chosen against. */
:root{
  /* Theme-independent. The board is the same board either way, so every colour
     painted on it stays fixed: recolouring it per theme would only make the
     pieces and the arrows drawn over it wrong half the time. */
  --sq-light:#EBECD0; --sq-dark:#739552; --sq-hl:#F5EC59;
  --cue:#8FBF52;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

/* Dark carries no attribute selector, so a page that never runs theme.js -- or
   one served with the attribute stripped -- still renders the way it always did. */
:root{
  --ink:#191715; --panel:#232120; --panel2:#2b2927; --panel3:#343130;
  --line:#413D39; --line2:#544E49;
  --text:#F1ECE4; --muted:#AFA99F; --dim:#9F988F;
  --green:#8FBF52; --green-dk:#7FAE45;
  --amber:#DDA94A; --red:#D5837C;
  /* Text on an accent fill. Distinct from --ink, which it happens to resemble
     here: the two are opposites in light theme, where the page is pale but a
     filled pill still needs light text. */
  --on-accent:#1A1815;
  --wash:rgba(143,191,82,.09);
  --shadow:0 1px 0 rgba(255,255,255,.04), 0 12px 34px -18px rgba(0,0,0,.8);
}

:root[data-theme="light"]{
  /* --panel is the lightest surface, not the darkest: cards lift off the page
     here, and the nested surfaces below them recede by getting warmer instead. */
  --ink:#F6F3ED; --panel:#FFFFFF; --panel2:#F1EDE5; --panel3:#E7E2D8;
  --line:#DBD5C8; --line2:#C2BAA9;
  --text:#221F1B; --muted:#5E564B; --dim:#6C6459;
  --green:#476F27; --green-dk:#5C8A31;
  --amber:#855E10; --red:#B23A31;
  --on-accent:#FFFFFF;
  --wash:rgba(71,111,39,.10);
  --shadow:0 1px 0 rgba(255,255,255,.9), 0 12px 30px -20px rgba(58,48,33,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:3px}

/* ---------- shell ---------- */
.wrap{max-width:1340px;margin:0 auto;padding:0 20px 90px}
header.masthead{
  border-bottom:1px solid var(--line); padding:34px 0 26px; margin-bottom:26px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
}
/* min-width:0 so the long standfirst can wrap instead of forcing the row wider
   and pushing the controls off the top-right corner. */
.mastcopy{min-width:0}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--dim); margin:0 0 10px;
}
h1.title{
  font-family:var(--serif); font-weight:600; font-size:clamp(30px,5.2vw,46px);
  line-height:1.04; letter-spacing:-.015em; margin:0 0 12px;
}
h1.title em{font-style:italic;color:var(--green)}
.standfirst{max-width:64ch;color:var(--muted);margin:0;font-size:15.5px}

.layout{display:grid;grid-template-columns:246px minmax(0,1fr);gap:34px;align-items:start}

/* ---------- sidebar ---------- */
.rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.rail::-webkit-scrollbar{width:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.railgroup{margin-bottom:24px}
.railhead{
  display:flex;align-items:baseline;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px;
}
.railhead .glyph{font-size:15px;letter-spacing:0}
.railsub{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  padding:9px 0 4px 2px;letter-spacing:.06em;
}
.railitem{
  display:block;width:100%;text-align:left;padding:7px 10px;border-radius:5px;
  color:var(--muted);font-size:14px;border-left:2px solid transparent;transition:.14s;
}
.railitem:hover{color:var(--text);background:var(--panel)}
.railitem.on{color:var(--text);background:var(--panel2);border-left-color:var(--green);font-weight:500}
.railitem .eco{font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin-top:1px}

/* ---------- section chips ---------- */
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 20px}
.jump a{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:6px 13px;
  text-decoration:none;transition:.13s;
}
.jump a:hover{color:var(--text);border-color:var(--line2);background:var(--panel)}

/* ---------- chrome: tier selector + progress chip ---------- */
/* New custom properties go in their own :root rather than editing base.css's,
   so the palette this file adds cannot disturb the one already there.

   The severities are aliases, not copies. A custom property that names another
   resolves where it is used, so --sev-blunder follows whatever --red is in the
   theme that ends up applied, and a severity cannot be left behind when the
   palette it borrows from is retuned. */
:root{
  --blue:#6E9CD5; --slate:#929AA5;
  --sev-blunder:var(--red); --sev-inaccuracy:var(--amber);
  --sev-playable:var(--blue); --sev-offbook:var(--slate);
}
:root[data-theme="light"]{
  --blue:#2D65AE; --slate:#5D6673;
}

/* Visually hidden but still announced. */
.sr{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}

.chrome{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin:-14px 0 22px;
}
.tierbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tierlbl{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-right:6px;
}
.tierseg{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 12px;
  transition:.13s;
}
.tierseg:hover{color:var(--text);border-color:var(--line2);background:var(--panel)}
.tierseg.on{color:var(--on-accent);background:var(--green);border-color:var(--green);font-weight:600}

.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 12px;transition:.13s;
}
.chip:hover{color:var(--text);border-color:var(--line2);background:var(--panel)}
.chip b{color:var(--green);font-weight:600}
.chip .sep{opacity:.5;margin:0 2px}

/* Top-right of the masthead: the corner every site puts display settings in. */
.mastacts{display:flex;align-items:center;gap:8px;flex:none}
/* The glyph is the only part of a chip that should not be tracked out. */
.themetog .glyph{font-style:normal;letter-spacing:0;margin-right:5px}

/* Depth-of-feedback badge. Lives here rather than in layout.css because it uses
   the palette this file adds; custom properties resolve at use time, so the
   cascade order does not matter. */
.railtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lvtag{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;border:1px solid currentColor;border-radius:20px;padding:1px 6px;
  flex:none;opacity:.75;
}
.railitem:hover .lvtag,.railitem.on .lvtag{opacity:1}
.lvtag.lv0{color:var(--dim)}
.lvtag.lv1{color:var(--blue)}
.lvtag.lv2{color:var(--green)}

/* Same word in the study panel, with the explanation spelled out. */
.dxlvl.lv0{color:var(--dim)}
.dxlvl.lv1{color:var(--blue)}
.dxlvl.lv2{color:var(--green)}
.dxlvl em{font-style:normal;color:var(--dim);text-transform:none;letter-spacing:0}

.tiermore{
  font-size:13px;color:var(--dim);border-left:2px solid var(--line2);
  padding:2px 0 2px 12px;margin:14px 0 0;
}
.tiermore b{color:var(--muted)}

/* ---------- progress page ---------- */
.progpage{display:grid;gap:16px;max-width:74ch}
.warn-note{
  font-size:13.5px;color:var(--amber);border:1px solid var(--line);border-left:2px solid var(--amber);
  border-radius:5px;background:var(--panel);padding:11px 14px;margin:0;
}
.pglist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pglist li{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:8px;
}
.pglist li:first-child{border-top:none;padding-top:0}
.pgname{flex:1 1 220px}
.pgname em{color:var(--dim);font-style:normal;display:block;font-size:13px}
.pgscore{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pgacts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.pgbox{
  width:100%;min-height:110px;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:5px;
  padding:10px 12px;resize:vertical;
}
.pgmsg{font-size:13px;color:var(--green);margin:8px 0 0;min-height:1.2em}

/* ---------- opening header ---------- */
.ophead{margin-bottom:22px}
.opkicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--green);margin-bottom:9px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.opkicker .sep{color:var(--line2)}
.opkicker .lvl{color:var(--dim)}
h2.opname{
  font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,38px);
  line-height:1.06;letter-spacing:-.015em;margin:0 0 8px;
}
.optag{color:var(--muted);max-width:66ch;margin:0;font-size:15.5px}

/* ---------- study area ---------- */
.study{
  display:grid;grid-template-columns:minmax(300px,480px) minmax(0,1fr);gap:26px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow);margin-bottom:30px;
}
.boardcol{min-width:0}

/* ---------- controls ---------- */
.controls{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.ctl{
  flex:1;min-width:40px;padding:9px 4px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:.13s;
}
.ctl:hover:not(:disabled){background:var(--panel3);color:var(--text);border-color:var(--line2)}
.ctl:disabled{opacity:.32;cursor:default}
.ctl.wide{flex:1.5}
.ctl.on{color:var(--on-accent);background:var(--green);border-color:var(--green)}
.ctlbar2{display:flex;gap:6px;margin-top:6px}
.counter{
  font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;
  margin-top:9px;letter-spacing:.08em;
}
.hint{font-size:11.5px;color:var(--dim);text-align:center;margin-top:6px}

/* ---------- variations + tape ---------- */
.studycol{min-width:0;display:flex;flex-direction:column}
.vartabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.vartab{
  padding:7px 12px;border:1px solid var(--line);border-radius:20px;
  font-size:12.5px;color:var(--muted);background:var(--panel2);transition:.13s;
}
.vartab:hover{color:var(--text);border-color:var(--line2)}
.vartab.on{background:var(--green);border-color:var(--green);color:var(--on-accent);font-weight:600}
.varnote{
  font-size:13.5px;color:var(--muted);border-left:2px solid var(--line2);
  padding-left:12px;margin-bottom:14px;
}

.tape{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:9px;max-height:170px;overflow:auto;margin-bottom:14px;
  display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;
}
.tape::-webkit-scrollbar{width:6px}
.tape::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.mvnum{
  font-family:var(--mono);font-size:11.5px;color:var(--dim);
  padding:4px 2px 4px 6px;align-self:center;
}
.mv{
  font-family:var(--mono);font-size:12.5px;padding:4px 7px;border-radius:4px;
  color:var(--muted);transition:.1s;white-space:nowrap;
}
.mv:hover{background:var(--panel3);color:var(--text)}
.mv.on{background:var(--green);color:var(--on-accent);font-weight:700}
.mv.seen{color:var(--text)}

.commentary{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:15px 17px;flex:1;min-height:150px;
}
.cmtop{
  display:flex;align-items:baseline;gap:10px;margin-bottom:8px;
  padding-bottom:8px;border-bottom:1px solid var(--line);
}
.cmmove{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--green)}
.cmwho{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
.cmtext{margin:0;font-size:14.8px;line-height:1.66;color:var(--text)}

/* ---------- board ---------- */
.boardframe{
  background:var(--panel3);padding:10px;border-radius:8px;border:1px solid var(--line);
}
/* padding-top:100% => a perfectly square box in every engine (no aspect-ratio needed). */
.boardwrap{position:relative;width:100%;padding-top:100%;border-radius:3px;overflow:hidden}
/* absolute inset:0 gives the grid a definite height, so 1fr rows == 1fr columns == equal squares. */
.arrows{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.board{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
}
.sq{position:relative;display:flex;align-items:center;justify-content:center;line-height:1}
.sq.l{background:var(--sq-light)}
.sq.d{background:var(--sq-dark)}
.sq .pc{
  position:relative;z-index:2;line-height:1;user-select:none;
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans","Arial Unicode MS",sans-serif;
}
.sq .pc.wp{color:#FFFFFF;text-shadow:0 0 1px #35322D,0 0 1px #35322D,0 1px 1px rgba(0,0,0,.35);-webkit-text-stroke:1px #35322D}
.sq .pc.bp{color:#2B2825;text-shadow:0 0 1px #141109;-webkit-text-stroke:.6px #141109}
.sq.hl::before{content:"";position:absolute;inset:0;background:var(--sq-hl);opacity:.55;z-index:1}
.sq.chk::after{content:"";position:absolute;inset:0;z-index:1;
  background:radial-gradient(circle at 50% 50%,rgba(219,68,55,.92) 12%,rgba(219,68,55,.5) 45%,rgba(219,68,55,0) 72%)}
.sq .pc.moved{animation:drop .19s ease-out}
@keyframes drop{from{transform:scale(1.14)}to{transform:scale(1)}}
.coord{position:absolute;font-family:var(--mono);font-size:9px;font-weight:700;z-index:3;opacity:.85}
.coord.f{right:3px;bottom:1px}
.coord.r{left:3px;top:1px}
.sq.l .coord{color:var(--sq-dark)}
.sq.d .coord{color:var(--sq-light)}

/* ---------- arrows toggle, legend, tactics ---------- */

/* The legend swatches are the one place a literal colour is right: each has to
   be the exact colour ARROW_COLORS draws on the board, and the board does not
   change with the theme. Themed swatches would make the legend describe arrows
   that are not the ones on screen. */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:15px;height:0;border-top:3px solid;border-radius:2px;display:inline-block}
.legend i.atk{border-color:#D24B3C}
.legend i.def{border-color:#4E8AD6}
.legend i.mv{border-color:#7CA35A}
.legend i.chk{border-color:#EA3B33}
.legend i.ctrl{width:11px;height:11px;border:2px solid #E0B44A;border-top:2px solid #E0B44A;border-radius:50%}
.tactics{
  margin-top:12px;padding:9px 12px;background:var(--panel3);border:1px solid var(--line);
  border-radius:7px;font-size:13px;color:var(--text);display:flex;gap:9px;align-items:flex-start;
}
.tactics .lbl{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--green);flex-shrink:0;padding-top:2px;
}
.tactics .body{color:var(--muted)}
.tactics .body b{color:var(--text);font-weight:600}

/* ---------- drill ---------- */
/* Loads after board.css so the interaction states layer above .sq.hl::before,
   which already owns z-index 1. They sit below .pc (z-index 2) so a piece is
   never obscured by the cue that points at it. */

.dxbar{
  grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:2px;
}
.dxmodes{display:flex;gap:4px}
.dxmode{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 14px;transition:.13s;
}
.dxmode:hover{color:var(--text);border-color:var(--line2);background:var(--panel)}
.dxmode.on{color:var(--on-accent);background:var(--green);border-color:var(--green);font-weight:600}
.dxlvl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

.drill{
  background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--line2);
  border-radius:7px;padding:14px 16px;
}
.drill[data-tone="ok"]{border-left-color:var(--green)}
.drill[data-tone="warn"]{border-left-color:var(--amber)}
.drill[data-tone="bad"]{border-left-color:var(--red)}
.drill[data-tone="flat"]{border-left-color:var(--slate)}

.dxhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dxturn{font-size:14.5px}
.dxturn b{color:var(--green)}
.dxscore{font-family:var(--mono);font-size:11px;color:var(--dim)}
.dxscore b{color:var(--muted)}
.dxscore .sep{opacity:.5;margin:0 2px}

.dxprogress{height:3px;background:var(--line);border-radius:2px;margin:10px 0 12px;overflow:hidden}
.dxprogress i{display:block;height:100%;background:var(--green);transition:width .2s}

.dxprompt{margin:0;font-size:14.5px;color:var(--text)}
.dxcontext{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.dxmsg{margin:0 0 8px;font-size:14px;color:var(--text)}
.dxmsg b{color:var(--amber);font-family:var(--mono);font-size:13px}

.dxhints{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.dxhints .rung{
  font-size:13.5px;color:var(--muted);border-left:2px solid var(--line2);padding-left:12px;
}
.dxhints .rung b{color:var(--green)}

.dxacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dxacts kbd{
  font-family:var(--mono);font-size:9.5px;border:1px solid var(--line2);border-radius:3px;
  padding:0 4px;margin-left:5px;color:var(--dim);
}

/* The move list is the answer sheet, so the future is blanked but its shape kept. */
.mv.mask{
  display:inline-block;color:var(--dim);opacity:.4;letter-spacing:.1em;
  padding:2px 6px;user-select:none;
}

/* ---------- board interaction ---------- */
.board.dxlive{touch-action:none}
.board.dxlive .sq{cursor:pointer}

.sq.dxsel::after{
  content:"";position:absolute;inset:0;z-index:1;
  box-shadow:inset 0 0 0 3px var(--cue);background:rgba(143,191,82,.28);
}
.sq.dxcur::before{
  content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);
}
.sq.dxhint::after{
  content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;
  transform:translate(-50%,-50%);border-radius:50%;background:rgba(35,33,32,.42);z-index:1;
}
.sq.dxhint.dxcap::after{
  width:86%;height:86%;background:none;border-radius:50%;
  box-shadow:inset 0 0 0 4px rgba(35,33,32,.42);
}
/* Feedback is carried by a colour class held by a JS timeout, not by the
   animation: prefers-reduced-motion kills every animation on this page, and a
   cue nobody can see is not a cue. */
.sq.dxnope::after{
  content:"";position:absolute;inset:0;z-index:1;background:rgba(204,106,98,.55);
  animation:dxshake .22s ease-in-out 2;
}
@keyframes dxshake{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-7%)} 75%{transform:translateX(7%)}
}

/* Severity is never carried by colour alone: every chip states its word, and
   dxSay() puts the same word into the live region. */

.dxdev:disabled{opacity:.4;cursor:default}
.dxdev kbd,.brchip kbd,.devcancel kbd{

<template id="primer">
  <div class="ophead">
    <div class="opkicker"><span>Start here</span><span class="sep">/</span><span class="lvl">Read once, use forever</span></div>
    <h2 class="opname">How openings actually work</h2>
    <p class="optag">Openings are not a list of moves to memorise. They are twelve or so ideas, reused in different orders. Learn the ideas and you can reconstruct the moves.</p>
  </div>

  <div class="primer">
    <p class="lead">There are only three things happening in every opening ever played: the fight for the centre, the race to develop, and the question of where the king will be safe. Every move in this course is one of those three, or a preparation for one of them.</p>

    <h3>The rules the whole course is built on</h3>
    <ol class="rules">
      <li><b>Fight for the centre</b><span>A piece in the middle of the board touches more squares than the same piece on the edge. Pawns on d4/e4 (or d5/e5) take squares away from the opponent's pieces before those pieces even move. You can occupy the centre with pawns, or control it from a distance with pieces &mdash; both work, and the difference between those two philosophies is the difference between the Queen's Gambit and the King's Indian.</span></li>
      <li><b>Develop with purpose, knights before bishops</b><span>Get a new piece into the game every move. Knights first, because a knight's best square is usually obvious on move two while a bishop's depends on where the pawns end up. Never move the same piece twice in the opening unless there is a concrete reason &mdash; every repeat move is a free move for your opponent.</span></li>
      <li><b>Castle early, usually before move ten</b><span>The king in the centre is the single most common cause of a lost game below master level. Castling also connects the rooks, which is how they enter the game at all.</span></li>
      <li><b>Do not bring the queen out early</b><span>An early queen looks aggressive and simply loses time. Every developing move your opponent makes chases her, and you end up three moves behind with nothing to show for it.</span></li>
      <li><b>Attack a pawn chain at its base</b><span>A chain of pawns is only as strong as the pawn holding it up. This one idea explains the French Defence, the King's Indian, the Advance Caro-Kann and half the positions in this course.</span></li>
      <li><b>Every advantage is paid for</b><span>Space costs flexibility. Extra material costs time. A strong bishop costs a weak colour complex. When you see a move that looks free, look for the bill.</span></li>
    </ol>

    <h3>How to use this course</h3>
    <p>Pick one opening for White with 1.e4 or 1.d4, one answer to 1.e4, and one answer to 1.d4. That is your whole repertoire &mdash; three openings, not twelve. Step through each variation with the arrow keys until you can predict the next move before you press it, then read the plans card underneath and try to explain the position out loud in your own words.</p>
    <p>Do not memorise past the point where you understand. A player who knows six moves and the reason behind them beats a player who knows twenty and no reasons, because the second player is lost the moment the opponent deviates &mdash; and the opponent always deviates.</p>

    <h3>The vocabulary you need</h3>
    <dl class="gloss">
      <dt>Tempo</dt><dd>One move's worth of time. If your opponent has to move a piece twice because you attacked it, you have won a tempo. Gambits are the purchase of tempi with material.</dd>
      <dt>Development</dt><dd>How many of your pieces are off their starting squares and doing something useful. Rooks on their original squares do not count.</dd>
      <dt>Pawn structure</dt><dd>The skeleton of the position. Pieces move; pawns mostly do not. That is why the structure determines the plan &mdash; it is the part of the position you cannot take back.</dd>
      <dt>Outpost</dt><dd>A square in or near the enemy camp that cannot be attacked by an enemy pawn. A knight on an outpost is often worth more than a rook.</dd>
      <dt>The bishop pair</dt><dd>Having both bishops when your opponent has one bishop and a knight. Worth roughly half a pawn, and much more in open positions where the bishops have long diagonals.</dd>
      <dt>Bad bishop</dt><dd>A bishop trapped behind its own pawns on the same colour squares. The French Defence's light-squared bishop is the most famous example in chess.</dd>
      <dt>Prophylaxis</dt><dd>Stopping your opponent's idea before they have played it. Moves like h3 and a3 look like a wasted tempo and are often the strongest move on the board.</dd>
      <dt>Minority attack</dt><dd>Advancing two pawns against three to force a weakness. The defining plan of the Exchange Queen's Gambit.</dd>
      <dt>Isolated queen's pawn (IQP)</dt><dd>A d-pawn with no friendly pawns beside it. A weakness in the endgame and an attacking engine in the middlegame &mdash; whoever has it must attack now.</dd>
      <dt>ECO code</dt><dd>The catalogue number for an opening (A00&ndash;E99), used by every database and book. Useful for looking up more once you have chosen a repertoire.</dd>
    </dl>

    <h3>Reading the board cues</h3>
    <p>Every move in this course is annotated the way a good coach or a book like Chernev's <em>Logical Chess: Move by Move</em> would: not just <em>what</em> was played, but what it does. Under each move you'll see an <b>On the board</b> line — generated by a chess engine, so it's always accurate — telling you what the move attacks, defends, and which squares it controls. Turn the arrows on (the button under the board) to see the same information drawn on the pieces, chess.com style:</p>
    <ul class="learn" style="margin-top:6px">
      <li>A <span style="color:#7CA35A;font-weight:600">green</span> arrow is the move just played.</li>
      <li>A <span style="color:#D24B3C;font-weight:600">red</span> arrow means the moved piece attacks an enemy piece on that square — a capture or a threat.</li>
      <li>A <span style="color:#EA3B33;font-weight:600">bright red</span> arrow is a check.</li>
      <li>A <span style="color:#4E8AD6;font-weight:600">blue</span> arrow means the move defends one of your own pieces that was under attack.</li>
      <li>A dashed <span style="color:#C79A34;font-weight:600">amber ring</span> marks a key central square the piece now controls — the quiet, positional part of a move.</li>
    </ul>
    <p>The aim is Fine's and Chernev's: once you can see <em>why</em> a move is played — what it hits, what it guards, what it fights for — you stop memorising and start understanding, and you can find reasonable moves even when your opponent leaves the book.</p>

    <h3>Reading the notation</h3>
    <p>Files are lettered a&ndash;h from White's left, ranks are numbered 1&ndash;8 from White's side. Pieces are K (king), Q (queen), R (rook), B (bishop), N (knight); a pawn move is written with no letter. <span style="font-family:var(--mono)">Nf3</span> means a knight moves to f3, <span style="font-family:var(--mono)">exd5</span> means the e-file pawn captures on d5, <span style="font-family:var(--mono)">O-O</span> is castling kingside and <span style="font-family:var(--mono)">O-O-O</span> is castling queenside. A move written <span style="font-family:var(--mono)">3...Bb4</span> is Black's third move; <span style="font-family:var(--mono)">3.Bb4</span> would be White's.</p>
  </div>

const DATA = [{"id":"italian","name":"Italian Game","eco":"C50\u2013C54","section":"white-e4","orientation":"white","tagline":"Bishop to c4, eyes on f7. The oldest opening still played at the top level.","level":"Beginner \u2192 Master","theory":{"big_idea":"White develops the light-squared bishop to its most aggressive diagonal (a2\u2013g8) where it stares at f7. f7 is the weakest point in Black's position because it is defended only by the king. Everything else in the Italian flows from that one bishop: whether White builds a big pawn centre with c3 and d4, sacrifices a pawn to rip open lines, or plays a slow build-up and attacks later.","structure":"Symmetrical e-pawns on e4/e5 with pawns still on d2/d7. This is the classic 'Open Game' skeleton. The tension is over whether White gets in d2\u2013d4 under good circumstances. If White does, the position opens and development counts. If Black stops it, the game becomes a slow manoeuvring battle where knight routes decide everything.","white_plans":["Play c3 then d4, building the ideal pawn duo on d4+e4 and opening lines while ahead in development.","The modern slow build: d3, O-O, Re1, Nbd2\u2013f1\u2013g3, then h3 and a delayed d4. White keeps the tension for twenty moves and outmanoeuvres Black.","Direct attack on f7 with Ng5 (in the Two Knights) or a pawn sacrifice with b4 (Evans Gambit) to seize the centre by force.","Rook lift Re1\u2013e3\u2013g3 or a kingside pawn storm once Black's counterplay on the queenside is contained."],"black_plans":["Mirror the setup with ...Bc5, ...d6, ...Nf6, ...O-O and hold the centre; then re-route a knight via ...Ne7\u2013g6 or hit back with ...d5.","Play the sharp ...Nf6 (Two Knights) inviting 4.Ng5 and answering with the Polerio counter-gambit 4...d5 5.exd5 Na5!","Retreat the bishop to a7 in advance so that White's d4 never comes with tempo.","Trade off White's strong Italian bishop with ...Na5 or ...Be6."],"traps":["The Fried Liver Attack: 3...Nf6 4.Ng5 d5 5.exd5 Nxd5?? 6.Nxf7! Kxf7 7.Qf3+ and Black's king is dragged into the open. Black must play 5...Na5!","The Legal Trap pattern: if Black pins with ...Bg4 and grabs too greedily, White can sometimes sacrifice the queen with Nxe5 followed by Bxf7+ and Nd5#.","Blackburne Shilling Trap (Black's trap): 3...Nd4?! 4.Nxe5?? Qg5! 5.Nxf7 Qxg2 6.Rf1 Qxe4+ and White collapses. Correct is 4.Nxd4."],"who":"Play this if you like clear, natural development and open positions where tactics decide. It teaches you more about basic chess principles than any other opening."},"lines":[{"name":"Giuoco Pianissimo \u2014 Main Line","note":"The modern main line. White plays d3 instead of d4 and manoeuvres slowly. This is what Carlsen, Caruana and Nepomniachtchi actually play.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w","legal":"g1h3g1f3b1c3b1a3h2h3g2g3f2f3e2e3d2d3c2c3b2b3a2a3h2h4g2g4f2f4e2e4d2d4c2c4b2b4a2a4"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5","legal":"g8h6g8f6b8c6b8a6h7h6g7g6f7f6e7e6d7d6c7c6b7b6a7a6h7h5g7g5f7f5e7e5d7d5c7c5b7b5a7a5"},{"san":"e5","fen":"rnbqkbnrpppp.ppp............p.......P...........PPPP.PPPRNBQKBNR","from":"e7","to":"e5","note":"Black meets force with force and stakes an equal claim to the centre. This is the Open Game \u2014 the most classical, most principled reply there is.","num":"1...e5","turn":"b","check":false,"arrows":[{"f":"e7","t":"e5", ...PP.N..PP...PPPRNBQR.K.","from":"f1","to":"e1","note":"The rook goes behind the e-pawn. It looks passive now, but the moment the e-file opens it will be the best-placed piece on the board.","num":"7.Re1","turn":"w","check":false,"arrows":[{"f":"f1","t":"e1","k":"move"},{"f":"e1","t":"e4","k":"def"},{"f":"e1","t":"e3","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls e3","legal":"g8h8f8e8d8e8d8e7d8d7c8d7c8e6c8f5c8g4c8h3a8b8f6e8f6d7f6h5f6d5f6g4f6e4c6b8c6e7c6a5c6d4c6b4c5b6c5d4c5b4c5e3c5a3c5f2h7h6g7g6b7b6a7a6d6d5h7h5g7g5b7b5a7a5","bx":8},{"san":"a6","fen":"r.bq.rk..pp..pppp.np.n....b.p.....B.P.....PP.N..PP...PPPRNBQR.K.","from":"a7","to":"a6","note":"A tiny move with three jobs: it stops Bb5 and Nb5 forever, prepares ...b5 to kick the bishop, and clears a6 for a piece.","num":"7...a6","turn":"b","check":false,"arrows":[{"f":"a7","t":"a6","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure","legal":"c4f7c4e6c4a6c4d5c4b5c4b3f3g5f3e5f3h4f3d4f3d2g1h1g1f1e1e3e1e2e1f1d1a4d1b3d1e2d1d2d1c2c1h6c1g5c1f4c1e3c1d2b1a3b1d2d3d4h2h3g2g3b2b3a2a3h2h4g2g4b2b4a2a4"},{"san":"Nbd2","fen":"r.bq.rk..pp..pppp.np.n....b.p.....B.P.....PP.N..PP.N.PPPR.BQR.K.","from":"b1","to":"d2","note":"The knight begins its famous journey: d2\u2013f1\u2013g3 (or e3). It takes three moves, but on g3 it supports f5 and h5 and joins a kingside attack. This manoeuvre was borrowed straight from the Ruy Lopez.","num":"8.Nbd2","turn":"w","check":false,"arrows":[{"f":"b1","t":"d2","k":"move"},{"f":"d2","t":"e4","k":"def"}],"tactics":"Defends the pawn on e4","legal":"g8h8f8e8d8e8d8e7d8d7c8d7c8e6c8f5c8g4c8h3a8b8a8a7f6e8f6d7f6h5f6d5f6g4f6e4c6b8c6e7c6a7c6a5c6d4c6b4c5a7c5b6c5d4c5b4c5e3c5a3c5f2h7h6g7g6b7b6d6d5a6a5h7h5g7g5b7b5","bx":9},{"san":"Ba7","fen":"r.bq.rk.bpp..pppp.np.n......p.....B.P.....PP.N..PP.N.PPPR.BQR.K.","from":"c5","to":"a7","note":"The bishop steps off the a7\u2013g1 diagonal's firing line before White plays d4 with tempo. Prophylaxis: stopping the opponent's idea before it exists.", 4c3c4b2b3b2b4"},{"san":"b4","fen":"r.....k.bpq..pp.p.pprnnp....p...PP.PP.....P..NNP...B.PP.R..QR.K.","from":"b2","to":"b4","note":"The break. Two wings, two threats: b5 hitting c6, and eventually a5 and Ba3 against d6. This is what the nine quiet moves were for \u2014 White now attacks on the side where Black is weakest, with every piece already placed.","num":"17.b4","turn":"w","check":false,"arrows":[{"f":"b2","t":"b4","k":"move"},{"f":"b4","t":"c5","k":"ctrl"}],"tactics":"Controls c5"}],"tier":"Foundation","plan":{"structure":"italian-big-centre","tier":"Plans","point":"The knight tour is finished, the centre is still tense, and now you open a second front \u2014 because a position with only one weakness is usually holdable.","next":["17...Rae8 18.b5 axb5 19.axb5 and the a-file points straight at the bishop on a7.","b5 first, hitting c6; a4\u2013a5 next, taking b6 away; and only then look at the kingside.","Keep the centre tense as long as Black has to watch it. d4\u2013d5 releases the tension and frees Black's pieces \u2014 save it for the moment you want the queenside closed."],"endgame":"If it simplifies you are heading for a rook endgame with a queenside majority against a kingside majority. Push the queenside pawns; the outside passer beats the extra central pawn nine times in ten."}}],"progression":{"arc":"The Italian is where you learn what the opening principles actually mean. Everything you build later stands on this.","stages":[{"tier":"Foundation","when":"Your first week with it","goal":"Reach a healthy position by move ten without thinking.","learn":["The six-move skeleton: e4, Nf3, Bc4, c3, d3, O-O. Play it against anything Black does on move three.","Why Bc4 and not Bb5 or Be2 \u2014 the f7 square is defended only by the king, so it is the one target that exists from move one.","The three ways Black can answer 3.Bc4: 3...Bc5 (Giuoco), 3...Nf6 (Two Knights), 3...Be7 (Hungarian). You need a reply to each."],"drill":"Set the board up and play the six-move skeleton twenty times against a friend or an engine at low strength. Your hands should know it before your head does.","mistake":"Playing 4.Ng5 in every position because it 'attacks f7'. It is one idea, not a plan, and a prepared opponent punishes it.","ready":"You can play the first eight moves without pausing and explain why each piece went where it did."},{"tier":"Structure","when":"Weeks two to four","goal":"Understand the d4 break \u2014 when it wins the game and when it throws it away.","learn":["The difference between 5.d4 (immediate, opens the game while Black is behind) and 5.d3 (slow, keeps the tension). Modern practice prefers d3.","What happens to the pawn structure after ...exd4 cxd4 \u2014 White gets d4+e4 and the c-file, Black gets the d5 square and a target.","Why ...a6 and ...Ba7 exist: Black is removing d4 from your list of good moves before you play it."],"drill":"Take the main-line position after 8.Nbd2 and write down, in words, three plans for White and three for Black. Then check them against the plans card above.","mistake":"Playing d4 the moment it is legal. In the Pianissimo you are supposed to spend eight moves earning it.","ready":"You can look at an Italian position and say whether the centre should be opened or kept closed, and why."},{"tier":"Plans","when":"Months two and three","goal":"Play the middlegame, not just the opening.","learn":["The knight tour Nb1\u2013d2\u2013f1\u2013g3 and its cousin ...Nc6\u2013e7\u2013g6. Both sides re-route toward the kingside; whoever finishes first attacks first.","The rook lift Re1\u2013e3\u2013g3 and when the e-file is worth more than the attack.","How to meet ...d5: usually exd5 followed by piece pressure, occasionally e5 gaining space."],"drill":"Play ten games where you commit to reaching the Pianissimo tabiya and then attacking the kingside. Lose some. Note where the attack ran out of pieces.","mistake":"Attacking with two pieces. An attack needs three or four attackers against the defenders present \u2014 count before you commit.","ready":"You have won a game with the Nf1\u2013g3 manoeuvre and lost one because you attacked too early. Both lessons matter."},{"tier":"Mastery","when":"Ongoing","goal":"Own the sharp branches and the endgames.","learn":["The Evans Gambit as a surprise weapon, including the critical defences 5...Ba5, 5...Bc5 and 5...Be7.","The Two Knights in full: the Fried Liver, the Polerio 5...Na5, the Traxler 4...Bc5!?, and the modern 4.d4.","Endgames from the Italian: bishop against knight with pawns on both wings, and how the extra central pawn tells."],"drill":"Take one Evans Gambit line and analyse it thirty moves deep with an engine, then close the engine and try to explain the evaluation.","mistake":"Treating the gambit lines as tricks. At any decent level they are real openings with real theory.","ready":"You can play both sides of the Two Knights and you know which side you would rather have."}],"study":"Paul Morphy for the attacking version, Anatoly Karpov and Magnus Carlsen for the modern slow build. Kasparov\u2013Anand, Riga 1995 is the most famous Evans Gambit of the last century.","next":"Once the Italian feels automatic, learn the Ruy Lopez. The ideas transfer directly and the Ruy is simply a better version of the same opening."},"branchsets":[[{"san":"Nf6","sev":"playable","why":"Black ignores e5 and counterattacks e4 \u2014 your own idea, played back at you. There is nothing to refute: 3.Nxe5 d6 4.Nf3 Nxe4 5.d4 gives a normal game with a small pull. You are simply not in the Italian any more, and that is allowed.","plies":[{"san":"Nf6","fen":"rnbqkb.rpppp.ppp.....n......p.......P........N..PPPP.PPPRNBQKB.R","from":"g8","to":"f6","num":"2...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"e4","k":"atk"},{"f":"f6","t":"d5","k":"ctrl"}],"tactics":"Attacks the pawn on e4 (undefended!); controls d5"},{"san":"Nxe5","fen":"rnbqkb.rpppp.ppp.....n......N.......P...........PPPP.PPPRNBQKB.R","fr ,"arrows":[{"f":"d7","t":"d6","k":"move"},{"f":"d6","t":"e5","k":"def"},{"f":"d6","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls c5"},{"san":"d4","fen":"r.bqkbnrppp..ppp..np........p.....BPP........N..PPP..PPPRNBQK..R","from":"d2","to":"d4","num":"4.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"atk"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls c5"},{"san":"exd4","fen":"r.bqkbnrppp..ppp..np..............BpP........N..PPP..PPPRNBQK..R","from":"e5","to":"d4","num":"4...exd4","turn":"b","check":false,"arrows":[{"f":"e5","t":"d4","k":"move"},{"f":"d4","t":"e3","k":"ctrl"}],"tactics":"Controls e3"},{"san":"Nxd4","fen":"r.bqkbnrppp..ppp..np..............BNP...........PPP..PPPRNBQK..R","from":"f3","to":"d4","num":"5.Nxd4","turn":"w","check":false,"arrows":[{"f":"f3","t":"d4","k":"move"},{"f":"d4","t":"c6","k":"atk"},{"f":"d4","t":"f5","k":"ctrl"},{"f":"d4","t":"e6","k":"ctrl"}],"tactics":"Attacks the knight on c6; controls f5 and e6"}],"tier":"Foundation","name":"Semi-Italian"},{"san":"h6","sev":"playable","why":"Extremely common and not a mistake, just a slow one. It stops Ng5 forever, which is fine, except that Ng5 was never your main plan. Take the free tempo with 4.d4 and thank Black for it.","plies":[{"san":"h6","fen":"r.bqkbnrpppp.pp...n....p....p.....B.P........N..PPPP.PPPRNBQK..R","from":"h7","to":"h6","num":"3...h6","turn":"b","check":false,"arrows":[{"f":"h7","t":"h6","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"d4","fen":"r.bqkbnrpppp.pp...n....p....p.....BPP........N..PPP..PPPRNBQK..R","from":"d2","to":"d4","num":"4.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"atk"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls c5"},{"san":"exd4","fen":"r.bqkbnrpppp.pp...n....p..........BpP........N..PPP..PPPRNBQK..R","from":"e5","to":"d4","num":"4...exd4","turn":"b","che "r.bqkbnrpppp.ppp........n...p.....B.P........N..PPPP.PPPRNBQK..R","from":"c6","to":"a5","num":"3...Na5","turn":"b","check":false,"arrows":[{"f":"c6","t":"a5","k":"move"},{"f":"a5","t":"c4","k":"atk"}],"tactics":"Attacks the bishop on c4 (undefended!)"},{"san":"Bxf7+","fen":"r.bqkbnrpppp.Bpp........n...p.......P........N..PPPP.PPPRNBQK..R","from":"c4","to":"f7","num":"4.Bxf7+","turn":"w","check":true,"arrows":[{"f":"c4","t":"f7","k":"move"},{"f":"f7","t":"e8","k":"chk"},{"f":"f7","t":"g8","k":"atk"},{"f":"f7","t":"d5","k":"ctrl"},{"f":"f7","t":"c4","k":"ctrl"}],"tactics":"Gives check; attacks the knight on g8; controls d5 and c4"},{"san":"Kxf7","fen":"r.bq.bnrpppp.kpp........n...p.......P........N..PPPP.PPPRNBQK..R","from":"e8","to":"f7","num":"4...Kxf7","turn":"b","check":false,"arrows":[{"f":"e8","t":"f7","k":"move"},{"f":"f7","t":"e6","k":"ctrl"}],"tactics":"Controls e6"},{"san":"Nxe5+","fen":"r.bq.bnrpppp.kpp........n...N.......P...........PPPP.PPPRNBQK..R","from":"f3","to":"e5","num":"5.Nxe5+","turn":"w","check":true,"arrows":[{"f":"f3","t":"e5","k":"move"},{"f":"e5","t":"d7","k":"atk"},{"f":"e5","t":"f7","k":"chk"},{"f":"e5","t":"c4","k":"ctrl"},{"f":"e5","t":"d3","k":"ctrl"}],"tactics":"Gives check; attacks the pawn on d7; controls c4 and d3"},{"san":"Ke7","fen":"r.bq.bnrppppk.pp........n...N.......P...........PPPP.PPPRNBQK..R","from":"f7","to":"e7","num":"5...Ke7","turn":"b","check":false,"arrows":[{"f":"f7","t":"e7","k":"move"},{"f":"e7","t":"d7","k":"def"},{"f":"e7","t":"d6","k":"ctrl"},{"f":"e7","t":"e6","k":"ctrl"}],"tactics":"Defends the pawn on d7; controls d6 and e6"},{"san":"d4","fen":"r.bq.bnrppppk.pp........n...N......PP...........PPP..PPPRNBQK..R","from":"d2","to":"d4","num":"6.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls c5"}],"tier":"Structure"}],[{"san":"d3","sev":"playable","why":"The move-order shortcut: d3 first, c3 later. You reach the same Pianissimo and you sides th c3 and d4 while Black's pieces are tangled defending e5, then manoeuvre the knight to g3 and attack the kingside. It is the opening of long-term positional pressure.","structure":"White gets a broad centre with pawns on d4 and e4 supported by c3. Black usually plays ...d6 and ...b5 and then either holds with ...c5 (the Chigorin) or breaks with ...d5 (the Marshall Attack, a whole-pawn gambit). The Exchange Variation produces a completely different structure: Black gets doubled c-pawns but the bishop pair.","white_plans":["The Spanish manoeuvre: Nb1\u2013d2\u2013f1\u2013g3 (sometimes on to f5 or h5), the classic slow build-up toward a kingside attack.","Establish the pawn centre with c3 and d4, then decide whether to release the tension with d5 (closing) or dxe5 (opening).","The Exchange Variation: 4.Bxc6 dxc6 wrecks Black's queenside pawn structure. White plays for a winning king-and-pawn endgame from move four.","a4 undermining Black's b5\u2013c6 queenside chain."],"black_plans":["The Breyer/Chigorin retreat: re-route the knight from c6 to b8\u2013d7 or a5\u2013c4 and slowly untangle.","The Marshall Attack: sacrifice a pawn with ...d5 for a lasting initiative against White's king.","The Berlin Defence: force an early queen trade and head for a slightly worse but extremely tough endgame with the bishop pair. This is the opening that ended Kasparov's title reign.","Break with ...d5 or ...f5 once White's centre is committed."],"traps":["The Noah's Ark Trap: after an early ...b5 and ...c5, Black's queenside pawns can roll forward and physically trap White's bishop on b3 \u2014 ...c4 and ...b5\u2013b4 nets a piece.","Do not play 4.Ba4 Nf6 5.O-O Nxe4 6.Re1?! d5 7.Nxe5 \u2014 this is the Riga/Open Spanish, sharp and double-edged, not a free piece.","Never grab with 4.Bxc6 dxc6 5.Nxe5?? \u2014 5...Qd4! forks e5 and e4."],"who":"Play this if you are willing to invest in theory and you enjoy squeezing opponents slowly. It rewards patience and understanding, not memorised tricks."},"lines":[{"name":"Closed Ruy Lopez \u2014 Chigorin","note":"The classical main line, played in thousands of grandmaster games. Both sides develop fully before the fight begins.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"e5","fen":"rnbqkbnrpppp.ppp............p.......P...........PPPP.PPPRNBQKBNR","from":"e7","to":"e5","note":"Black meets force with force and stakes an equal claim to the centre. This is the Open Game \u2014 the most classical, most principled reply there is.","num":"1...e5","turn":"b","check":false,"arrows":[{"f":"e7","t":"e5","k":"move"},{"f":"e5","t":"d4","k":"ctrl"},{"f":"e5","t":"f4","k":"ctrl"}],"tactics":"Controls d4 and f4"},{"san":"Nf3","fen":"rnbqkbnrpppp.ppp............p.......P........N..PPPP.PPPRNBQKB.R","from":"g1","to":"f3","note":"Develops a piece, attacks e5, and heads for castling. Knights before bishops: the knight's best square is obvious this early, the bishop's is not.","num":"2.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"atk"},{"f":"f3","t":"d4","k":"ctrl"}],"tactics":"Attacks the pawn on e5 (undefended!); controls d4"},{"san":"Nc6","fen":"r.bqkbnrpppp.ppp..n.........p.......P........N..PPPP.PPPRNBQKB.R","from":"b8","to":"c6","note":"The natural defender of e5 and a developing 7; controls d5 and c4"},{"san":"d6","fen":"r.bqk..r..p.bpppp.np.n...p..p.......P....B...N..PPPP.PPPRNBQR.K.","from":"d7","to":"d6","note":"Shoring up e5 and finally freeing the c8-bishop.","num":"7...d6","turn":"b","check":false,"arrows":[{"f":"d7","t":"d6","k":"move"},{"f":"d6","t":"e5","k":"def"},{"f":"d6","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls c5"},{"san":"c3","fen":"r.bqk..r..p.bpppp.np.n...p..p.......P....BP..N..PP.P.PPPRNBQR.K.","from":"c2","to":"c3","note":"Preparing d4 and giving the bishop the retreat square c2 in advance. The Ruy Lopez is a slow-motion opening.","num":"8.c3","turn":"w","check":false,"arrows":[{"f":"c2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"O-O","fen":"r.bq.rk...p.bpppp.np.n...p..p.......P....BP..N..PP.P.PPPRNBQR.K.","from":"e8","to":"g8","note":"King safety.","num":"8...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"},{"f":"g8","t":"f7","k":"def"}],"tactics":"Defends the pawn on f7"},{"san":"h3","fen":"r.bq.rk...p.bpppp.np.n...p..p.......P....BP..N.PPP.P.PP.RNBQR.K.","from":"h2","to":"h3","note":"Almost always played in the Ruy: it stops ...Bg4 pinning the knight, which would undermine the defence of d4.","num":"9.h3","turn":"w","check":false,"arrows":[{"f":"h2","t":"h3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Na5","fen":"r.bq.rk...p.bpppp..p.n..np..p.......P....BP..N.PPP.P.PP.RNBQR.K.","from":"c6","to":"a5","note":"The Chigorin plan. The knight goes to the edge on purpose to hit the b3-bishop, and later returns via c6 or c4.","num":"9...Na5","turn":"b","check":false,"arrows":[{"f":"c6","t":"a5","k":"move"},{"f":"a5","t":"b3","k":"atk"},{"f":"a5","t":"c4","k":"ctrl"}],"tactics":"Attacks the bishop on b3; controls c4"},{"san":"Bc2","fen":"r.bq.rk...p.bpppp..p.n..np..p.......P.....P..N.PPPBP.PP.RNBQR.K.","from":"b3","to":"c2","note":"The bishop finds its final home. It now aims at h7 \u2014 the future attacki ics":"Attacks the pawn on e4 (undefended!); controls d5"},{"san":"O-O","fen":"r.bqkb.r.ppp.pppp.n..n......p...B...P........N..PPPP.PPPRNBQ.RK.","from":"e1","to":"g1","note":"Castling and ignoring e4! If 5...Nxe4 6.d4 Black cannot hold the extra pawn, because of the Bb3/Re1 pressure and d4\u2013d5 tricks.","num":"5.O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"g1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Be7","fen":"r.bqk..r.pppbpppp.n..n......p...B...P........N..PPPP.PPPRNBQ.RK.","from":"f8","to":"e7","note":"Solid development, unpinning nothing but preparing to castle and stay compact.","num":"5...Be7","turn":"b","check":false,"arrows":[{"f":"f8","t":"e7","k":"move"},{"f":"e7","t":"c5","k":"ctrl"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Controls c5 and d6"},{"san":"Re1","fen":"r.bqk..r.pppbpppp.n..n......p...B...P........N..PPPP.PPPRNBQR.K.","from":"f1","to":"e1","note":"Now the e-pawn is properly defended and the rook sits on the file it will fight on.","num":"6.Re1","turn":"w","check":false,"arrows":[{"f":"f1","t":"e1","k":"move"},{"f":"e1","t":"e4","k":"def"},{"f":"e1","t":"e3","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls e3"},{"san":"b5","fen":"r.bqk..r..ppbpppp.n..n...p..p...B...P........N..PPPP.PPPRNBQR.K.","from":"b7","to":"b5","note":"The critical moment: Black must gain space on the queenside before White plays a4, and this hits the bishop.","num":"6...b5","turn":"b","check":false,"arrows":[{"f":"b7","t":"b5","k":"move"},{"f":"b5","t":"a4","k":"atk"},{"f":"b5","t":"c4","k":"ctrl"}],"tactics":"Attacks the bishop on a4 (undefended!); controls c4"},{"san":"Bb3","fen":"r.bqk..r..ppbpppp.n..n...p..p.......P....B...N..PPPP.PPPRNBQR.K.","from":"a4","to":"b3","note":"The bishop retreats to its long-term home. From b3 it will keep staring at f7 and the a2\u2013g8 diagonal for the rest of the game.","num":"7.Bb3","turn":"w","check":false,"arrows":[{"f":"a4","t":"b3","k":"move"},{"f":"b3","t":"f7","k":"atk"},{"f":"b3","t":"d5","k":"ctrl"},{"f":"b3","t":"c4","k":"ctrl"}],"tactics":"Attacks the pawn on f7; controls d5 and c4"},{"san":"d6","fen":"r.bqk..r..p.bpppp.np.n...p..p.......P....B...N..PPPP.PPPRNBQR.K.","from":"d7","to":"d6","note":"Shoring up e5 and finally freeing the c8-bishop.","num":"7...d6","turn":"b","check":false,"arrows":[{"f":"d7","t":"d6","k":"move"},{"f":"d6","t":"e5","k":"def"},{"f":"d6","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls c5"},{"san":"c3","fen":"r.bqk..r..p.bpppp.np.n...p..p.......P....BP..N..PP.P.PPPRNBQR.K.","from":"c2","to":"c3","note":"Preparing d4 and giving the bishop the retreat square c2 in advance. The Ruy Lopez is a slow-motion opening.","num":"8.c3","turn":"w","check":false,"arrows":[{"f":"c2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"O-O","fen":"r.bq.rk...p.bpppp.np.n...p..p.......P....BP..N..PP.P.PPPRNBQR.K.","from":"e8","to":"g8","note":"King safety.","num":"8...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"},{"f":"g8","t":"f7","k":"def"}],"tactics":"Defends the pawn on f7"},{"san":"h3","fen":"r.bq.rk...p.bpppp.np.n...p..p.......P....BP..N.PPP.P.PP.RNBQR.K.","from":"h2","to":"h3","note":"Almost always played in the Ruy: it stops ...Bg4 pinning the knight, which would undermine the defence of d4.","num":"9.h3","turn":"w","check":false,"arrows":[{"f":"h2","t":"h3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Na5","fen":"r.bq.rk...p.bpppp..p.n..np..p.......P....BP..N.PPP.P.PP.RNBQR.K.","from":"c6","to":"a5","note":"The Chigorin plan. The knight goes to the edge on purpose to hit the b3-bishop, and later returns via c6 or c4.","num":"9...Na5","turn":"b","check":false,"arrows":[{"f":"c6","t":"a5","k":"move"},{"f":"a5","t":"b3","k":"atk"},{"f":"a5","t":"c4","k":"ctrl"}],"tactics":"Attacks the bishop on b3; controls c4"},{"san":"Bc2","fen":"r.bq.rk...p.bpppp..p.n..np..p.......P.....P..N.PPPBP.PP.RNBQR.K.","from":"b3","to":"c2","note":"The bishop finds its final home. It now aims at h7 \u2014 the future attacking diagonal.","num":"10.Bc2","turn":"w","check":false,"arrows":[{"f":"b3","t":"c2","k":"move"},{"f":"c2","t":"e4","k":"def"},{"f":"c2","t":"d3","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls d3"},{"san":"c5","fen":"r.bq.rk.....bpppp..p.n..npp.p.......P.....P..N.PPPBP.PP.RNBQR.K.","from":"c7","to":"c5","note":"Black challenges the centre before White gets in d4 for free.","num":"10...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"d4","fen":"r.bq.rk.....bpppp..p.n..npp.p......PP.....P..N.PPPB..PP.RNBQR.K.","from":"d2","to":"d4","note":"White finally plays the break, with maximum support. Now the whole game is about whether White plays d5 (closing the centre and attacking on the kingside) or keeps the tension.","num":"11.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"c5","k":"atk"},{"f":"d4","t":"e5","k":"atk"}],"tactics":"Attacks the pawn on c5 and the pawn on e5"},{"san":"Qc7","fen":"r.b..rk...q.bpppp..p.n..npp.p......PP.....P..N.PPPB..PP.RNBQR.K.","from":"d8","to":"c7","note":"Black's queen takes up its standard post, adding pressure to e5 and c-file.","num":"11...Qc7","turn":"b","check":false,"arrows":[{"f":"d8","t":"c7","k":"move"},{"f":"c7","t":"c5","k":"def"}],"tactics":"Defends the pawn on c5"},{"san":"Nbd2","fen":"r.b..rk...q.bpppp..p.n..npp.p......PP.....P..N.PPPBN.PP.R.BQR.K.","from":"b1","to":"d2","note":"The knight finally develops \u2014 to d2, of course, heading for f1 and g3. In the Ruy this knight is always the last piece out and often the most important.","num":"12.Nbd2","turn":"w","check":false,"arrows":[{"f":"b1","t":"d2","k":"move"},{"f":"d2","t":"e4","k":"def"},{"f":"d2","t":"c4","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls c4"},{"san":"cxd4","fen":"r.b..rk...q.bpppp..p.n..np..p......pP.....P..N.PPPBN.PP.R.BQR.K.","from":"c5","to":"d4","note":"Black resolves the tension. It concedes the centre a little, but it opens the c-file and frees the c6 square for the offside knight.","num":"12...cxd4","turn":"b","check":false,"arrows":[{"f":"c5","t":"d4","k":"move"},{"f":"d4","t":"c3","k":"atk"},{"f":"d4","t":"e3","k":"ctrl"}],"tactics":"Attacks the pawn on c3; controls e3"},{"san":"cxd4","fen":"r.b..rk...q.bpppp..p.n..np..p......PP........N.PPPBN.PP.R.BQR.K.","from":"c3","to":"d4","note":"Recapturing with the pawn, keeping a broad centre on d4 and e4.","num":"13.cxd4","turn":"w","check":false,"arrows":[{"f":"c3","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"atk"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls c5"},{"san":"Nc6","fen":"r.b..rk...q.bpppp.np.n...p..p......PP........N.PPPBN.PP.R.BQR.K.","from":"a5","to":"c6","note":"The knight comes home from a5. Four moves for one knight \u2014 but it dragged the bishop from b3 to c2 and opened the c-file. That is the Chigorin bargain.","num":"13...Nc6","turn":"b","check":false,"arrows":[{"f":"a5","t":"c6","k":"move"},{"f":"c6","t":"d4","k":"atk"},{"f":"c6","t":"e5","k":"def"}],"tactics":"Attacks the pawn on d4; defends the pawn on e5"},{"san":"Nb3","fen":"r.b..rk...q.bpppp.np.n...p..p......PP....N...N.PPPB..PP.R.BQR.K.","from":"d2","to":"b3","note":"White's knight also redeploys, eyeing c5 and a5 and stopping Black's queenside expansion.","num":"14.Nb3","turn":"w","check":false,"arrows":[{"f":"d2","t":"b3","k":"move"},{"f":"b3","t":"d4","k":"def"},{"f":"b3","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on d4; controls c5"},{"san":"a5","fen":"r.b..rk...q.bppp..np.n..pp..p......PP....N...N.PPPB..PP.R.BQR.K.","from":"a6","to":"a5","note":"Black gains space and drives the knight away. Both sides are now committed: Black on the queenside, White on the kingside.","num":"14...a5","turn":"b","check":false,"arrows":[{"f":"a6","t":"a5","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Be3","fen":"r.b..rk...q.bppp..np.n..pp..p......PP....N..BN.PPPB..PP.R..QR.K.","from":"c1","to":"e3","note":"Development at last. The bishop supports d4 and eyes the queenside dark squares.","num":"15.Be3","turn":"w","check":false,"arrows":[{"f":"c1","t":"e3","k":"move"},{"f":"e3","t":"d4","k":"def"},{"f":"e3","t":"f4","k":"ctrl"}],"tactics":"Defends the pawn on d4; controls f4"},{"san":"a4","fen":"r.b..rk...q.bppp..np.n...p..p...p..PP....N..BN.PPPB..PP.R..QR.K.","from":"a5","to":"a4","note":"The pawn goes on, fixing White's a2-pawn as a target and taking b3 away from the knight for good.","num":"15...a4","turn":"b","check":false,"arrows":[{"f":"a5","t":"a4","k":"move"},{"f":"a4","t":"b3","k":"atk"}],"tactics":"Attacks the knight on b3"},{"san":"Nbd2","fen":"r.b..rk...q.bppp..np.n...p..p...p..PP.......BN.PPPBN.PP.R..QR.K.","from":"b3","to":"d2","note":"Back to d2, where the knight is heading for f1 and g3 exactly as planned. In the Ruy, being pushed around is not the same as being worse.","num":"16.Nbd2","turn":"w","check":false,"arrows":[{"f":"b3","t":"d2","k":"move"},{"f":"d2","t":"e4","k":"def"},{"f":"d2","t":"c4","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls c4"},{"san":"Bd7","fen":"r....rk...qbbppp..np.n...p..p...p..PP.......BN.PPPBN.PP.R..QR.K.","from":"c8","to":"d7","note":"Black completes development. Every piece is placed; now the plans collide.","num":"16...Bd7","turn":"b","check":false,"arrows":[{"f":"c8","t":"d7","k":"move"},{"f":"d7","t":"h3","k":"atk"},{"f":"d7","t":"f5","k":"ctrl"},{"f":"d7","t":"e6","k":"ctrl"}],"tactics":"Attacks the pawn on h3; controls f5 and e6"},{"san":"Rc1","fen":"r....rk...qbbppp..np.n...p..p...p..PP.......BN.PPPBN.PP...RQR.K.","from":"a1","to":"c1","note":"The rook takes the open file it has been waiting fifteen moves for.","num":"17.Rc1","turn":"w","check":false,"arrows":[{"f":"a1","t":"c1","k":"move"}],"tactics":"a repositioning move"},{"san":"Qb7","fen":"r....rk..q.bbppp..np.n...p..p...p..PP.......BN.PPPBN.PP...RQR.K.","from":"c7","to":"b7","note":"The queen slides out of the way of the rook and eyes the long diagonal.","num":"17...Qb7","turn":"b","check":false,"arrows":[{"f":"c7","t":"b7","k":"move"}],"tactics":"a repositioning move"},{"san":"Bb1","fen":"r....rk..q.bbppp..np.n...p..p...p..PP.......BN.PPP.N.PP..BRQR.K.","from":"c2","to":"b1","note":"The famous Spanish battery. Bb1 and Qd3 (or Qc2) aim at h7. This is the moment the Ruy stops being a positional opening and becomes a kingside attack \u2014 White has spent thirty-five moves earning the right to start it.","num":"18.Bb1","turn":"w","check":false,"arrows":[{"f":"c2","t":"b1","k":"move"},{"f":"b1","t":"e4","k":"def"},{"f":"b1","t":"d3","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls d3"}]}],"progression":{"arc":"The Ruy is a five-year opening. You will keep finding new layers in it, which is exactly why every world champion has played it.","stages":[{"tier":"Foundation","when":"Weeks one to three","goal":"Survive the first ten moves and understand why the bishop goes to b5.","learn":["The Morphy main line: 3...a6 4.Ba4 Nf6 5.O-O Be7 6.Re1 b5 7.Bb3 d6 8.c3 O-O 9.h3. Memorise it as one unit.","Why 5.O-O ignores the e4-pawn: after 5...Nxe4 6.d4 the pawn always comes back.","The Exchange Variation 4.Bxc6 as your safety net \u2014 it is fully playable and needs almost no theory."],"drill":"Play the Exchange Variation for a month. It teaches you the structure without the memorisation, and you will win endgames.","mistake":"Playing 5.Nxe5 after 4.Bxc6 dxc6. It loses a pawn to 5...Qd4 and it is the single most common Ruy Lopez blunder.","ready":"You can reach move nine of the Closed Ruy from memory and you have won a game with the Exchange endgame plan."},{"tier":"Structure","when":"Months one to three","goal":"Understand the two centres \u2014 the tense one and the closed one.","learn":["After c3 and d4, the three ways the centre can resolve: d5 (closed, play on the wings), dxe5 (open, piece play), or keeping the tension (usually best).","The Carlsbad-like queenside chain b5\u2013c6\u2013a6 and White's undermining a4.","Why the h3 move is played in almost every line \u2014 it stops ...Bg4, which would undermine the defence of d4."],"drill":"Set up the position after 11.d4 in the Chigorin and play it out against an engine ten times from both sides. Note what changes when White plays d5.","mistake":"Releasing the central tension because it feels uncomfortable. Whoever resolves the tension first usually helps the other side.","ready":"You can explain what changes about both sides' plans the moment White plays d5."},{"tier":"Plans","when":"Months three to nine","goal":"Learn the manoeuvres that make the Ruy the Ruy.","learn":["The Spanish knight tour Nb1\u2013d2\u2013f1\u2013g3 (or e3) \u2014 the model for slow attacking build-ups in every opening.","Black's counterplans: the Chigorin ...Na5, the Breyer ...Nb8\u2013d7, the Zaitsev ...Bb7 and ...Re8.","The a4 break and when to take on b5 versus when to leave the tension."],"drill":"Play twenty games reaching the Closed tabiya and write one sentence after each about where your pieces belonged.","mistake":"Rushing the kingside attack. In the Ruy the attack arrives around move twenty-five, not move fifteen.","ready":"You can name the square each of your eight pieces wants without looking at a book."},{"tier":"Mastery","when":"Year two and beyond","goal":"Handle the theoretical branches and the endgames the Ruy produces.","learn":["The Berlin Defence and its endgame \u2014 you will face it, and knowing how to press without queens is a genuine skill.","The Marshall Attack and your chosen Anti-Marshall (8.a4 or 8.h3), because Black gets a free pawn sacrifice otherwise.","The Noah's Ark Trap and the whole family of positions where the b3-bishop gets short of squares."],"drill":"Study ten Berlin endgames move by move. It is the least glamorous and most valuable study you will do this year.","mistake":"Avoiding the Berlin by playing something else. Learn to play against it \u2014 the small edge is real.","ready":"You are comfortable in a queenless middlegame with a small structural plus."}],"study":"Fischer and Karpov for the classical treatment, Kasparov for the attacking version, Carlsen for the modern grind. Kramnik\u2013Kasparov, London 2000 is the match that made the Berlin Wall famous.","next":"Add a second line against the Berlin, then start studying the Ruy's cousin structures \u2014 the Italian with d4 and the Scotch \u2014 so you can transpose when it suits you."}},{"id":"scotch","name":"Scotch Game","eco":"C44\u2013C45","section":"white-e4","orientation":"white","tagline":"Open the centre on move three. Far less theory than the Ruy, and it fights for an advantage immediately.","level":"Beginner \u2192 Master","theory":{"big_idea":"White plays d4 at once, exchanges in the centre and gets an open position with a small development lead. Where the Ruy Lopez builds pressure over thirty moves, the Scotch resolves the central tension immediately. The trade-off: releasing the tension gives Black clear equalising targets, so White's edge is small \u2014 but the positions are easy to understand and there is far less to memorise.","structure":"After 3...exd4 4.Nxd4, White has a pawn on e4 against Black's pawn on d6/d7 \u2014 a small space edge and a half-open d-file. In the Mieses main line, White ends up with a healthy 4v3 queenside majority while Black has doubled c-pawns and the bishop pair, exactly the sort of imbalance you can play for a win with.","white_plans":["Occupy the centre with e4\u2013e5 gaining space and driving Black's knight away.","Play against the doubled c-pawns with a healthy queenside majority; steer toward endgames.","Castle queenside in the Mieses line and push the kingside pawns with g3, Bg2, f4 and h4.","In the 4...Bc5 lines, kick the bishop with Nb3 or challenge it with Be3, and aim for a Maroczy-style bind with c4."],"black_plans":["4...Bc5 hitting the knight on d4 and provoking a concession; then ...Qf6 and quick development.","4...Nf6 aiming for the Mieses lines with the bishop pair and pressure on White's e5-pawn.","Break with ...d5 as soon as possible to free the position \u2014 the standard antidote to a space advantage.","Target the e5-pawn with ...Qe7, ...Ba6 and ...O-O-O."],"traps":["4.Nxd4 Qh4?! 5.Nc3! (not 5.Nf5?? Qxe4+) \u2014 Black's early queen sortie is bad but you must know the refutation.","In the Scotch Gambit (4.Bc4), 4...Bc5 5.Ng5?! Nh6! and White has nothing; do not chase f7 blindly.","4...Bc5 5.Nxc6 Qf6! is the point \u2014 Black regains the piece; White should meet 4...Bc5 with 5.Nb3 or 5.Be3."],"who":"Play this if you want an open, principled 1.e4 opening without memorising a Ruy Lopez encyclopaedia. Kasparov revived it at world-championship level in the 1990s."},"lines":[{"name":"Mieses Variation \u2014 Main Line","note":"The modern main line. White gains space with e5 and plays against the doubled c-pawns.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"e5","fen":"rnbqkbnrpppp.ppp............p.......P...........PPPP.PPPRNBQKBNR","from":"e7","to":"e5","note":"Black meets force with force and stakes an equal claim to the centre. This is the Open Game \u2014 the most classical, most principled reply there is.","num":"1...e5","turn":"b","check":false,"arrows":[{"f":"e7","t":"e5","k":"move"},{"f":"e5","t":"d4","k":"ctrl"},{"f":"e5","t":"f4","k":"ctrl"}],"tactics":"Controls d4 and f4"},{"san":"Nf3","fen":"rnbqkbnrpppp.ppp............p.......P........N..PPPP.PPPRNBQKB.R","from":"g1","to":"f3","note":"Develops a piece, attacks e5, and heads for castling. Knights before bishops: the knight's best square is obvious this early, the bishop's is not.","num":"2.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"atk"},{"f":"f3","t":"d4","k":"ctrl"}],"tactics":"Attacks the pawn on e5 (undefended!); controls d4"},{"san":"Nc6","fen":"r.bqkbnrpppp.ppp..n.........p.......P........N..PPPP.PPPRNBQKB.R","from":"b8","to":"c6","note":"The natural defender of e5 and a developing move toward the centre. Knights on the rim are dim; Nc6 is the opposite of that.","num":"2...Nc6","turn":"b","check":false,"arrows":[{"f":"b8","t":"c6","k":"move"},{"f":"c6","t":"e5","k":"def"},{"f":"c6","t":"d4","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls d4"},{"san":"d4","fen":"r.bqkbnrpppp.ppp..n.........p......PP........N..PPP..PPPRNBQKB.R","from":"d2","to":"d4","note":"The Scotch. White strikes at once instead of building slowly. Black almost has to take, because 3...d6 4.dxe5 gives White a clear space edge.","num":"3.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"atk"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls c5"},{"san":"exd4","fen":"r.bqkbnrpppp.ppp..n................pP........N..PPP..PPPRNBQKB.R","from":"e5","to":"d4","note":"Accepting. Black temporarily wins a pawn back but White will regain it immediately with a lead in development.","num":"3...exd4","turn":"b","check":false,"arrows":[{"f":"e5","t":"d4","k":"move"},{"f":"d4","t":"e3","k":"ctrl"}],"tactics":"Controls e3"},{"san":"Nxd4","fen":"r.bqkbnrpppp.ppp..n................NP...........PPP..PPPRNBQKB.R",
