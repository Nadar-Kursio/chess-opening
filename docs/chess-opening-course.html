3 or a sacrifice on h3 or f3. This is the moment to stop and count. White needs roughly three moves to win material on the queenside; Black needs roughly four to reach White's king. Whether that trade-off favours Black depends on details invisible to any general principle \u2014 which is precisely why grandmasters have argued about this position for seventy years.","num":"18...h5","turn":"b","check":false,"arrows":[{"f":"h7","t":"h5","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"}]}],"progression":{"arc":"The King's Indian is a bet: you will be objectively worse for thirty moves and then checkmate someone. Learn to enjoy that.","stages":[{"tier":"Foundation","when":"Weeks one to two","goal":"Learn the six-move setup and the one break that matters.","learn":["The setup: ...Nf6, ...g6, ...Bg7, ...d6, ...O-O, then ...e5. Play it against nearly everything White does.","Why you allow the big centre: those pawns are targets, and your Bg7 is aimed at the heart of them.","The two breaks: ...e5 always, ...c5 when White has committed to a S\u00e4misch or fianchetto."],"drill":"Play the six-move setup fifty times. It is the same against 1.d4, 1.c4 and 1.Nf3, which makes it enormously efficient.","mistake":"Playing ...e5 before you have castled or before the knight route is clear. Timing is everything in the KID.","ready":"You reach the setup automatically against every White system."},{"tier":"Structure","when":"Months one to two","goal":"Understand the locked centre and what it commands you to do.","learn":["The Mar del Plata skeleton: White c4-d5-e4, Black c7-d6-e5. Your pawns point at the kingside, so you attack there. No exceptions.","The knight routes: ...Ne7\u2013g6 or ...Nd7\u2013f6, both clearing the f-pawn's path.","Why ...f5 then ...f4 permanently locks the position \u2014 after that, only the wings matter."],"drill":"Set up the position after ...f4 and play only ...g5, ...h5, ...g4 and ...Rf6\u2013h6. Ten times. Feel the mechanism.","mistake":"Defending the queenside. If you spend moves stopping c5, you lose the race \u2014 White's break was going to happen anyway.","ready":"You can explain why Black does not defend in the King's Indian."},{"tier":"Plans","when":"Months two to eight","goal":"Learn to attack with everything and count the race.","learn":["The full storm: ...f5, ...f4, ...g5, ...h5, ...g4, then ...g3 or a piece sacrifice on h3 or g4.","The rook lift ...Rf6\u2013h6 and the queen route ...Qe8\u2013f7\u2013h5 or ...Qd8\u2013e8\u2013g6.","Counting: White needs roughly the same number of moves on the queenside. Every tempo you spend elsewhere is one you lose."],"drill":"Play twenty Mar del Plata positions from move fifteen. Sacrifice something in each. Learn what compensation actually looks like.","mistake":"Hesitating. In a King's Indian a slow attacking move is often worse than an unsound sacrifice.","ready":"You have won a game while a piece down."},{"tier":"Mastery","when":"Ongoing","goal":"Handle the systems designed to stop you.","learn":["The Fianchetto Variation, where White's Bg2 neutralises your Bg7 \u2014 you must switch to a positional game with ...c6 and ...a5.","The S\u00e4misch with f3, where White castles queenside and races you back.","The Bayonet Attack 9.b4, the sharpest modern try, and the ...Nh5 and ...a5 answers."],"drill":"Prepare the Fianchetto lines properly. It is the variation that scores best against the KID and the one most players neglect.","mistake":"Playing the Mar del Plata plan in the Fianchetto. The mechanism is not there and the attack will not arrive.","ready":"You know which of White's systems calls for attack and which calls for manoeuvring."}],"study":"Bobby Fischer, Garry Kasparov and Teimour Radjabov are the three great King's Indian players. Kasparov's KID wins from the 1990s are the clearest teaching material available.","next":"Add the Gr\u00fcnfeld or the Benoni as an alternative when White plays a system you dislike \u2014 both share the ...g6 move order."}},{"id":"nimzo","name":"Nimzo-Indian Defence","eco":"E20\u2013E59","section":"black-d4","orientation":"black","tagline":"Pin the knight, trade it off, and play against the doubled pawns. The most respected defence to 1.d4.","level":"Intermediate \u2192 World Championship","theory":{"big_idea":"3...Bb4 pins the c3-knight, which is the piece guarding e4. Black is not fighting for the centre with pawns \u2014 Black is fighting for one square, e4, with pieces. Usually Black trades the bishop for the knight, giving White the bishop pair but leaving White with doubled c-pawns. The rest of the game is a clean philosophical argument: White's two bishops and open lines against Black's superior structure and control of the light squares.","structure":"The archetype is the S\u00e4misch structure: White pawns on c3, c4, d4 (doubled c-pawns) against Black's a7, b7, c5, d6, e6. If the position opens, White's bishops dominate. If it stays closed, the doubled c-pawns are simply weak. Black therefore blockades with ...c5, ...b6, ...Ba6 and ...Na5, and White strives to play e3\u2013e4 and open lines.","white_plans":["Rubinstein (4.e3): quiet development, then Bd3, Nf3, O-O and a central break with e4 or dxc5.","Classical (4.Qc2): pre-empt the doubled pawns by recapturing on c3 with the queen. White gets the bishop pair with no structural damage \u2014 at the cost of two tempi.","S\u00e4misch (4.a3): force the trade immediately, accept the doubled pawns and go all-in on e3\u2013e4 and a kingside attack.","Build the big centre with f3 and e4 and use the bishop pair in an open position."],"black_plans":["Trade on c3, then blockade the doubled pawns with ...c5, ...b6, ...Ba6 and ...Na5 hitting c4.","Keep the bishop and play ...d5 and ...c5, treating it like a Queen's Gambit with an extra active bishop.","Control e4 with ...Ne4, ...b6, ...Bb7 and ...f5 \u2014 the Nimzowitsch dream setup.","Trade off White's bishop pair advantage at every opportunity."],"traps":["In the 4.Qc2 lines, do not automatically trade on c3 \u2014 White recaptures with the queen and there are no doubled pawns.","Watch for the Qd1\u2013a4+ trick winning the loose bishop on b4 if Black plays ...c5 too early.","After 4.e3 O-O 5.Bd3 d5 6.Nf3 c5, Black must know 7.O-O dxc4 8.Bxc4 and the resulting isolated-pawn structures."],"who":"Play this if you want a defence that is theoretically sound at every level and rewards positional understanding. It is arguably the single best answer to 1.d4 ever devised."},"lines":[{"name":"Rubinstein Variation \u2014 4.e3","note":"White's most popular and most flexible line. The game usually transposes into an isolated-pawn or hanging-pawn middlegame.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"Nf6","fen":"rnbqkb.rpppppppp.....n.............P............PPP.PPPPRNBQKBNR","from":"g8","to":"f6","note":"The Indian move order. Black hits e4 before deciding on a pawn structure, keeping every option open.","num":"1...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"d5","k":"ctrl"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Controls d5 and e4"},{"san":"c4","fen":"rnbqkb.rpppppppp.....n............PP............PP..PPPPRNBQKBNR","from":"c2","to":"c4","note":"The Queen's Gambit. Not a real gambit \u2014 after 2...dxc4 Black cannot hold the pawn. The point is to challenge d5 from the side and win the centre.","num":"2.c4","turn":"w","check":false,"arrows":[{"f":"c2","t":"c4","k":"move"},{"f":"c4","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"e6","fen":"rnbqkb.rpppp.ppp....pn............PP............PP..PPPPRNBQKBNR","from":"e7","to":"e6","note":"Preparing ...d5 or ...Bb4 and keeping every option open.","num":"2...e6","turn":"b","check":false,"arrows":[{"f":"e7","t":"e6","k":"move"},{"f":"e6","t":"d5","k":"ctrl"},{"f":"e6","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"Nc3","fen":"rnbqkb.rpppp.ppp....pn............PP......N.....PP..PPPPR.BQKBNR","from":"b1","to":"c3","note":"Development, adding a defender to e4 and d5.","num":"3.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"ctrl"},{"f":"c3","t":"e4","k":"ctrl"}],"tactics":"Controls d5 and e4"},{"san":"Bb4","fen":"rnbqk..rpppp.ppp....pn...........bPP......N.....PP..PPPPR.BQKBNR","from":"f8","to":"b4","note":"The Nimzo-Indian. Black pins the knight that guards e4 and puts immediate pressure on the position without moving a single central pawn.","num":"3...Bb4","turn":"b","check":false,"arrows":[{"f":"f8","t":"b4","k":"move"},{"f":"b4","t":"c3","k":"atk"},{"f":"b4","t":"c5","k":"ctrl"},{"f":"b4","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on c3; controls c5 and d6"},{"san":"e3","fen":"rnbqk..rpppp.ppp....pn...........bPP......N.P...PP...PPPR.BQKBNR","from":"e2","to":"e3","note":"The Rubinstein \u2014 modest, flexible and the most common choice by far. White simply develops and waits.","num":"4.e3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"},{"f":"e3","t":"f4","k":"ctrl"}],"tactics":"Controls f4"},{"san":"O-O","fen":"rnbq.rk.pppp.ppp....pn...........bPP......N.P...PP...PPPR.BQKBNR","from":"e8","to":"g8","note":"King safety.","num":"4...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects "b4","t":"c5","k":"ctrl"},{"f":"b4","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on c3; controls c5 and d6"},{"san":"e3","fen":"rnbqk..rpppp.ppp....pn...........bPP......N.P...PP...PPPR.BQKBNR","from":"e2","to":"e3","note":"The Rubinstein \u2014 modest, flexible and the most common choice by far. White simply develops and waits.","num":"4.e3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"},{"f":"e3","t":"f4","k":"ctrl"}],"tactics":"Controls f4"},{"san":"O-O","fen":"rnbq.rk.pppp.ppp....pn...........bPP......N.P...PP...PPPR.BQKBNR","from":"e8","to":"g8","note":"King safety.","num":"4...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Bd3","fen":"rnbq.rk.pppp.ppp....pn...........bPP......NBP...PP...PPPR.BQK.NR","from":"f1","to":"d3","note":"The bishop takes the attacking diagonal.","num":"5.Bd3","turn":"w","check":false,"arrows":[{"f":"f1","t":"d3","k":"move"},{"f":"d3","t":"h7","k":"atk"},{"f":"d3","t":"e4","k":"ctrl"},{"f":"d3","t":"f5","k":"ctrl"}],"tactics":"Attacks the pawn on h7; controls e4 and f5"},{"san":"d5","fen":"rnbq.rk.ppp..ppp....pn.....p.....bPP......NBP...PP...PPPR.BQK.NR","from":"d7","to":"d5","note":"Black stakes a classical claim in the centre and prepares ...c5.","num":"5...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"c4","k":"atk"},{"f":"d5","t":"e4","k":"ctrl"}],"tactics":"Attacks the pawn on c4; controls e4"},{"san":"Nf3","fen":"rnbq.rk.ppp..ppp....pn.....p.....bPP......NBPN..PP...PPPR.BQK..R","from":"g1","to":"f3","note":"Development.","num":"6.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"ctrl"}],"tactics":"Controls e5"},{"san":"c5","fen":"rnbq.rk.pp...ppp....pn....pp.....bPP......NBPN..PP...PPPR.BQK..R","from":"c7","to":"c5","note":"The critical break, hitting d4 and challenging White's centre.","num":"6...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"},{"san":"O-O","fen":"rnbq.rk.pp...ppp....pn....pp.....bPP......NBPN..PP...PPPR.BQ.RK.","from":"e1","to":"g1","note":"King safety.","num":"7.O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"g1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"dxc4","fen":"rnbq.rk.pp...ppp....pn....p......bpP......NBPN..PP...PPPR.BQ.RK.","from":"d5","to":"c4","note":"Black resolves the tension in the centre.","num":"7...dxc4","turn":"b","check":false,"arrows":[{"f":"d5","t":"c4","k":"move"},{"f":"c4","t":"d3","k":"atk"}],"tactics":"Attacks the bishop on d3"},{"san":"Bxc4","fen":"rnbq.rk.pp...ppp....pn....p......bBP......N.PN..PP...PPPR.BQ.RK.","from":"d3","to":"c4","note":"Recapturing on the best square.","num":"8.Bxc4","turn":"w","check":false,"arrows":[{"f":"d3","t":"c4","k":"move"},{"f":"c4","t":"e6","k":"atk"},{"f":"c4","t":"d5","k":"ctrl"},{"f":"c4","t":"d3","k":"ctrl"}],"tactics":"Attacks the pawn on e6; controls d5 and d3"},{"san":"Nbd7","fen":"r.bq.rk.pp.n.ppp....pn....p......bBP......N.PN..PP...PPPR.BQ.RK.","from":"b8","to":"d7","note":"Development, adding a defender to c5 and preparing ...b6.","num":"8...Nbd7","turn":"b","check":false,"arrows":[{"f":"b8","t":"d7","k":"move"},{"f":"d7","t":"c5","k":"def"},{"f":"d7","t":"e5","k":"ctrl"}],"tactics":"Defends the pawn on c5; controls e5"},{"san":"Qe2","fen":"r.bq.rk.pp.n.ppp....pn....p......bBP......N.PN..PP..QPPPR.B..RK.","from":"d1","to":"e2","note":"The queen steps off the d-file in anticipation of the coming exchanges.","num":"9.Qe2","turn":"w","check":false,"arrows":[{"f":"d1","t":"e2","k":"move"},{"f":"e2","t":"d3","k":"ctrl"}],"tactics":"Controls d3"},{"san":"b6","fen":"r.bq.rk.p..n.ppp.p..pn....p......bBP......N.PN..PP..QPPPR.B..RK.","from":"b7","to":"b6","note":"Preparing ...Bb7 to fight for the long diagonal and e4.","num":"9...b6","turn":"b","check":false,"arrows":[{"f":"b7","t":"b6","k":"move"},{"f":"b6","t":"c5","k":"def"}],"tactics":"Defends the pawn on c5"},{"san":"Rd1","fen":"r.bq.rk.p..n.ppp.p..pn....p......bBP......N.PN..PP..QPPPR.BR..K.","from":"f1","to":"d1","note":"The rook takes the file where the isolated pawn will appear.","num":"10.Rd1","turn":"w","check":false,"arrows":[{"f":"f1","t":"d1","k":"move"},{"f":"d1","t":"d4","k":"def"},{"f":"d1","t":"d3","k":"ctrl"}],"tactics":"Defends the pawn on d4; controls d3"},{"san":"cxd4","fen":"r.bq.rk.p..n.ppp.p..pn...........bBp......N.PN..PP..QPPPR.BR..K.","from":"c5","to":"d4","note":"Black releases the tension.","num":"10...cxd4","turn":"b","check":false,"arrows":[{"f":"c5","t":"d4","k":"move"},{"f":"d4","t":"c3","k":"atk"},{"f":"d4","t":"e3","k":"atk"}],"tactics":"Attacks the knight on c3 and the pawn on e3"},{"san":"exd4","fen":"r.bq.rk.p..n.ppp.p..pn...........bBP......N..N..PP..QPPPR.BR..K.","from":"e3","to":"d4","note":"White now has an isolated queen's pawn on d4 \u2014 the same structure as the Panov and the Tarrasch. White attacks with the e5/c5 outposts and open files; Black blockades on d5 and trades pieces.","num":"11.exd4","turn":"w","check":false,"arrows":[{"f":"e3","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"Bb7","fen":"r..q.rk.pb.n.ppp.p..pn...........bBP......N..N..PP..QPPPR.BR..K.","from":"c8","to":"b7","note":"Black completes development and blockades. A rich position that comes up in hundreds of grandmaster games.","num":"11...Bb7","turn":"b","check":false,"arrows":[{"f":"c8","t":"b7","k":"move"},{"f":"b7","t":"f3","k":"atk"},{"f":"b7","t":"d5","k":"ctrl"},{"f":"b7","t":"e4","k":"ctrl"}],"tactics":"Attacks the knight on f3; controls d5 and e4"},{"san":"Bg5","fen":"r..q.rk.pb.n.ppp.p..pn........B..bBP......N..N..PP..QPPPR..R..K.","from":"c1","to":"g5","note":"White develops with a pin. The bishop on g5 also supports a future d5 push by removing the f6-knight.","num":"12.Bg5","turn":"w","check":false,"arrows":[{"f":"c1","t":"g5","k":"move"},{"f":"g5","t":"f6","k":"atk"},{"f":"g5","t":"f4","k":"ctrl"},{"f":"g5","t":"e3","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls f4 and e3"},{"san":"Bxc3","fen":"r..q.rk.pb.n.ppp.p..pn........B...BP......b..N..PP..QPPPR..R..K.","from":"b4","to":"c3","note":"Now Black takes. The moment is chosen: White has just committed the bishop to g5, so the recapture must be with a pawn.","num":"12...Bxc3","turn":"b","check":false,"arrows":[{"f":"b4","t":"c3","k":"move"},{"f":"c3","t":"b2","k":"atk"},{"f":"c3","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on b2 and the pawn on d4"},{"san":"bxc3","fen":"r..q.rk.pb.n.ppp.p..pn........B...BP......P..N..P...QPPPR..R..K.","from":"b2","to":"c3","note":"White accepts the doubled pawns. In exchange: the bishop pair and a broad c3\u2013d4 centre. The whole Nimzo-Indian debate, in one position.","num":"13.bxc3","turn":"w","check":false,"arrows":[{"f":"b2","t":"c3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Qc7","fen":"r....rk.pbqn.ppp.p..pn........B...BP......P..N..P...QPPPR..R..K.","from":"d8","to":"c7","note":"The queen takes the half-open c-file, aiming directly at the doubled pawns.","num":"13...Qc7","turn":"b","check":false,"arrows":[{"f":"d8","t":"c7","k":"move"},{"f":"c7","t":"h2","k":"atk"},{"f":"c7","t":"c4","k":"atk"},{"f":"c7","t":"e5","k":"ctrl"},{"f":"c7","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on h2 and the bishop on c4; controls e5 and c5"},{"san":"Bd3","fen":"r....rk.pbqn.ppp.p..pn........B....P......PB.N..P...QPPPR..R..K.","from":"c4","to":"d3","note":"The bishop steps back to the attacking diagonal, where it looks at h7.","num":"14.Bd3","turn":"w","check":false,"arrows":[{"f":"c4","t":"d3","k":"move"},{"f":"d3","t":"h7","k":"atk"},{"f":"d3","t":"e4","k":"ctrl"},{"f":"d3","t":"f5","k":"ctrl"}],"tactics":"Attacks the pawn on h7; controls e4 and f5"},{"san":"Rfe8","fen":"r...r.k.pbqn.ppp.p..pn........B....P......PB.N..P...QPPPR..R..K.","from":"f8","to":"e8","note":"Black centralises and prepares to blockade.","num":"14...Rfe8","turn":"b","check":false,"arrows":[{"f":"f8","t":"e8","k":"move"},{"f":"e8","t":"e6","k":"def"}],"tactics":"Defends the pawn on e6"},{"san":"c4","fen":"r...r.k.pbqn.ppp.p..pn........B...PP.......B.N..P...QPPPR..R..K.","from":"c3","to":"c4","note":"White pushes the doubled pawn forward and un-doubles. Now the c-pawns are gone and White simply has a big centre and two bishops \u2014 the doubled-pawn weakness has been converted into space.","num":"15.c4","turn":"w","check":false,"arrows":[{"f":"c3","t":"c4","k":"move"},{"f":"c4","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"h6","fen":"r...r.k.pbqn.pp..p..pn.p......B...PP.......B.N..P...QPPPR..R..K.","from":"h7","to":"h6","note":"Putting the question to the bishop and making luft.","num":"15...h6","turn":"b","check":false,"arrows":[{"f":"h7","t":"h6","k":"move"},{"f":"h6","t":"g5","k":"atk"}],"tactics":"Attacks the bishop on g5"},{"san":"Bh4","fen":"r...r.k.pbqn.pp..p..pn.p..........PP...B...B.N..P...QPPPR..R..K.","from":"g5","to":"h4","note":"White keeps the pin. Trading on f6 would give Black the bishop pair back.","num":"16.Bh4","turn":"w","check":false,"arrows":[{"f":"g5","t":"h4","k":"move"},{"f":"h4","t":"f6","k":"atk"}],"tactics":"Attacks the knight on f6"},{"san":"Rac8","fen":"..r.r.k.pbqn.pp..p..pn.p..........PP...B...B.N..P...QPPPR..R..K.","from":"a8","to":"c8","note":"Both black rooks are placed. Black's plan is fixed: pressure c4 and d4, blockade on d5 or c5, and trade pieces until the centre becomes weak rather than strong.","num":"16...Rac8","turn":"b","check":false,"arrows":[{"f":"a8","t":"c8","k":"move"}],"tactics":"a repositioning move"},{"san":"Rac1","fen":"..r.r.k.pbqn.pp..p..pn.p..........PP...B...B.N..P...QPPP..RR..K.","from":"a1","to":"c1","note":"White contests the file.","num":"17.Rac1","turn":"w","check":false,"arrows":[{"f":"a1","t":"c1","k":"move"},{"f":"c1","t":"c4","k":"def"}],"tactics":"Defends the pawn on c4"},{"san":"Qf4","fen":"..r.r.k.pb.n.pp..p..pn.p..........PP.q.B...B.N..P...QPPP..RR..K.","from":"c7","to":"f4","note":"The queen goes on the attack. The position is balanced and instructive: White's two bishops and centre against Black's better structure and pressure on the pawns. Whichever side gets to dictate whether the position opens or closes will win the argument.","num":"17...Qf4","turn":"b","check":false,"arrows":[{"f":"c7","t":"f4","k":"move"},{"f":"f4","t":"c1","k":"atk"},{"f":"f4","t":"h2","k":"atk"},{"f":"f4","t":"f3","k":"atk"},{"f":"f4","t":"d4","k":"atk"},{"f":"f4","t":"h4","k":"atk"},{"f":"f4","t":"f6","k":"def"},{"f":"f4","t":"e5","k":"ctrl"},{"f":"f4","t":"e4","k":"ctrl"}],"tactics":"Attacks the rook on c1, the pawn on h2, the knight on f3, the pawn on d4, and the bishop on h4; defends the knight on f6; controls e5 and e4"}]}],"progression":{"arc":"The Nimzo-Indian is the most respected defence to 1.d4 because it asks a question that has no clean answer. It rewards understanding over memory.","stages":[{"tier":"Foundation","when":"Weeks one to two","goal":"Understand why 3...Bb4 is a good move at all.","learn":["The pin on c3 stops e4. Black is not fighting for the centre with pawns but preventing White from occupying it.","White's four main replies: 4.e3 (Rubinstein), 4.Qc2 (Classical), 4.a3 (S\u00e4misch), 4.f3 and 4.Nf3.","The move-order problem: after 1.d4 Nf6 2.c4 e6, White can play 3.Nf3 and you never get the Nimzo. Pick a second defence now."],"drill":"Prepare your answer to 3.Nf3 before your first Nimzo game \u2014 Queen's Indian (...b6), Bogo-Indian (...Bb4+) or Ragozin (...d5).","mistake":"Trading on c3 automatically. Against 4.Qc2 White recaptures with the queen and there are no doubled pawns to attack.","ready":"You have a complete answer to 3.Nf3 as well as to 3.Nc3."},{"tier":"Structure","when":"Months one to three","goal":"Learn to play against doubled pawns \u2014 and to know when they are not weak.","learn":["The S\u00e4misch structure: White c3, c4, d4 against your c5, d6, e6. Blockade with ...Na5 and ...Ba6 and the c4-pawn falls.","The rule that decides everything: doubled pawns are weak in a closed position and strong in an open one, because they support a big centre.","Your job after trading on c3: keep the position closed and trade pieces, never open lines for the bishops."],"drill":"Play ten S\u00e4misch positions with the plan ...c5, ...b6, ...Ba6, ...Na5 and nothing else. See how often c4 simply drops.","mistake":"Opening the centre after giving up the bishop pair. Every open file you create is a gift to White's two bishops.","ready":"You can look at a doubled-pawn position and say whether they are a weakness or a strength."},{"tier":"Plans","when":"Months three to eight","goal":"Master the three middlegame types the Nimzo produces.","learn":["Type 1 \u2014 the isolated queen's pawn (from 4.e3 lines): blockade d5, trade minor pieces, win the endgame.","Type 2 \u2014 hanging pawns on c4 and d4: attack them with ...Rc8 and ...Na5 and force one to advance.","Type 3 \u2014 the blockade against doubled pawns: knight to c5, bishop to a6, and total control of the light squares."],"drill":"Take five of your Nimzo games and classify each middlegame into one of the three types. If you cannot, that is the study you need.","mistake":"Playing all three types the same way. The plan comes from the structure, and the Nimzo produces three different ones.","ready":"You name the structure type before you choose a move."},{"tier":"Mastery","when":"Ongoing","goal":"Depth in your chosen branch plus the endgames.","learn":["One deep line against 4.Qc2 \u2014 currently the critical test at every level.","The Ragozin and Vienna transpositions, which arise constantly from Nimzo move orders.","Bishop-versus-knight endgames. The Nimzo is a machine for producing them and they decide half your games."],"drill":"Study twenty Karpov or Kramnik games in the Nimzo, guessing every Black move. It is the best positional training available.","mistake":"Neglecting endgame study. The Nimzo produces small, technical advantages \u2014 you need the technique to convert them.","ready":"You can convert a one-pawn or good-knight-versus-bad-bishop endgame reliably."}],"study":"Aron Nimzowitsch invented it, Capablanca and Karpov perfected the positional treatment, and Kramnik and Caruana carry it today.","next":"Pair it with the Queen's Indian or Ragozin so that 3.Nf3 does not take you out of preparation. Together they form a complete 1.d4 defence."}},{"id":"slav","name":"Slav Defence","eco":"D10\u2013D19","section":"black-d4","orientation":"black","tagline":"Support d5 with the c-pawn and keep the good bishop. The Caro-Kann of 1.d4.","level":"Beginner \u2192 World Championship","theory":{"big_idea":"Against the Queen's Gambit, Black must support d5. The Queen's Gambit Declined does it with ...e6, which locks the c8-bishop in. The Slav does it with ...c6, keeping the bishop's path to f5 and g4 open. Black's basic plan is to develop the bishop outside, then play ...e6 and ...dxc4 at a moment when the pawn can be held with ...b5 \u2014 grabbing genuine queenside space. It is the soundest, least compromising answer to 1.d4 there is.","structure":"Black keeps pawns on c6 and d5 with a healthy, unbreakable structure. In the main line Black takes on c4 and holds with ...b5, ...a6 and ...Bb7, gaining queenside space. In the Semi-Slav (with ...e6 too) the c8-bishop is temporarily locked in but Black gets the powerful ...c5 and ...e5 breaks. In the Exchange Slav the position is completely symmetrical and famously drawish.","white_plans":["Play a4 early to stop ...b5 and take the b5 square for a knight or bishop.","Build the centre with e3, Bxc4 and e4, converting into a big pawn centre.","In the Exchange Slav, play the minority attack with b4\u2013b5 on the queenside.","In the Semi-Slav, launch the Botvinnik or Anti-Moscow gambits with e4 and g4 \u2014 some of the sharpest theory in chess."],"black_plans":["Develop the bishop to f5 or g4 before playing ...e6 \u2014 the single defining idea of the whole opening.","Take on c4 and hold with ...b5, gaining queenside space and a queenside pawn majority.","The Meran plan: ...dxc4, ...b5, ...a6 and the central break ...c5.","Trade into a good endgame with the healthy structure and queenside majority."],"traps":["Do not play ...Bf5 before ...dxc4 in some move orders \u2014 White can hit with Qb3 forking b7 and d5.","After 4...dxc4 5.a4, remember that ...b5?? 6.axb5 cxb5 7.b3! wins the pawn back with a great position.","In the Semi-Slav Botvinnik (5.Bg5 dxc4 6.e4 b5 7.e5 h6 8.Bh4 g5), do not enter without preparation \u2014 it is one of the most forcing lines in existence."],"who":"Play this if you want a defence to 1.d4 that is completely sound, gives you a healthy structure, and does not require you to accept a bad bishop or a cramped position."},"lines":[{"name":"Main Line Slav","note":"The classical main line. Black takes on c4, develops the bishop outside, and gets a comfortable game.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"d5","fen":"rnbqkbnrppp.pppp...........p.......P............PPP.PPPPRNBQKBNR","from":"d7","to":"d5","note":"Black mirrors in the centre. The Closed Games, where structure matters more than tempo.","num":"1...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"ctrl"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"c4","fen":"rnbqkbnrppp.pppp...........p......PP............PP..PPPPRNBQKBNR","from":"c2","to":"c4","note":"The Queen's Gambit. Not a real gambit \u2014 after 2...dxc4 Black cannot hold the pawn. The point is to challenge d5 from the side and win the centre.","num":"2.c4","turn":"w","check":false,"arrows":[{"f":"c2","t":"c4","k":"move"},{"f":"c4","t":"d5","k":"atk"}],"tactics":"Attacks the pawn on d5"},{"san":"c6","fen":"rnbqkbnrpp..pppp..p........p......PP............PP..PPPPRNBQKBNR","from":"c7","to":"c6","note":"The Slav. Black supports d5 with the c-pawn, which \u2014 unlike ...e6 \u2014 leaves the c8-bishop free.","num":"2...c6","turn":"b","check":false,"arrows":[{"f":"c7","t":"c6","k":"move"},{"f":"c6","t":"d5","k":"def"}],"tactics":"Defends the pawn on d5"},{"san":"Nf3","fen":"rnbqkbnrpp..pppp..p........p......PP.........N..PP..PPPPRNBQKB.R","from":"g1","to":"f3","note":"Development.","num":"3.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"ctrl"}],"tactics":"Controls e5"},{"san":"Nf6","fen":"rnbqkb.rpp..pppp..p..n.....p......PP.........N..PP..PPPPRNBQKB.R","from":"g8","to":"f6","note":"Development.","num":"3...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"d5","k":"def"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Defends the pawn on d5; controls e4"},{"san":"Nc3","fen":"rnbqkb.rpp..pppp..p..n.....p......PP......N..N..PP..PPPPR.BQKB.R","from":"b1","to":"c3","note":"Development.","num":"4.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"atk"},{"f":"c3","t":"e4","k":"ctrl"}],"tactics":"Attacks the pawn on d5; controls e4"},{"san":"dxc4","fen":"rnbqkb.rpp..pppp..p..n............pP......N..N..PP..PPPPR.BQKB.R","from":"d5 ":"c6","to":"d5","note":"Black recaptures toward the centre. Notice: Black now has pawns on a7, b7, d5, e6, f7, g7, h7. Not one of them is weak, doubled or backward.","num":"13...cxd5","turn":"b","check":false,"arrows":[{"f":"c6","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"ctrl"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"Qe3","fen":"r..q.rk.pp.n.ppp....p......pP..bPb.P.......BQN...P...PPPR.B..RK.","from":"e2","to":"e3","note":"The queen steps off the pin and eyes the kingside.","num":"14.Qe3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"},{"f":"e3","t":"f3","k":"def"},{"f":"e3","t":"e5","k":"def"},{"f":"e3","t":"e4","k":"ctrl"},{"f":"e3","t":"f4","k":"ctrl"}],"tactics":"Defends the knight on f3 and the pawn on e5; controls e4 and f4"},{"san":"Bg6","fen":"r..q.rk.pp.n.ppp....p.b....pP...Pb.P.......BQN...P...PPPR.B..RK.","from":"h5","to":"g6","note":"Black repositions the bishop to challenge the attacking diagonal.","num":"14...Bg6","turn":"b","check":false,"arrows":[{"f":"h5","t":"g6","k":"move"},{"f":"g6","t":"d3","k":"atk"},{"f":"g6","t":"e4","k":"ctrl"},{"f":"g6","t":"f5","k":"ctrl"}],"tactics":"Attacks the bishop on d3; controls e4 and f5"},{"san":"Bxg6","fen":"r..q.rk.pp.n.ppp....p.B....pP...Pb.P........QN...P...PPPR.B..RK.","from":"d3","to":"g6","note":"White trades it off \u2014 the bishop was the piece pointing at h7.","num":"15.Bxg6","turn":"w","check":false,"arrows":[{"f":"d3","t":"g6","k":"move"},{"f":"g6","t":"f7","k":"atk"},{"f":"g6","t":"h7","k":"atk"},{"f":"g6","t":"e4","k":"ctrl"},{"f":"g6","t":"f5","k":"ctrl"}],"tactics":"Attacks the pawn on f7 and the pawn on h7; controls e4 and f5"},{"san":"hxg6","fen":"r..q.rk.pp.n.pp.....p.p....pP...Pb.P........QN...P...PPPR.B..RK.","from":"h7","to":"g6","note":"Black recaptures with the h-pawn, opening the h-file for the rook and keeping the structure sound. Doubled g-pawns look ugly but they control f5 and h5 and neither is attackable.","num":"15...hxg6","turn":"b","check":false,"arrows":[{"f":"h7","t":"g6","k":"move"},{"f":"g6","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"Bd2","fen":"r..q.rk.pp.n.pp.....p.p....pP...Pb.P........QN...P.B.PPPR....RK.","from":"c1","to":"d2","note":"White offers the last minor-piece trade.","num":"16.Bd2","turn":"w","check":false,"arrows":[{"f":"c1","t":"d2","k":"move"},{"f":"d2","t":"b4","k":"atk"}],"tactics":"Attacks the bishop on b4 (undefended!)"},{"san":"Bxd2","fen":"r..q.rk.pp.n.pp.....p.p....pP...P..P........QN...P.b.PPPR....RK.","from":"b4","to":"d2","note":"Black accepts. Every trade helps the side with the healthier structure.","num":"16...Bxd2","turn":"b","check":false,"arrows":[{"f":"b4","t":"d2","k":"move"},{"f":"d2","t":"e3","k":"atk"}],"tactics":"Attacks the queen on e3"},{"san":"Nxd2","fen":"r..q.rk.pp.n.pp.....p.p....pP...P..P........Q....P.N.PPPR....RK.","from":"f3","to":"d2","note":"White recaptures.","num":"17.Nxd2","turn":"w","check":false,"arrows":[{"f":"f3","t":"d2","k":"move"},{"f":"d2","t":"e4","k":"ctrl"},{"f":"d2","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"Rc8","fen":"..rq.rk.pp.n.pp.....p.p....pP...P..P........Q....P.N.PPPR....RK.","from":"a8","to":"c8","note":"The rook takes the open file. Look at the resulting position honestly: White has more central space with the e5-pawn, Black has a completely sound structure, an open c-file and a comfortable game. Black has not been in danger for a single move. That is what people mean when they call the Slav the soundest defence to 1.d4.","num":"17...Rc8","turn":"b","check":false,"arrows":[{"f":"a8","t":"c8","k":"move"},{"f":"c8","t":"c5","k":"ctrl"},{"f":"c8","t":"c4","k":"ctrl"}],"tactics":"Controls c5 and c4"}]}],"progression":{"arc":"The Slav is the defence you can play for thirty years without ever having a structurally bad position. The depth is in the details.","stages":[{"tier":"Foundation","when":"Week one","goal":"Understand why ...c6 beats ...e6 for supporting d5.","learn":["The whole point: ...c6 supports d5 without locking in the c8-bishop. Get the bishop out before you play ...e6.","The main line move order: 3.Nf3 Nf6 4.Nc3 dxc4 5.a4 Bf5. Know why a4 is forced and what it weakens.","The three families: Main Line Slav, Semi-Slav (with ...e6) and Exchange Slav."],"drill":"Play the main line twenty times and note that b4 is available to you every game because White played a4.","mistake":"Taking on c4 before ...c6 is in. Without the c-pawn ready to support ...b5, the capture just loses a tempo.","ready":"You never play ...e6 before the bishop is developed, unless you have chosen the Semi-Slav deliberately."},{"tier":"Structure","when":"Weeks two to six","goal":"Learn the queenside majority and what it is worth.","learn":["After ...dxc4 and ...b5, you own a queenside pawn majority. That is a long-term endgame asset.","The b4 square that White's a4 permanently weakens \u2014 your bishop and knight both want it.","The Exchange Slav's symmetry: the whole game is about the c-file and one tempo."],"drill":"Play ten Exchange Slavs and win the c-file every time. It is the entire content of the variation.","mistake":"Treating the Exchange Slav as an automatic draw. Black has scored well in it for a century by outplaying opponents who relaxed.","ready":"You can explain what the a4-pawn costs White."},{"tier":"Plans","when":"Months two to five","goal":"Learn the freeing breaks and when to use them.","learn":["The ...c5 break, which turns your solid position into an active one. It is the goal of nearly every Slav plan.","The ...e5 break, available when White's pieces drift to the queenside.","How to meet e4: usually ...Bg6 and then hit the centre with ...c5, rather than blocking with ...e5 immediately."],"drill":"In ten games, count how many moves it takes you to achieve ...c5. Under fifteen is good; over twenty means you were too passive.","mistake":"Never breaking. A Slav that never plays ...c5 or ...e5 is just a cramped position with no weaknesses and no future.","ready":"You reach ...c5 or ...e5 in most of your games under good circumstances."},{"tier":"Mastery","when":"Ongoing","goal":"Take on the Semi-Slav and the theoretical monsters.","learn":["The Meran, where you get a queenside majority and enormous complications.","The Botvinnik and Anti-Moscow gambits \u2014 among the sharpest lines in all of chess theory, and unavoidable if you play 4...e6.","Slav endgames with a queenside majority: how to create the outside passed pawn."],"drill":"Decide honestly whether you want the Botvinnik. If not, choose the Moscow Variation move order and avoid it entirely.","mistake":"Drifting into the Semi-Slav without preparation. It is a completely different opening from the Main Line Slav.","ready":"You have chosen your branch and know it fifteen moves deep."}],"study":"Viswanathan Anand and Vladimir Kramnik played the defining Semi-Slav battles of the 2000s. For the classical Main Line, look at Max Euwe and Anatoly Karpov.","next":"Add the Queen's Gambit Declined as a second option. Between the Slav and the QGD you have an answer to every 1.d4 system White can build."}}];

const STRUCTURES = [{"id":"open-game-small-centre","name":"The Open Game small centre (d3/e4 vs d6/e5)","tier":"Foundation","taxonomy":"No canonical name in Flores Rios or Soltis \u2014 both taxonomies are built around 1.d4 structures and the Open Sicilian. Call it what the players call it: the Pianissimo centre.","white_plans":["Finish the knight tour Nb1\u2013d2\u2013f1\u2013g3 before touching a pawn. Three slow moves that decide the next thirty.","Play d3\u2013d4 only when every piece already supports it. Until then the pawn on d3 is doing its job by standing still.","a4 and b4 on the other wing once Black commits to the kingside. Two weaknesses beat one.","h3 always: it takes g4 away from the c8-bishop and gives the king air. This is not a wasted move, it is the cheapest insurance in chess."],"black_plans":["Mirror the tour with ...Nc6\u2013e7\u2013g6, then ...c6 and ...d5 to break in the centre.","...Ba7 or ...Bb6 in advance, so that White's d4 never comes with tempo.","...Be6 to trade the Italian bishop, accepting a backward e-pawn for the light squares.","...a6 and ...b5 for queenside space while White is busy on the other side."],"key_squares":["d5","f5","d4","g3","a7\u2013g1 diagonal"],"pawn_breaks":["White: d3\u2013d4, and much later f2\u2013f4 or a2\u2013a4","Black: ...d6\u2013d5, and ...f7\u2013f5 once the knight reaches g6"],"pitfalls":["Playing d4 the moment it is legal. In this structure d4 is a reward, not a move.","Attacking with two pieces. Count attackers against defenders before you commit the h-pawn.","Trading the light-squared bishop for nothing. It is the reason this opening exists."],"endgame_note":"Queenless, this structure favours whoever has the better minor piece, not whoever has more space. A knight on d5 or f5 outweighs a bishop staring at its own pawn chain.","also_in":["fourknights \u2014 Morphy Defense, Tarrasch Variation reaches the identical d3+e4 vs d6+e5 skeleton.","fourknights \u2014 Spanish Four Knights (Metger) is the same structure one move before White commits to d4.","ruylopez \u2014 every Anti-Marshall and d3 Ruy arrives here; the Closed Ruy passes through it on the way to d4."],"board":"r.bq.rk.bpp.npppp..p.n......p.....B.P.....PP.N.PPP.N.PP.R.BQR.K.","openings":[]},{"id":"italian-big-centre","name":"The Italian/Spanish big centre (c3+d4+e4 vs d6+e5)","tier":"Structure","taxonomy":"Soltis groups this with the classical King's-pawn centres; Flores Rios does not cover it. It is the single most common structure in the whole 1.e4 e5 world.","white_plans":["Keep the tension. Whoever resolves it first usually helps the other side.","d4\u2013d5 closes the centre and hands you the kingside: after that, Ng3, Nf5 and the f- or g-pawn.","dxe5 opens the game and is right only when your pieces are better placed than Black's \u2014 count first.","a4 and b4 on the queenside once the centre is locked. The pawns point that way; follow them."],"black_plans":["...exd4 followed by ...d5, the standard freeing operation, timed for when White's rook has left e1.","...c6 and ...Qc7, the standard post: pressure on the c-file, support for e5, out of the rooks' way.","...Ne7\u2013g6 and ...h6 to hold the kingside before White's knight arrives on g3.","...Be6 to trade the Italian bishop while the centre is still closed enough to survive fxe6."],"key_squares":["d5","f5","c4","e5","b5"],"pawn_breaks":["White: d4\u2013d5 (closing), dxe5 (opening), a2\u2013a4 and b2\u2013b4, later f2\u2013f4","Black: ...exd4, ...d6\u2013d5, ...c7\u2013c5 against a locked centre"],"pitfalls":["Releasing the tension because it feels uncomfortable. Discomfort is the position, not a problem in it.","Playing d5 with the queenside undeveloped \u2014 you have just handed Black the c5 square and a free hand.","Forgetting that after d4\u2013d5 the c1-bishop has no future until you play c3\u2013c4 and b2\u2013b4."],"endgame_note":"With queens off, the extra central pawn tells: White's d4+e4 gives an extra tempo in every pawn race and a shelter for the king on e3. Trade into it when Black's pieces are passive, avoid it when Black has the bishop pair.","also_in":["ruylopez \u2014 Closed Ruy Lopez (Chigorin) reaches an identical White skeleton (a2,b2,c3,d4,e4,f2,g2,h3); Black differs only by ...b5 and ...c5.","fourknights \u2014 Caro Variation (Graz) reaches the identical White skeleton, move for move.","fourknights \u2014 Spanish Four Knights (Metger) reaches it with doubled c-pawns after ...Bxc3 bxc3."],"board":"r.bq.rk.bpp.npppp..p.n......p.....BPP.....P..N.PPP.N.PP.R.BQR.K.","openings":[{"id":"italian","name":"Italian Game","line":"Giuoco Pianissimo \u2014 Main Line"},{"id":"italian","name":"Italian Game","line":"Deep dive \u2014 the Pianissimo plan in action"}]},{"id":"broad-centre-open-c-file","name":"The pawn duo with the c-file open (d4+e4 vs d6)","tier":"Plans","taxonomy":"The 'classical centre' of the older literature. Neither Flores Rios nor Soltis gives it a chapter, because it is a transitional structure \u2014 but it is where the Italian and the Ruy Lopez both end up.","white_plans":["Rc1 and Rc3, using the file the c-pawn vacated when it recaptured on d4.","d4\u2013d5 to gain space and lock Black's bishop out, then play on the queenside where the pawns point.","e4\u2013e5 only with a knight ready to land on e4 or d6 behind it.","Bb3 and Qd3, the battery on the a2\u2013g8 diagonal that Black's ...d6 cannot cover."],"black_plans":["...c6 and ...d5, the freeing break \u2014 it is the only one, so White should prevent it and Black should prepare it.","...Nb6 or ...Na5 to hit the c4-bishop and win the d5 square outright.","Blockade on d5 with a knight. A blockading knight in front of a duo is worth more than the pawn it stops."],"key_squares":["d5","c5","e5","c6"],"pawn_breaks":["White: d4\u2013d5, e4\u2013e5, b2\u2013b4\u2013b5","Black: ...c7\u2013c6 and ...d6\u2013d5, ...b7\u2013b5"],"pitfalls":["Advancing the duo without pieces behind it \u2014 two pawns on d5 and e5 with nothing supporting them are two targets.","Leaving the c-file to a black rook. If Black gets ...Rc8 in first, the file is a liability not an asset."],"endgame_note":"The half-open c-file plus the duo usually means a healthy queenside majority. Simplify toward a rook endgame and push the majority; the extra central pawn covers the squares your king needs to march through.","also_in":["ruylopez \u2014 the Chigorin deep dive reaches exactly this White skeleton (a2,b2,d4,e4,f2,g2,h3) after ...cxd4 cxd4; Black's half-open file is the c-file rather than the e-file.","scotch \u2014 the Classical Variation arrives at a related version with e4 against ...d6 and no d-pawn."],"board":"r.bq.rk.bpp.npppp..p.n............BPP........N.PPP.N.PP.R.BQR.K.","openings":[]},{"id":"isolani","name":"The Isolani \u2014 White's isolated queen's pawn on d4","tier":"Structure","taxonomy":"A named chapter in both Flores Rios (Chess Structures) and Soltis (Pawn Structure Chess). The single most transferable structure in this whole course.","white_plans":["Attack now. The isolated pawn is an engine in the middlegame and a liability in the endgame, so the clock is running.","Take d5 and e5 with pieces: Ne5, Bd3, Qd3 or Qc2 aiming at h7, Rd1 behind the pawn.","The d4\u2013d5 break at the right moment \u2014 the pawn stops being weak the instant it advances.","Avoid every queen trade that is not part of a concrete win."],"black_plans":["Blockade d5 with a knight, then trade every other piece. A blockaded isolani is just a weak pawn.","...Be6 and ...Rc8, pressing on c-file and d-file at once.","Head for the endgame. Every trade helps the side playing against the isolani."],"key_squares":["d5 (the blockade square)","e5","c5","h7"],"pawn_breaks":["White: d4\u2013d5","Black: ...b7\u2013b5\u2013b4 or ...f7\u2013f6 to undermine an e5 knight"],"pitfalls":["Defending the d-pawn with pieces. It does not need defending yet \u2014 it needs the game to be decided before it does.","Trading a pair of knights 'to simplify'. Every trade brings the endgame you lose closer.","As Black: taking the pawn too early and letting the pieces flood in. Blockade first, win it later."],"endgame_note":"This is the whole point of the structure. With queens and a pair of rooks off, the d4-pawn is simply weak and the blockading knight is simply strong. If you have the isolani, your endgame plan is to not reach one.","also_in":["italian \u2014 reached directly from the Giuoco Piano main line 5.d4 exd4 6.cxd4 Bb4+ 7.Bd2 Bxd2+ 8.Nbxd2 d5 9.exd5 Nxd5.","carokann \u2014 the Panov-Botvinnik Attack ends on the identical White skeleton (a2,b2,d4,f2,g2,h2).","queensgambit \u2014 the Queen's Gambit Accepted ends on the same skeleton with the a-pawn on a4.","nimzo \u2014 the Rubinstein Variation (4.e3) ends on the identical White skeleton."],"board":"r.bq.rk.ppp..ppp..n........n......BP.........N..PP.N.PPPR..Q.RK.","openings":[]},{"id":"evans-open-lines","name":"The gambit imbalance \u2014 open lines for two pawns","tier":"Plans","taxonomy":"Not a pawn structure in the taxonomic sense, and it would be dishonest to pretend otherwise. It is a material-for-time imbalance, and it needs its own card because the plans are nothing like the Italian's.","white_plans":["Re1 and Ba3 \u2014 the two files and diagonals that Black's king cannot cover.","Nbd2\u2013e4 or \u2013c4, bringing the last piece before the first threat.","e4\u2013e5 as a wedge: it takes f6 and d6 from Black's pieces and it is worth more than the pawn it costs.","Never recapture on c3 if recapturing costs a tempo. You bought time; do not spend it buying a pawn back."],"black_plans":["Give one pawn back to finish developing. ...d6 and ...Nge7 is worth more than a pawn on c3.","Trade queens at any cost. Every trade is worth half a pawn to the defender.","Get the king off e8 \u2014 long castling is often better here, because White's pieces all point at the kingside."],"key_squares":["f7","e5","a3\u2013f8 diagonal","the e-file"],"pawn_breaks":["White: e4\u2013e5, and f2\u2013f4\u2013f5 once the rooks are in","Black: ...d7\u2013d5 to blunt the c4-bishop, ...f7\u2013f6 to challenge the e5 wedge"],"pitfalls":["Attacking before Nb1 has moved. The gambit is a development lead \u2014 an undeveloped piece is a returned pawn.","Treating the gambit as a trick. At any decent level these are real openings with real theory and Black's defences hold."],"endgame_note":"There is no good endgame here for White, which is the honest evaluation of every gambit ever played. Your endgame plan is to have won by then.","also_in":["No other opening in this course reaches this imbalance. The Evans is on its own, which is part of why it is a surprise weapon rather than a repertoire."],"board":"r.b.k.nrpppp.ppp..n...q.b...P.....B......Qp..N..P....PPPRNB..RK.","openings":[{"id":"italian","name":"Italian Game","line":"Evans Gambit"}]}];

/* The same four words the learning path already uses, in the order they build on
   each other. Content carries one; the selector shows everything up to it. */
const TIERS = ["Foundation", "Structure", "Plans", "Mastery"];

const state = {
  view:"primer", opId:null, line:0, ply:0, flip:false, timer:null,
  arrows:true, tier:"Mastery",

  mode:"read",   // "read" | "drill"
  sel:null,      // square the learner has picked up, e.g. "f1"
  drag:null,     // {from, id} while a pointer drag is live
  pick:false,    // the deviation picker is open

  /* Stepping through a deviation. The ONLY second cursor: state.ply keeps
     meaning what it has always meant and is not touched while this is set, so
     leaving a branch is `state.branch = null` and you are exactly where you
     were. Indices, not a resolved array, so it cannot go stale. */
  branch:null,   // {fromPly, idx, at, origin}

  structId:null, // view === "structure"
  gameId:null,   // view === "game"; a game reuses state.ply, so the transport works unchanged

  /* Session-only. Scores are mirrored into the store when a line finishes. */
  drill:{phase:"ask", hint:0, tries:0, seen:{}, streak:0, cursor:"e4", msg:"", tone:""}
};

/* Handlers for every control that declares data-act, dispatched by the one
   delegated listener render.js installs on #content. It is declared here, with
   the other shared names, because the scripts share a single scope: a file
   concatenated before render.js could not otherwise register into it. */
const ACTIONS = {};

/* Every read of the position on screen goes through these three. Today they only
   ever resolve the current line, but they are the seam a second sequence plugs
   into -- a deviation you are stepping through, a model game -- without any of
   their callers learning about it. */
function curSeq(){
  if(state.branch) return brSeq();
  if(state.view==="game"){
    const g = GAMES.find(x=>x.id===state.gameId);
    return g ? g.plies : [];
  }
  const op = DATA.find(o=>o.id===state.opId);
  const line = op && op.lines[state.line];
  return line ? line.plies : [];
}
function curIdx(){ return state.branch ? state.branch.at : state.ply; }
function curPly(){ const seq = curSeq(); return seq[curIdx()] || seq[0]; }

/* ---------------- persistence ---------------- */
/* One key -- DB_KEY, declared by theme.js, which has to read this payload from
   <head> long before this file runs -- with the version inside the payload
   rather than in the key name, so a migration can read what the old build wrote
   instead of orphaning it.

   Storage may simply not exist: opening the built file from a file:// URL throws
   in some browsers on the localStorage PROPERTY, not just on write, so the probe
   has to wrap the access itself. When it fails everything below still works --
   it just lives for the session, and the progress view says so. */
const DB_VERSION = 1;

let dbMem = null;      // session-lifetime fallback when storage is unavailable
let dbFrozen = false;  // payload came from a newer build: read it, never overwrite
let dbTimer = null;

const dbOK = (function(){
  try{
    window.localStorage.setItem("__probe", "1");
    window.localStorage.removeItem("__probe");
    return true;
  }catch(e){ return false; }
})();

function dbDefaults(){
  return {
    v: DB_VERSION,
    ui: {tier:"Mastery", mode:"read", arrows:true},
    last: {view:"primer", opId:null, line:0, ply:0},
    streak: {cur:0, best:0, day:""},
    lines: {}
  };
}

function dbMigrate(saved){
  const out = dbDefaults();
  if(!saved || typeof saved !== "object") return out;
  if((saved.v|0) > DB_VERSION) dbFrozen = true;
  ["ui","last","streak"].forEach(k=>{
    if(saved[k] && typeof saved[k]==="object") Object.assign(out[k], saved[k]);
  });
  if(saved.lines && typeof saved.lines==="object") out.lines = saved.lines;
  out.v = DB_VERSION;
  return out;
}

const db = (function(){
  let raw = null;
  try{ raw = dbOK ? window.localStorage.getItem(DB_KEY) : null; }catch(e){}
  if(!raw) return dbDefaults();
  try{ return dbMigrate(JSON.parse(raw)); }catch(e){ return dbDefaults(); }
})();

/* Debounced: stepping through a line with the arrow keys would otherwise write
   on every keypress. Flushed hard on the two events that mean "the page may be
   about to go away". */
function dbSave(){
  if(dbFrozen) return;
  if(dbTimer) clearTimeout(dbTimer);
  dbTimer = setTimeout(dbFlush, 400);
}
function dbFlush(){
  if(dbTimer){ clearTimeout(dbTimer); dbTimer = null; }
  if(dbFrozen) return;
  const raw = JSON.stringify(db);
  if(dbOK){ try{ window.localStorage.setItem(DB_KEY, raw); }catch(e){ dbMem = raw; } }
  else dbMem = raw;
}
window.addEventListener("visibilitychange", ()=>{ if(document.hidden) dbFlush(); });
window.addEventListener("pagehide", dbFlush);

function dbRemember(){
  db.last = {view:state.view, opId:state.opId, line:state.line, ply:state.ply};
  db.ui.tier = state.tier;
  db.ui.arrows = state.arrows;
  dbSave();
}

/* Written only when the learner picks a theme, which is why dbDefaults() has no
   theme in it. Absent means "follow the system", and a default written here
   would quietly end that the first time anything else was saved. The live value
   is the attribute on <html>, not a field here: theme.js already set it. */
function dbTheme(name){
  db.ui.theme = name;
  dbSave();
}

/* Restoring is the one place a stored value reaches straight into an array
   index, so every field is clamped against the catalogue as it exists NOW --
   an opening that was removed, or a line that got shorter, must not throw. */
function dbRestore(){
  const ui = db.ui || {};
  if(TIERS.indexOf(ui.tier) >= 0) state.tier = ui.tier;
  if(typeof ui.arrows === "boolean") state.arrows = ui.arrows;

  const last = db.last || {};
  const op = DATA.find(o=>o.id===last.opId);
  if(last.view !== "op" || !op) return;
  state.view = "op";
  state.opId = op.id;
  state.line = Math.min(Math.max(0, last.line|0), op.lines.length - 1);
  state.ply  = Math.min(Math.max(0, last.ply|0), op.lines[state.line].plies.length - 1);
  state.flip = op.orientation === "black";
}

function dbLineKey(opId, line){ return opId + "/" + line; }
function dbProgress(opId, line){ return db.lines[dbLineKey(opId, line)] || null; }

function dbExport(){ return JSON.stringify(db, null, 2); }

function dbImport(text){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ return "That is not valid JSON."; }
  if(!parsed || typeof parsed !== "object") return "That file does not look like a progress export.";
  const fresh = dbMigrate(parsed);
  dbFrozen = false;
  Object.keys(db).forEach(k=>{ delete db[k]; });
  Object.assign(db, fresh);
  dbFlush();
  return null;
}

function dbReset(){
  Object.keys(db).forEach(k=>{ delete db[k]; });
  Object.assign(db, dbDefaults());
  dbFrozen = false;
  dbFlush();
}

/* ---------------- chrome: the tier selector and the progress chip ---------------- */
/* Lives outside #content so render() never redraws it, and so it survives on
   narrow screens where the rail is display:none. */

/* Untiered content ranks 0 and is therefore always visible. That is what lets an
   opening carry no tier at all and lose nothing. */
function tierRank(t){
  if(!t) return 0;
  const i = TIERS.findIndex(x=>x.toLowerCase()===String(t).toLowerCase());
  return i < 0 ? 0 : i;
}
function tierVisible(t){ return tierRank(t) <= tierRank(state.tier); }

function buildChrome(){
  const el = document.getElementById("chrome");
  el.innerHTML = `
    <div class="tierbar" role="radiogroup" aria-label="Show content up to">
      <span class="tierlbl">Show</span>
      ${TIERS.map((t,i)=>`<button class="tierseg" data-tier="${t}" role="radio"
        aria-checked="false">${i?"+ ":""}${t}</button>`).join("")}
    </div>
    <button class="chip" id="progchip"></button>`;

  // The theme toggle belongs to the page, not to the course, so it is built into
  // the masthead rather than this row.
  document.getElementById("mastacts").innerHTML =
    `<button class="chip themetog" id="themetog"></button>`;

  el.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{
    state.tier = b.dataset.tier;
    dbRemember();
    syncChrome();
    render();
    dxSay(`Showing content up to ${state.tier}.`);
  });
  document.getElementById("progchip").onclick = ()=>go("progress");

  // Nothing to re-render: the themes differ only in the custom properties the
  // stylesheet already reads, so setting the attribute repaints the whole page.
  document.getElementById("themetog").onclick = ()=>{
    const next = themeName() === "light" ? "dark" : "light";
    themeSet(next);
    dbTheme(next);
    syncChrome();
    dxSay(`${next === "light" ? "Light" : "Dark"} theme.`);
  };

  // Left/right walk the group, the way a radio group is expected to behave.
  el.querySelector(".tierbar").addEventListener("keydown", e=>{
    const keys = {ArrowLeft:-1, ArrowRight:1};
    if(!(e.key in keys)) return;
    const i = TIERS.indexOf(state.tier);
    const next = TIERS[Math.min(TIERS.length-1, Math.max(0, i + keys[e.key]))];
    if(next === state.tier) return;
    state.tier = next; dbRemember(); syncChrome(); render();
    el.querySelector(`[data-tier="${next}"]`).focus();
    e.preventDefault();
  });

  syncChrome();
}

function syncChrome(){
  document.querySelectorAll("[data-tier]").forEach(b=>{
    const on = b.dataset.tier === state.tier;
    b.classList.toggle("on", on);
    b.setAttribute("aria-checked", on ? "true" : "false");
  });
  const chip = document.getElementById("progchip");
  if(chip) chip.innerHTML = progressChipHTML();

  // The button names the theme it switches TO, so its label and its accessible
  // name say the same thing and neither has to be read as a state.
  const tog = document.getElementById("themetog");
  if(tog){
    const to = themeName() === "light" ? "dark" : "light";
    // Until a choice is stored the page is following the system, and only the
    // tooltip can say so -- the label has to keep naming the destination.
    const how = (db.ui || {}).theme ? "" : ", which is currently following your system";
    tog.innerHTML = `<span class="glyph" aria-hidden="true">${to === "light" ? "☀" : "☾"}</span>${to}`;
    tog.setAttribute("aria-label", `Switch to the ${to} theme`);
    tog.title = `Switch to the ${to} theme${how}`;
  }
}

function drilledCount(){ return Object.keys(db.lines).length; }

function progressChipHTML(){
  const n = drilledCount();
  if(!n) return `Your progress`;
  return `<b>${n}</b> line${n===1?"":"s"} drilled` +
         (db.streak.best ? ` <span class="sep">·</span> best streak <b>${db.streak.best}</b>` : "");
}

/* Announce to assistive tech. Also the single place that guarantees every piece
   of feedback has a non-visual form -- reduced-motion users lose the animations,
   never the message. */
function dxSay(msg){

  if(!el) return;
  el.textContent = "";
  setTimeout(()=>{ el.textContent = msg; }, 30);
}

function progressHTML(){
  const rows = Object.keys(db.lines).sort().map(key=>{
    const [opId, li] = key.split("/");
