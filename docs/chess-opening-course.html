ategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"d5","fen":"rnbqkbnrppp.pppp...........p.......P............PPP.PPPPRNBQKBNR","from":"d7","to":"d5","note":"Black mirrors solidly.","num":"1...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"ctrl"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"Bf4","fen":"rnbqkbnrppp.pppp...........p.......P.B..........PPP.PPPPRN.QKBNR","from":"c1","to":"f4","note":"The defining move, and the reason to play the London in this move order. The bishop gets outside the pawn chain before e3 shuts it in.","num":"2.Bf4","turn":"w","check":false,"arrows":[{"f":"c1","t":"f4","k":"move"},{"f":"f4","t":"c7","k":"atk"},{"f":"f4","t":"e5","k":"ctrl"},{"f":"f4","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on c7; controls e5 and d6"},{"san":"Nf6","fen":"rnbqkb.rppp.pppp.....n.....p.......P.B..........PPP.PPPPRN.QKBNR","from":"g8","to":"f6","note":"Natural development.","num":"2...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Controls e4"},{"san":"e3","fen":"rnbqkb.rppp.pppp.....n.....p.......P.B......P...PPP..PPPRN.QKBNR","from":"e2","to":"e3","note":"Now the pawn chain is complete: d4, e3 and soon c3. Small, but there is nothing to attack.","num":"3.e3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"e6","fen":"rnbqkb.rppp..ppp....pn.....p.......P.B......P...PPP..PPPRN.QKBNR","from":"e7","to":"e6","note":"Black develops and prepares to challenge with ...c5.","num":"3...e6","turn":"b","check":false,"arrows":[{"f":"e7","t":"e6","k":"move"},{"f":"e6","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"Nf3","fen":"rnbqkb.rppp..ppp....pn.....p.......P.B......PN..PPP..PPPRN.QKB.R","from":"g1","to":"f3","note":"Supporting d4 and preparing to castle.","num":"4.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"ctrl"}],"tactics":"Controls e5"},{"san":"c5","fen":"rnbqkb.rpp...ppp....pn....pp.......P.B......PN..PPP..PPPRN.QKB.R","from":"c7","to":"c5","note":"The main challenge. Black hits the base of the pawn chain.","num":"4...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"},{"san":"c3","fen":"rnbqkb.rpp...ppp....pn....pp.......P.B....P.PN..PP...PPPRN.QKB.R","from":"c2","to":"c3","note":"Reinforcing d4. Now White's pyramid c3\u2013d4\u2013e3 is complete and rock solid.","num":"5.c3","turn":"w","check":false,"arrows":[{"f":"c2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"def"}],"tactics":"Defends the pawn on d4"},{"san":"Nc6","fen":"r.bqkb.rpp...ppp..n.pn....pp.......P.B....P.PN..PP...PPPRN.QKB.R","from":"b8","to":"c6","note":"Adding pressure on d4.","num":"5...Nc6","turn":"b","check":false,"arrows":[{"f":"b8","t":"c6","k":"move"},{"f":"c6","t":"d4","k":"atk"},{"f":"c6","t":"e5","k":"ctrl"}],"tactics":"Attacks the pawn on d4; controls e5"},{"san":"Nbd2","fen":"r.bqkb.rpp...ppp..n.pn....pp.......P.B....P.PN..PP.N.PPPR..QKB.R","from":"b1","to":"d2","note":"The knight goes to d2, not c3, so that the c-pawn stays on c3 supporting d4. It also supports the key e5 square.","num":"6.Nbd2","turn":"w","check":false,"arrows":[{"f":"b1","t":"d2","k":"move"},{"f":"d2","t":"e4","k":"ctrl"},{"f":"d2","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"Bd6","fen":"r.bqk..rpp...ppp..nbpn....pp.......P.B....P.PN..PP.N.PPPR..QKB.R","from":"f8","to":"d6","note":"Black offers a trade of the important dark-squared bishops.","num":"6...Bd6","turn":"b","check":false,"arrows":[{"f":"f8","t":"d6","k":"move"},{"f":"d6","t":"f4","k":"atk"},{"f":"d6","t":"c5","k":"def"},{"f":"d6","t":"e5","k":"ctrl"}],"tactics":"Attacks the bishop on f4; defends the pawn on c5; controls e5"},{"san":"Bg3","fen":"r.bqk..rpp...ppp..nbpn....pp.......P......P.PNB.PP.N.PPPR..QKB.R","from":"f4","to":"g3","note":"The bishop steps back and declines the trade, keeping the good bishop and staying on the b8\u2013h2 diagonal aimed at h7.","num":"7.Bg3","turn":"w","check":false,"arrows":[{"f":"f4","t":"g3","k":"move"},{"f":"g3","t":"d6","k":"atk"},{"f":"g3","t":"e5","k":"ctrl"},{"f":"g3","t":"f4","k":"ctrl"}],"tactics":"Attacks the bishop on d6; controls e5 and f4"},{"san":"O-O","fen":"r.bq.rk.pp...ppp..nbpn....pp.......P......P.PNB.PP.N.PPPR..QKB.R","from":"e8","to":"g8","note":"King safety.","num":"7...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Bd3","fen":"r.bq.rk.pp...ppp..nbpn....pp.......P......PBPNB.PP.N.PPPR..QK..R","from":"f1","to":"d3","note":"The bishop finds the b1\u2013h7 diagonal. Together with the g3-bishop, White now has two bishops pointing at Black's king.","num":"8.Bd3","turn":"w","check":false,"arrows":[{"f":"f1","t":"d3","k":"move"},{"f":"d3","t":"h7","k":"atk"},{"f":"d3","t":"e4","k":"ctrl"},{"f":"d3","t":"f5","k":"ctrl"}],"tactics":"Attacks the pawn on h7; controls e4 and f5"},{"san":"b6","fen":"r.bq.rk.p....ppp.pnbpn....pp.......P......PBPNB.PP.N.PPPR..QK..R","from":"b7","to":"b6","note":"Black prepares to fianchetto and challenge the long diagonal.","num":"8...b6","turn":"b","check":false,"arrows":[{"f":"b7","t":"b6","k":"move"},{"f":"b6","t":"c5","k":"def"}],"tactics":"Defends the pawn on c5"},{"san":"Ne5","fen":"r.bq.rk.p....ppp.pnbpn....ppN......P......PBP.B.PP.N.PPPR..QK..R","from":"f3","to":"e5","note":"The signature move of the London System. The knight lands on the outpost supported by d4 and the d2-knight, and it takes away Black's key squares.","num":"9.Ne5","turn":"w","check":false,"arrows":[{"f":"f3","t":"e5","k":"move"},{"f":"e5","t":"c6","k":"atk"},{"f":"e5","t":"f7","k":"atk"},{"f":"e5","t":"c4","k":"ctrl"}],"tactics":"Attacks the knight on c6 (undefended!) and the pawn on f7; controls c4"},{"san":"Bb7","fen":"r..q.rk.pb...ppp.pnbpn....ppN......P......PBP.B.PP.N.PPPR..QK..R","from":"c8","to":"b7","note":"Black develops.","num":"9...Bb7","turn":"b","check":false,"arrows":[{"f":"c8","t":"b7","k":"move"},{"f":"b7","t":"c6","k":"def"}],"tactics":"Defends the knight on c6"},{"san":"Qf3","fen":"r..q.rk.pb...ppp.pnbpn....ppN......P......PBPQB.PP.N.PPPR...K..R","from":"d1","to":"f3","note":"The attack begins. The plan is Qh3 (or Qf3\u2013h3), f4 supporting the knight, then Rf3\u2013h3 and a pile-up on h7. If Black ever plays ...h6, the sacrifice Bxh6 becomes real.","num":"10.Qf3","turn":"w","check":false,"arrows":[{"f":"d1","t":"f3","k":"move"},{"f":"f3","t":"d5","k":"atk"},{"f":"f3","t":"f6","k":"atk"},{"f":"f3","t":"e4","k":"ctrl"},{"f":"f3","t":"f5","k":"ctrl"}],"tactics":"Attacks the pawn on d5 and the knight on f6; controls e4 and f5"},{"san":"Nxe5","fen":"r..q.rk.pb...ppp.p.bpn....ppn......P......PBPQB.PP.N.PPPR...K..R","from":"c6","to":"e5","note":"Black trades off the outpost knight. Sensible \u2014 that knight was the heart of White's position.","num":"10...Nxe5","turn":"b","check":false,"arrows":[{"f":"c6","t":"e5","k":"move"},{"f":"e5","t":"d3","k":"atk"},{"f":"e5","t":"f3","k":"atk"},{"f":"e5","t":"c4","k":"ctrl"}],"tactics":"Attacks the bishop on d3 (undefended!) and the queen on f3; controls c4"},{"san":"Bxe5","fen":"r..q.rk.pb...ppp.p.bpn....ppB......P......PBPQ..PP.N.PPPR...K..R","from":"g3","to":"e5","note":"White recaptures with the bishop, which now sits on e5 doing exactly the same job.","num":"11.Bxe5","turn":"w","check":false,"arrows":[{"f":"g3","t":"e5","k":"move"},{"f":"e5","t":"d4","k":"def"},{"f":"e5","t":"d6","k":"atk"},{"f":"e5","t":"f6","k":"atk"},{"f":"e5","t":"f4","k":"ctrl"}],"tactics":"Attacks the bishop on d6 and the knight on f6; defends the pawn on d4; controls f4"},{"san":"Bxe5","fen":"r..q.rk.pb...ppp.p..pn....ppb......P......PBPQ..PP.N.PPPR...K..R","from":"d6","to":"e5","note":"Black repeats the idea and trades again.","num":"11...Bxe5","turn":"b","check":false,"arrows":[{"f":"d6","t":"e5","k":"move"},{"f":"e5","t":"h2","k":"atk"},{"f":"e5","t":"d4","k":"atk"},{"f":"e5","t":"f6","k":"def"},{"f":"e5","t":"f4","k":"ctrl"},{"f":"e5","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on h2 and the pawn on d4; defends the knight on f6; controls f4 and d6"},{"san":"dxe5","fen":"r..q.rk.pb...ppp.p..pn....ppP.............PBPQ..PP.N.PPPR...K..R","from":"d4","to":"e5","note":"And here is the transformation. White recaptures with the d-pawn, giving up the broad centre for a pawn on e5 that cramps Black and shields the coming build-up.","num":"12.dxe5","turn":"w","check":false,"arrows":[{"f":"d4","t":"e5","k":"move"},{"f":"e5","t":"f6","k":"atk"},{"f":"e5","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls d6"},{"san":"Nd7","fen":"r..q.rk.pb.n.ppp.p..p.....ppP.............PBPQ..PP.N.PPPR...K..R","from":"f6","to":"d7","note":"The knight retreats to a passive square. Black is suddenly short of space.","num":"12...Nd7","turn":"b","check":false,"arrows":[{"f":"f6","t":"d7","k":"move"},{"f":"d7","t":"e5","k":"atk"}],"tactics":"Attacks the pawn on e5 (undefended!)"},{"san":"Qg3","fen":"r..q.rk.pb.n.ppp.p..p.....ppP.............PBP.Q.PP.N.PPPR...K..R","from":"f3","to":"g3","note":"The queen sidesteps to g3, unblocking the f-pawn and adding a third attacker to the b8\u2013h2 diagonal.","num":"13.Qg3","turn":"w","check":false,"arrows":[{"f":"f3","t":"g3","k":"move"},{"f":"g3","t":"e5","k":"def"},{"f":"g3","t":"g7","k":"atk"},{"f":"g3","t":"f4","k":"ctrl"}],"tactics":"Attacks the pawn on g7; defends the pawn on e5; controls f4"},{"san":"f5","fen":"r..q.rk.pb.n..pp.p..p.....ppPp............PBP.Q.PP.N.PPPR...K..R","from":"f7","to":"f5","note":"Black blocks the diagonal and stops f4\u2013f5. The standard defensive try.","num":"13...f5","turn":"b","check":false,"arrows":[{"f":"f7","t":"f5","k":"move"},{"f":"f5","t":"e4","k":"ctrl"}],"tactics":"Controls e4"},{"san":"exf6","fen":"r..q.rk.pb.n..pp.p..pP....pp..............PBP.Q.PP.N.PPPR...K..R","from":"e5","to":"f6","note":"En passant. Because Black's pawn passed the e5-pawn's capture square in a single move, White may take it as though it had moved only one. The f-file cracks open.","num":"14.exf6","turn":"w","check":false,"arrows":[{"f":"e5","t":"f6","k":"move"},{"f":"f6","t":"g7","k":"atk"}],"tactics":"Attacks the pawn on g7"},{"san":"Nxf6","fen":"r..q.rk.pb....pp.p..pn....pp..............PBP.Q.PP.N.PPPR...K..R","from":"d7","to":"f6","note":"Forced. Black recaptures, but the kingside is now open \u2014 which is what White wanted all along.","num":"14...Nxf6","turn":"b","check":false,"arrows":[{"f":"d7","t":"f6","k":"move"},{"f":"f6","t":"h7","k":"def"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Defends the pawn on h7; controls e4"},{"san":"O-O","fen":"r..q.rk.pb....pp.p..pn....pp..............PBP.Q.PP.N.PPPR....RK.","from":"e1","to":"g1","note":"Only now does White castle, into an already-open position, with the rook landing on the file it will attack down.","num":"15.O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"g1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Qe7","fen":"r....rk.pb..q.pp.p..pn....pp..............PBP.Q.PP.N.PPPR....RK.","from":"d8","to":"e7","note":"Black centralises the queen and defends.","num":"15...Qe7","turn":"b","check":false,"arrows":[{"f":"d8","t":"e7","k":"move"},{"f":"e7","t":"g7","k":"def"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Defends the pawn on g7; controls d6"},{"san":"Rae1","fen":"r....rk.pb..q.pp.p..pn....pp..............PBP.Q.PP.N.PPP....RRK.","from":"a1","to":"e1","note":"Both rooks join. White has the e-file, a bishop on d3 aiming at h7 and the queen on g3.","num":"16.Rae1","turn":"w","check":false,"arrows":[{"f":"a1","t":"e1","k":"move"}],"tactics":"a repositioning move"},{"san":"Rad8","fen":"...r.rk.pb..q.pp.p..pn....pp..............PBP.Q.PP.N.PPP....RRK.","from":"a8","to":"d8","note":"Black contests the centre.","num":"16...Rad8","turn":"b","check":false,"arrows":[{"f":"a8","t":"d8","k":"move"},{"f":"d8","t":"d6","k":"ctrl"}],"tactics":"Controls d6"},{"san":"f4","fen":"...r.rk.pb..q.pp.p..pn....pp.........P....PBP.Q.PP.N..PP....RRK.","from":"f2","to":"f4","note":"And the pawn finally advances, with f5 to come. A sharp, roughly balanced position \u2014 but look how it arrived. Nine quiet system moves, one knight to e5, and the London became an attack.","num":"17.f4","turn":"w","check":false,"arrows":[{"f":"f2","t":"f4","k":"move"},{"f":"f4","t":"e5","k":"ctrl"}],"tactics":"Controls e5"}]}],"progression":{"arc":"The London gets you a good position with almost no memorisation. The catch is that the middlegames are entirely up to you.","stages":[{"tier":"Foundation","when":"Day one","goal":"Learn the setup and, above all, the move order.","learn":["The setup: d4, Bf4, e3, Nf3, c3, Bd3, Nbd2, h3, O-O. Nine moves, playable against almost anything.","The one rule that matters: Bf4 before e3. Every bad London starts by locking the bishop in.","Why the knight goes to d2 and not c3 \u2014 the c-pawn must stay on c3 supporting d4."],"drill":"Play the nine-move setup in fifty blitz games. It should take you under a minute total.","mistake":"Playing on autopilot into a bad version. If Black plays an early ...c5 and ...Qb6, you must respond, not continue the routine.","ready":"You can reach the full setup against 1...d5, 1...Nf6 and 1...e6 without thinking."},{"tier":"Structure","when":"Weeks two to four","goal":"Recognise which of three middlegames you have landed in.","learn":["Type 1 \u2014 Black plays ...e6 and ...Bd6: you decline the bishop trade with Bg3, play Ne5 and attack the kingside.","Type 2 \u2014 Black fianchettoes: you switch plans entirely, play c4 and treat it as a Queen's Gambit.","Type 3 \u2014 Black plays ...c5 and ...Qb6 hitting b2: you need a concrete answer (Qb3, Qc1 or the Nc3 pawn offer)."],"drill":"Write down your answer to ...Qb6 and memorise it. It is the only real theory the London requires.","mistake":"Panicking when b2 is attacked and playing Qc1 passively every time. Sometimes offering the pawn is much stronger.","ready":"You can name which of the three types you are in by move six."},{"tier":"Plans","when":"Months two to four","goal":"Turn the solid position into an attack.","learn":["The attacking machine: Ne5, f4, Qf3\u2013h3, Rf3\u2013h3 and the Bxh6 sacrifice when Black weakens with ...h6.","The trade-on-d6 plan: swap dark-squared bishops, then use the dark squares and the c-file.","The queenside plan: b4, a4, Nb3\u2013c5 when Black castles kingside and commits to ...c5."],"drill":"Study the Bxh7+ and Bxh6 sacrifice patterns until you can calculate them in ten seconds. The London produces them constantly.","mistake":"Playing solidly forever. The London is not a draw machine \u2014 if you never attack, strong opponents simply equalise and outplay you.","ready":"You have won a game with the Qf3\u2013h3 build-up."},{"tier":"Mastery","when":"Ongoing","goal":"Add sharpness and cover the anti-London systems.","learn":["The Jobava London (2.Nc3 and 3.Bf4) for a much sharper version with e4 ideas.","The lines where Black plays an early ...Bf5 or ...Bg4, mirroring your own idea.","Endgames with the c3\u2013d4\u2013e3 structure: they are drawish unless you create an outside passer, so learn to create one."],"drill":"Play the Jobava version for a month and compare your results. Many players find it suits them better.","mistake":"Believing the London is 'safe'. It is sound, which is different \u2014 the safety has to come from your play.","ready":"You have two versions of the system and choose between them by opponent."}],"study":"Gata Kamsky brought the London back to elite level; Magnus Carlsen and Gukesh Dommaraju both use it as a serious weapon. For attacking models, look at Baadur Jobava's games.","next":"When you want more, learn the Queen's Gambit properly. The London will still be there as a low-preparation option for fast time controls."}},{"id":"catalan","name":"Catalan Opening","eco":"E00\u2013E09","section":"white-d4","orientation":"white","tagline":"d4 and c4 plus a fianchettoed bishop. Positional pressure that lasts into the endgame.","level":"Advanced \u2192 World Championship","theory":{"big_idea":"White combines the Queen's Gambit pawns (d4, c4) with a king's-Indian style fianchetto (g3, Bg2). The bishop on g2 \u2014 the 'Catalan bishop' \u2014 fires down the long diagonal at b7, d5 and c6 and it never stops. White is often willing to give up the c4-pawn for a while, because the resulting pressure and the eventual recovery of the pawn is worth more than the material. Games are decided in the endgame, when the Catalan bishop is still the best piece on the board.","structure":"White pawns on d4 and (temporarily) c4, with the fianchetto on g3. Black usually plays ...d5 and ...e6. The critical structural question is whether Black takes on c4 (Open Catalan, sharp) or holds with ...c6/...Nbd7 (Closed Catalan, cramped but solid).","white_plans":["Regain the c4-pawn with Qa4/Qc2 and Ne5, keeping the bishop's diagonal open.","Push e2\u2013e4 to gain the full centre once Black's pieces are tied down.","Play a4 to stop ...b5, then invade on c6 or the c-file.","Trade queens and grind: the Catalan bishop is at its most powerful in endgames."],"black_plans":["Take on c4 and try to hold with ...a6 and ...b5, gaining queenside space.","Block the diagonal with ...c6 and ...b5, or neutralise it directly with ...Bb7 and ...Be4.","The freeing break ...c5 or ...e5, the standard antidotes to a space disadvantage.","Play ...Bb4+ early to provoke Bd2 and gain time for ...dxc4 and ...a6/...b5."],"traps":["Trying to hold the pawn with ...b5 and ...c6 often collapses to a well-timed a4 or Ne5 hitting c6 and b5 at once.","Black's ...Bb4+ lines must be met with Bd2 (not Nc3, which blocks the bishop's support of the c-pawn recovery).","Never let the g2-bishop get shut in permanently \u2014 if Black plays ...c6 and ...b5, look for e4 or a4 immediately."],"who":"Play this if you enjoy positions where you have no risk of losing and endless small chances to win. Kramnik, Anand, Ding and Carlsen have all used it as a main weapon."},"lines":[{"name":"Open Catalan \u2014 Main Line","note":"Black grabs the pawn on c4 and tries to hold it with ...a6 and ...b5. White regains it with a lasting edge.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"Nf6","fen":"rnbqkb.rpppppppp.....n.............P............PPP.PPPPRNBQKBNR","from":"g8","to":"f6","note":"The Indian move order. Black hits e4 before deciding on a pawn structure, keeping every option open.","num":"1...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"d5","k":"ctrl"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Controls d5 and e4"},{"san":"c4","fen":"rnbqkb.rpppppppp.....n............PP............PP..PPPPRNBQKBNR","from":"c2","to":"c4","note":"The Queen's Gambit. Not a real gambit \u2014 after 2...dxc4 Black cannot hold the pawn. The point is to challenge d5 from the side and win the centre.","num":"2.c4","turn":"w","check":false,"arrows":[{"f":"c2","t":"c4","k":"move"},{"f":"c4","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"e6","fen":"rnbqkb.rpppp.ppp....pn............PP............PP..PPPPRNBQKBNR","from":"e7","to":"e6","note":"Black prepares ...d5 and keeps the Nimzo-Indian option open.","num":"2...e6","turn":"b","check":false,"arrows":[{"f":"e7","t":"e6","k":"move"},{"f":"e6","t":"d5","k":"ctrl"},{"f":"e6","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"g3","fen":"rnbqkb.rpppp.ppp....pn............PP..........P.PP..PP.PRNBQKBNR","from":"g2","to":"g3","note":"The Catalan move. White prepares to fianchetto instead of playing Nc3, so that the g2-bishop can pressure the queenside forever.","num":"3.g3","turn":"w","check":false,"arrows":[{"f":"g2","t":"g3","k":"move"},{"f":"g3","t":"f4","k":"ctrl"}],"tactics":"Controls f4"},{"san":"d5","fen":"rnbqkb.rppp..ppp....pn.....p......PP..........P.PP..PP.PRNBQKBNR","from":"d7","to":"d5","note":"Black takes the classical centre.","num":"3...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"c4","k":"atk"},{"f":"d5","t":"e4","k":"ctrl"}],"tactics":"Attacks the pawn on c4 (undefended!); controls e4"},{"san":"Bg2","fen":"rnbqkb.rppp..ppp....pn.....p......PP..........P.PP..PPBPRNBQK.NR","from":"f1","to":"g2","note":"The Catalan bishop takes its post. From here it eyes d5, c6, b7 and a8 for the entire game.","num":"4.Bg2","turn":"w","check":false,"arrows":[{"f":"f1","t":"g2","k":"move"},{"f":"g2","t":"d5","k":"atk"},{"f":"g2","t":"e4","k":"ctrl"}],"tactics":"Attacks the pawn on d5; controls e4"},{"san":"Be7","fen":"rnbqk..rppp.bppp....pn.....p......PP..........P.PP..PPBPRNBQK.NR","from":"f8","to":"e7","note":"Development.","num":"4...Be7","turn":"b","check":false,"arrows":[{"f":"f8","t":"e7","k":"move"},{"f":"e7","t":"c5","k":"ctrl"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Controls c5 and d6"},{"san":"Nf3","fen":"rnbqk..rppp.bppp....pn.....p......PP.........NP.PP..PPBPRNBQK..R","from":"g1","to":"f3","note":"Development, adding pressure to d5 and pr rom":"d2","to":"f4","note":"The bishop finds a better diagonal, eyeing c7 and the queenside dark squares.","num":"12.Bf4","turn":"w","check":false,"arrows":[{"f":"d2","t":"f4","k":"move"},{"f":"f4","t":"c7","k":"atk"},{"f":"f4","t":"e5","k":"ctrl"},{"f":"f4","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on c7; controls e5 and d6"},{"san":"Rc8","fen":"..rq.rk...pnbpppp...pn...p.........PbB.......NP.PP..PPBPRNQ..RK.","from":"a8","to":"c8","note":"Black prepares the freeing ...c5 and contests the c-file before White gets there.","num":"12...Rc8","turn":"b","check":false,"arrows":[{"f":"a8","t":"c8","k":"move"},{"f":"c8","t":"c7","k":"def"}],"tactics":"Defends the pawn on c7"},{"san":"Nbd2","fen":"..rq.rk...pnbpppp...pn...p.........PbB.......NP.PP.NPPBPR.Q..RK.","from":"b1","to":"d2","note":"The knight develops to d2 rather than c3 \u2014 from there it goes to b3 hitting c5 and a5, or to e5 supporting the kingside.","num":"13.Nbd2","turn":"w","check":false,"arrows":[{"f":"b1","t":"d2","k":"move"},{"f":"d2","t":"f3","k":"def"},{"f":"d2","t":"e4","k":"atk"},{"f":"d2","t":"c4","k":"ctrl"}],"tactics":"Attacks the bishop on e4; defends the knight on f3; controls c4"},{"san":"Bb7","fen":"..rq.rk..bpnbpppp...pn...p.........P.B.......NP.PP.NPPBPR.Q..RK.","from":"e4","to":"b7","note":"The bishop steps back to b7. Black has spent moves neutralising the Catalan bishop; that is time not spent on ...c5.","num":"13...Bb7","turn":"b","check":false,"arrows":[{"f":"e4","t":"b7","k":"move"},{"f":"b7","t":"f3","k":"atk"},{"f":"b7","t":"d5","k":"ctrl"},{"f":"b7","t":"e4","k":"ctrl"}],"tactics":"Attacks the knight on f3; controls d5 and e4"},{"san":"a4","fen":"..rq.rk..bpnbpppp...pn...p......P..P.B.......NP..P.NPPBPR.Q..RK.","from":"a2","to":"a4","note":"The key Catalan move. It attacks b5, the base of Black's entire queenside pawn chain. If b5 falls, so does everything behind it.","num":"14.a4","turn":"w","check":false,"arrows":[{"f":"a2","t":"a4","k":"move"},{"f":"a4","t":"b5","k":"atk"}],"tactics":"Attacks the pawn on b5"},{"san":"c5","fen":"..rq.rk..b.nbpppp...pn...pp.....P..P.B.......NP..P.NPPBPR.Q..RK.","from":"c7","to":"c5","note":"Black breaks at last, and only just in time.","num":"14...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"},{"san":"axb5","fen":"..rq.rk..b.nbpppp...pn...Pp........P.B.......NP..P.NPPBPR.Q..RK.","from":"a4","to":"b5","note":"White resolves the tension favourably.","num":"15.axb5","turn":"w","check":false,"arrows":[{"f":"a4","t":"b5","k":"move"},{"f":"b5","t":"a6","k":"atk"}],"tactics":"Attacks the pawn on a6"},{"san":"axb5","fen":"..rq.rk..b.nbppp....pn...pp........P.B.......NP..P.NPPBPR.Q..RK.","from":"a6","to":"b5","note":"Forced.","num":"15...axb5","turn":"b","check":false,"arrows":[{"f":"a6","t":"b5","k":"move"},{"f":"b5","t":"c4","k":"ctrl"}],"tactics":"Controls c4"},{"san":"Ra7","fen":"..rq.rk.Rb.nbppp....pn...pp........P.B.......NP..P.NPPBP..Q..RK.","from":"a1","to":"a7","note":"The rook invades on the seventh. The a-file opened because of a4, and now White's most passive piece is the most active on the board.","num":"16.Ra7","turn":"w","check":false,"arrows":[{"f":"a1","t":"a7","k":"move"},{"f":"a7","t":"b7","k":"atk"}],"tactics":"Attacks the bishop on b7 (undefended!)"},{"san":"Qb6","fen":"..r..rk.Rb.nbppp.q..pn...pp........P.B.......NP..P.NPPBP..Q..RK.","from":"d8","to":"b6","note":"Black defends and offers a queen trade.","num":"16...Qb6","turn":"b","check":false,"arrows":[{"f":"d8","t":"b6","k":"move"},{"f":"b6","t":"c5","k":"def"},{"f":"b6","t":"a7","k":"atk"},{"f":"b6","t":"b7","k":"def"},{"f":"b6","t":"d6","k":"ctrl"}],"tactics":"Attacks the rook on a7 (undefended!); defends the pawn on c5 and the bishop on b7; controls d6"},{"san":"Nb3","fen":"..r..rk.Rb.nbppp.q..pn...pp........P.B...N...NP..P..PPBP..Q..RK.","from":"d2","to":"b3","note":"The knight comes to b3, hitting c5 and eyeing a5 \u2014 a third piece joining the queenside pressure. White is not winning here, and probably never will be by force. But Black has to be accurate for another thirty moves, and White does not. That asymmetry is the Catalan's entire value.","num":"17.Nb3","turn":"w","check":false,"arrows":[{"f":"d2","t":"b3","k":"move"},{"f":"b3","t":"d4","k":"def"},{"f":"b3","t":"c5","k":"atk"}],"tactics":"Attacks the pawn on c5; defends the pawn on d4"}]}],"progression":{"arc":"The Catalan is a long game. You accept a tiny edge on move ten and you are still pressing on move sixty. It rewards patience more than any other opening.","stages":[{"tier":"Foundation","when":"Weeks one to three","goal":"Get the setup right and know how to recover the c4-pawn.","learn":["The setup: d4, c4, g3, Bg2, Nf3, O-O. The order matters mostly for avoiding the Nimzo-Indian.","The two pawn-recovery methods after ...dxc4: Qa4+/Qc2\u2013xc4, and Ne5 hitting c6 and c4 at once.","Why Bd2 rather than Nc3 against ...Bb4+ \u2014 the knight would block your own c-file pressure."],"drill":"Play ten games where Black takes on c4 and hold yourself to recovering it within six moves.","mistake":"Chasing the pawn immediately with a4 and Na3. Development and the bishop's diagonal are worth more than the pawn for several moves.","ready":"You are comfortable being a pawn down for five or six moves."},{"tier":"Structure","when":"Months one to two","goal":"Understand what the g2-bishop is actually doing.","learn":["The long diagonal a8\u2013h1 and the three squares that matter on it: d5, c6, b7.","Open Catalan (Black takes on c4) versus Closed (Black holds with ...c6) \u2014 completely different games.","Why ...c6 is annoying: it blocks the diagonal with a pawn, so your answer is the e4 break."],"drill":"Set up the Closed Catalan and play only for the e4 break. Ten games. Notice how much better your position is once it lands.","mistake":"Letting the g2-bishop stay blocked. If you cannot play e4 or a4, you have no advantage at all.","ready":"You can look at a Catalan and say in one sentence what your bishop is doing."},{"tier":"Plans","when":"Months two to six","goal":"Learn the squeeze.","learn":["a4 against the b5-pawn \u2014 undermining the base of Black's queenside chain is the standard method.","Ne5 and Nd2\u2013c4 or Nd2\u2013b3, piling onto c5, c6 and a5.","The queen trade. The Catalan bishop is stronger in the endgame than the middlegame \u2014 trading queens is often an improvement."],"drill":"Take twenty Catalan games by Kramnik and note the move on which he trades queens. It is almost never a concession.","mistake":"Looking for a kingside attack. The Catalan wins on the queenside and in the endgame.","ready":"You have converted a Catalan endgame where your only advantage was the bishop."},{"tier":"Mastery","when":"Ongoing","goal":"Handle everything Black tries to avoid it.","learn":["The ...c5 lines that steer into a fianchetto Benoni \u2014 a different but equally good game for White.","The Bogo-Indian (...Bb4+) and Queen's Indian (...b6) move orders.","Open Catalan theory with ...a6 and ...b5 \u2014 this is the main line and it is genuinely deep."],"drill":"Prepare a line against 3...c5 and 3...Bb4+ before you play the Catalan in a serious game.","mistake":"Playing g3 too early and allowing a favourable Nimzo-Indian move order. Know why you chose 3.g3 over 3.Nf3.","ready":"Every Black third move has a prepared answer."}],"study":"Vladimir Kramnik made the Catalan a world-championship weapon; Ding Liren, Anish Giri and Fabiano Caruana all use it as a main line today.","next":"Pair it with the Queen's Gambit Exchange. Between them you can steer almost any 1.d4 game into a structure you understand better than your opponent."}},{"id":"sicilian","name":"Sicilian Defence","eco":"B20\u2013B99","section":"black-e4","orientation":"black","tagline":"The most popular and most successful answer to 1.e4. Black plays to win, not to equalise.","level":"Intermediate \u2192 World Championship","theory":{"big_idea":"1...c5 refuses symmetry from move one. Black trades a flank pawn (c) for a central pawn (d) and gets, in return: a half-open c-file pointing straight at c2 and White's king if it castles queenside, and a 2-to-1 central pawn majority. The cost is that White gets a lead in development and space, and usually gets to attack first. Every Sicilian is a race \u2014 White attacks the kingside, Black attacks the queenside, and whoever is faster wins.","structure":"After ...cxd4 the defining structure is the 'Sicilian small centre': Black pawns on d6 and e6/e5 against White's e4. The half-open c-file is Black's motorway. In the Najdorf and Dragon, White typically castles long and storms the kingside with f3, g4, h4; Black storms the queenside with ...b5, ...b4, ...a5 and sacrifices on c3.","white_plans":["English Attack: Be3, f3, Qd2, O-O-O, then g4 and h4 with a direct pawn storm.","Yugoslav Attack against the Dragon: Bc4, B\u04353, Qd2, O-O-O, h4\u2013h5 and Bh6 trading the fianchetto bishop.","The positional bind: c4 and Be2 (Maroczy Bind), taking away ...b5 and ...d5 and squeezing Black to death.","The classical setup with Be2, O-O, f4 and a central e5 break."],"black_plans":["Queenside expansion with ...a6, ...b5, ...b4 hitting the c3-knight, plus ...Rc8 and the exchange sacrifice ...Rxc3!","Fight for the d5 square \u2014 the whole Najdorf is about whether Black gets in ...d5 in one move.","The Dragon bishop on g7 pointing down the long diagonal at b2 and White's queenside king.","Trade off White's dangerous attackers with ...Nxd4 or ...Ne5\u2013c4."],"traps":["Beware the Siberian Trap in the Smith-Morra: after ...Qc7 and ...Nf6, if White plays Nd5?? then ...Nxe4! wins.","In the Najdorf Poisoned Pawn (6.Bg5 e6 7.f4 Qb6 8.Qd2 Qxb2), Black's queen goes on a raid \u2014 this is one of the most analysed positions in chess. Do not enter it unprepared.","Black must never delay too long: many Sicilians are lost to a quick Nd5 or Nf5 sacrifice ripping open the centre before Black castles."],"who":"Play this if you want winning chances with Black and you do not mind sharp, theory-heavy positions. Fischer, Kasparov, Anand and Carlsen all built careers on it."},"lines":[{"name":"Najdorf \u2014 English Attack","note":"The most famous opening variation in chess, in its most popular modern form. Sharp, opposite-side castling, mutual attacks.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"c5","fen":"rnbqkbnrpp.ppppp..........p.........P...........PPPP.PPPRNBQKBNR","from":"c7","to":"c5","note":"The Sicilian. Black declines symmetry and instead trades a wing pawn for a centre pawn later on. Unbalanced from move one, which is exactly the point.","num":"1...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"Nf3","fen":"rnbqkbnrpp.ppppp..........p.........P........N..PPPP.PPPRNBQKB.R","from":"g1","to":"f3","note":"The Open Sicilian move order. White prepares d4.","num":"2.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"ctrl"},{"f":"f3","t":"d4","k":"ctrl"}],"tactics":"Controls e5 and d4"},{"san":"d6","fen":"rnbqkbnrpp..pppp...p......p.........P........N..PPPP.PPPRNBQKB.R","from":"d7","to":"d6","note":"Supporting a later ...e5 and controlling e5 now. The Najdorf, Dragon and Classical all start here.","num":"2...d6","turn":"b","check":false,"arrows":[{"f":"d7","t":"d6","k":"move"},{"f":"d6","t":"e5","k":"ctrl"}],"tactics":"Controls e5"},{"san":"d4","fen":"rnbqkbnrpp..pppp...p......p........PP........N..PPP..PPPRNBQKB.R","from":"d2","to":"d4","note":"White opens the centre while ahead in development.","num":"3.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"c5","k":"atk"},{"f":"d4","t":"e5","k":"ctrl"}],"tactics":"Attacks the pawn on c5; controls e5"},{"san":"cxd4","fen":"rnbqkbnrpp..pppp...p...............pP........N..PPP..PPPRNBQKB.R","from":"c5","to":"d4","note":"The Sicilian bargain. Black trades a wing pawn for a centre pawn and gets the half-open c-file.","num":"3...cxd4","turn":"b","check":false,"arrows":[{"f":"c5","t":"d4","k":"move"},{"f":"d4","t":"e3","k":"ctrl"}],"tactics":"Controls e3"},{"san":"Nxd4","fen":"rnbqkbnrpp..pppp...p...............NP...........PPP..PPPRNBQKB.R","from":"f3","to":"d4","note":"The knight sits proudly in the centre \u2014 but it is also the piece Black will attack all game.","num":"4.Nxd4","turn":"w","check":false,"arrows":[{"f":"f3","t":"d4","k":"move"},{"f":"d4","t":"f5","k":"ctrl"},{"f":"d4","t":"e6","k":"ctrl"}],"tactics":"Controls f5 and e6"},{"san":"Nf6","fen":"rnbqkb.rpp..pppp...p.n.............NP...........PPP..PPPRNBQKB.R","from":"g8","to":"f6","note":"Hitting e4 and forcing White to defend it.","num":"4...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"e4","k":"atk"},{"f":"f6","t":"d5","k":"ctrl"}],"tactics":"Attacks the pawn on e4 (undefended!); controls d5"},{"san":"Nc3","fen":"rnbqkb.rpp..pppp...p.n.............NP.....N.....PPP..PPPR.BQKB.R","from":"b1","to":"c3","note":"Defending e4 and eyeing d5 \u2014 the critical square in every Sicilian.","num":"5.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"e4","k":"def"},{"f":"c3","t":"d5","k ","t":"d4","k":"move"},{"f":"d4","t":"f5","k":"def"},{"f":"d4","t":"e6","k":"atk"}],"tactics":"Attacks the bishop on e6; defends the pawn on f5"}]}],"progression":{"arc":"The Sicilian is the biggest body of theory in chess. The way through it is to learn one variation properly rather than six badly.","stages":[{"tier":"Foundation","when":"Weeks one to three","goal":"Choose one Sicilian and understand the trade you are making.","learn":["The core bargain: you give up a wing pawn for a centre pawn and receive the half-open c-file. Everything else follows from that.","Pick one: Najdorf (sharpest, most theory), Accelerated Dragon (solid, less theory), Sveshnikov (unbalanced, forcing), Kan/Taimanov (flexible, low theory).","The Anti-Sicilians you will actually face more than the Open: 2.Nc3, 2.c3 (Alapin), 3.Bb5 (Rossolimo/Moscow) and the Smith-Morra."],"drill":"Prepare your Anti-Sicilian answers first. Below master level you will meet 2.c3 and 3.Bb5 more often than the Open Sicilian.","mistake":"Learning twenty moves of the Najdorf and nothing against 2.c3. You will lose to the Alapin repeatedly and never reach your preparation.","ready":"You have one line against every White second and third move, written down."},{"tier":"Structure","when":"Months one to three","goal":"Learn your chosen structure's skeleton and the squares that decide it.","learn":["In the Najdorf: the d5 square. Every move in the opening is about whether Black achieves ...d5 in one move or not.","In the Dragon and Accelerated Dragon: the long diagonal and the g7-bishop. It is worth more than a rook in many positions.","In every Sicilian: the half-open c-file, the exchange sacrifice ...Rxc3, and the ...b5\u2013b4 lever."],"drill":"Play out your tabiya twenty times from move ten. Do not study new lines until the tabiya is second nature.","mistake":"Playing ...d5 because it is 'freeing' when it loses a pawn or a piece. Count the defenders every time.","ready":"You know the key square in your variation and can explain what happens if you never control it."},{"tier":"Plans","when":"Months three to nine","goal":"Win the race.","learn":["The counting principle in opposite-castling positions: count how many moves each attack needs. That number, not the evaluation, decides the game.","The standard sacrifices: ...Rxc3 (exchange), ...Nxe4 (opening lines), ...b4 and ...a5\u2013a4 (pure pawns).","When to defend instead: ...h5 stopping the g-pawn, ...Kb8 and ...Rc8 tucking away."],"drill":"Take ten opposite-castling Sicilians and, at move fifteen, count both attacks before looking at the result. Train the counting.","mistake":"Defending passively. In a race, one defensive move is one attacking move you did not make \u2014 defend only when the arithmetic demands it.","ready":"You can look at an English Attack position and say who is faster, with a reason."},{"tier":"Mastery","when":"Year two and beyond","goal":"Depth in your line, plus the endgames.","learn":["Your variation's deepest branches \u2014 in the Najdorf that means the Poisoned Pawn and the 6.Bg5 complex.","The Maroczy Bind and how to break it: ...b5 sacrifices, ...Nxd4 trades and the ...f5 break.","Sicilian endgames: the queenside majority Black often has, and why a good knight beats a bad bishop in these structures."],"drill":"Analyse five of your own losses in the Sicilian and classify them: lost the race, lost the structure, or lost to preparation. Fix the biggest category.","mistake":"Switching variations after a loss. Depth beats breadth in the Sicilian by an enormous margin.","ready":"You have a line you have played fifty times and still find new ideas in."}],"study":"Fischer and Kasparov for the Najdorf, Carlsen and Caruana for the modern Sveshnikov \u2014 their 2018 World Championship match is the best available course in it.","next":"Once one Sicilian is deep, add a second as a surprise weapon rather than starting over. The structures overlap more than the move orders suggest."}},{"id":"french","name":"French Defence","eco":"C00\u2013C19","section":"black-e4","orientation":"black","tagline":"A pawn chain, a bad bishop, and a devastating counterattack. Black chooses structure over freedom.","level":"Beginner \u2192 Grandmaster","theory":{"big_idea":"1...e6 prepares ...d5 with pawn support. Black accepts one real problem \u2014 the c8-bishop is locked behind the e6-pawn \u2014 in exchange for a rock-solid pawn chain and a very clear plan: attack the base of White's chain with ...c5 and ...f6. The French is the most 'plan-driven' opening in chess. You know from move three exactly what you are doing for the next twenty-five moves.","structure":"The classic French chain: White pawns d4\u2013e5, Black pawns d5\u2013e6. A pawn chain is attacked at its base, so Black plays ...c5 (hitting d4) and later ...f6 (hitting e5). White defends with c3 and f4 and tries to exploit the extra kingside space. Almost every French middlegame is about these two breaks.","white_plans":["Advance Variation (3.e5): grab space, defend d4 with c3 and Nf3, then attack on the kingside with Bd3, Ne2, h4 and Nf4.","Winawer (3.Nc3 Bb4 4.e5): accept doubled c-pawns for the bishop pair and a huge attack with Qg4 hitting g7.","Tarrasch (3.Nd2): avoid the pin, keep the structure clean and play for an isolated-queen's-pawn edge.","Exchange (3.exd5): a solid, symmetrical, drawish structure."],"black_plans":["Hit the base of the chain with ...c5, then ...Qb6 and ...Nc6 piling on d4.","Undermine the front of the chain with ...f6 once the queenside is secure.","Solve the bad bishop: ...b6 and ...Ba6, or ...Bd7\u2013b5, or ...Bd7\u2013e8\u2013h5.","In the Winawer, target White's doubled c-pawns and the dark squares with ...Qa5 and ...Ba6."],"traps":["In the Winawer Poisoned Pawn (6...Ne7 7.Qg4 Qc7 8.Qxg7 Rg8 9.Qxh7 cxd4), Black gives up two kingside pawns for a huge lead in development \u2014 one of the sharpest lines in all of chess.","Never play ...cxd4 too early in the Advance; keeping the tension is Black's main source of pressure.","The Milner-Barry Gambit (Advance, 6.Bd3 cxd4 7.cxd4 Bd7 8.O-O Nxd4 9.Nxd4 Qxd4 10.Nc3!) \u2014 Black must know how to defend the resulting attack."],"who":"Play this if you like clear structural plans, you do not mind a cramped position, and you want to punish White for over-extending. The French wins more games by counterattack than any other defence."},"lines":[{"name":"Advance Variation \u2014 Main Line","note":"White grabs space, Black attacks the base of the chain. The purest illustration of pawn-chain strategy in chess.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"e6","fen":"rnbqkbnrpppp.ppp....p...............P...........PPPP.PPPRNBQKBNR","from":"e7","to":"e6","note":"The French. Black prepares ...d5 with support, accepting that the c8-bishop will be temporarily locked in behind the pawn chain.","num":"1...e6","turn":"b","check":false,"arrows":[{"f":"e7","t":"e6","k":"move"},{"f":"e6","t":"d5","k":"ctrl"},{"f":"e6","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"d4","fen":"rnbqkbnrpppp.ppp....p..............PP...........PPP..PPPRNBQKBNR","from":"d2","to":"d4","note":"White takes the centre.","num":"2.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"d5","fen":"rnbqkbnrppp..ppp....p......p.......PP...........PPP..PPPRNBQKBNR","from":"d7","to":"d5","note":"Now Black challenges it with full pawn support \u2014 the point of 1...e6.","num":"2...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"atk"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Attacks the pawn on e4 (undefended!); controls c4"},{"san":"e5","fen":"rnbqkbnrppp..ppp....p......pP......P............PPP..PPPRNBQKBNR","from":"e4","to":"e5","note":"The Advance Variation. White grabs maximum space and locks the centre. Black's c8-bishop is now definitively the 'bad' bishop.","num":"3.e5","turn":"w","check":false,"arrows":[{"f":"e4","t":"e5","k":"move"},{"f":"e5","t":"d6","k":"ctrl"}],"tactics":"Controls d6"},{"san":"c5","fen":"rnbqkbnrpp...ppp....p.....ppP......P............PPP..PPPRNBQKBNR","from":"c7","to":"c5","note":"Immediately. A pawn chain is attacked at its base, and d4 is the base of White's chain.","num":"3...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"},{"san":"c3","fen":"rnbqkbnrpp...ppp....p.....ppP......P......P.....PP...PPPRNBQKBNR","from":"c2","to":"c3","note":"Defending d4 with the pawn. Now the whole game is a fight over this one square.","num":"4.c3","turn":"w","check":false,"arrows":[{"f":"c2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"def"}],"tactics":"Defends the pawn on d4"},{"san":"Nc6","fen":"r.bqkbnrpp...ppp..n.p.....ppP......P......P.....PP...PPPRNBQKBNR","from":"b8","to":"c6","note":"Adding a second attacker to d4.","num":"4...Nc6","turn":"b","check":false,"arrows":[{"f":"b8","t":"c6","k":"move"},{"f":"c6","t":"d4","k":"atk"},{"f":"c6","t":"e5","k":"atk"}],"tactics":"Attacks the pawn on d4 and the pawn on e5"},{"san":"Nf3","fen":"r.bqkbnrpp...ppp..n.p.....ppP......P......P..N..PP...PPPRNBQKB.R","from":"g1","to":"f3","note":"Adding a defender.","num":"5.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"d4","k":"def"},{"f":"f3","t":"e5","k":"def"}],"tactics":"Defends the pawn on d4 and the pawn on e5"},{"san":"Qb6","fen":"r.b.kbnrpp...ppp.qn.p.....ppP......P......P..N..PP...PPPRNBQKB.R","from":"d8","to":"b6","note":"The key French move. The queen hits d4 a third time \u2014 and also b2, since the b-pawn is now loose. White cannot defend d4 with the b1-knight (c3 is occupied) or the c1-bishop (b2 hangs).","num":"5...Qb6","turn":"b","check":false,"arrows":[{"f":"d8","t":"b6","k":"move"},{"f":"b6","t":"b2","k":"atk"},{"f":"b6","t":"c5","k":"def"}],"tactics":"Attacks the pawn on b2; defends the pawn on c5"},{"san":"a3","fen":"r.b.kbnrpp...ppp.qn.p.....ppP......P....P.P..N...P...PPPRNBQKB.R","from":"a2","to":"a3","note":"Preparing b4 to gain queenside space and shut Black's pieces out.","num":"6.a3","turn":"w","check":false,"arrows":[{"f":"a2","t":"a3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Nh6","fen":"r.b.kb.rpp...ppp.qn.p..n..ppP......P....P.P..N...P...PPPRNBQKB.R","from":"g8","to":"h6","note":"Note: not ...Nge7, because White would take. The knight goes to h6 heading for f5, where it hits d4 for a fourth time. Ugly-looking, absolutely correct.","num":"6...Nh6","turn":"b","check":false,"arrows":[{"f":"g8","t":"h6","k":"move"},{"f":"h6","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"b4","fen":"r.b.kb.rpp...ppp.qn.p..n..ppP....P.P....P.P..N.......PPPRNBQKB.R","from":"b2","to":"b4","note":"Grabbing queenside space and preparing Bb2.","num":"7.b4","turn":"w","check":false,"arrows":[{"f":"b2","t":"b4","k":"move"},{"f":"b4","t":"c5","k":"atk"}],"tactics":"Attacks the pawn on c5"},{"san":"cxd4","fen":"r.b.kb.rpp...ppp.qn.p..n...pP....P.p....P.P..N.......PPPRNBQKB.R","from":"c5","to":"d4","note":"Black releases the tension at the right moment.","num":"7...cxd4","turn":"b","check":false,"arrows":[{"f":"c5","t":"d4","k":"move"},{"f":"d4","t":"c3","k ...ppP......P......P.....PP...PPPRNBQKBNR","from":"b8","to":"c6","note":"Adding a second attacker to d4.","num":"4...Nc6","turn":"b","check":false,"arrows":[{"f":"b8","t":"c6","k":"move"},{"f":"c6","t":"d4","k":"atk"},{"f":"c6","t":"e5","k":"atk"}],"tactics":"Attacks the pawn on d4 and the pawn on e5"},{"san":"Nf3","fen":"r.bqkbnrpp...ppp..n.p.....ppP......P......P..N..PP...PPPRNBQKB.R","from":"g1","to":"f3","note":"Adding a defender.","num":"5.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"d4","k":"def"},{"f":"f3","t":"e5","k":"def"}],"tactics":"Defends the pawn on d4 and the pawn on e5"},{"san":"Qb6","fen":"r.b.kbnrpp...ppp.qn.p.....ppP......P......P..N..PP...PPPRNBQKB.R","from":"d8","to":"b6","note":"The key French move. The queen hits d4 a third time \u2014 and also b2, since the b-pawn is now loose. White cannot defend d4 with the b1-knight (c3 is occupied) or the c1-bishop (b2 hangs).","num":"5...Qb6","turn":"b","check":false,"arrows":[{"f":"d8","t":"b6","k":"move"},{"f":"b6","t":"b2","k":"atk"},{"f":"b6","t":"c5","k":"def"}],"tactics":"Attacks the pawn on b2; defends the pawn on c5"},{"san":"a3","fen":"r.b.kbnrpp...ppp.qn.p.....ppP......P....P.P..N...P...PPPRNBQKB.R","from":"a2","to":"a3","note":"Preparing b4 to gain queenside space and shut Black's pieces out.","num":"6.a3","turn":"w","check":false,"arrows":[{"f":"a2","t":"a3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Nh6","fen":"r.b.kb.rpp...ppp.qn.p..n..ppP......P....P.P..N...P...PPPRNBQKB.R","from":"g8","to":"h6","note":"Note: not ...Nge7, because White would take. The knight goes to h6 heading for f5, where it hits d4 for a fourth time. Ugly-looking, absolutely correct.","num":"6...Nh6","turn":"b","check":false,"arrows":[{"f":"g8","t":"h6","k":"move"},{"f":"h6","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"b4","fen":"r.b.kb.rpp...ppp.qn.p..n..ppP....P.P....P.P..N.......PPPRNBQKB.R","from":"b2","to":"b4","note":"Grabbing queenside space and preparing Bb2.","num":"7.b4","turn":"w","check":false,"arrows":[{"f":"b2","t":"b4","k":"move"},{"f":"b4","t":"c5","k":"atk"}],"tactics":"Attacks the pawn on c5"},{"san":"cxd4","fen":"r.b.kb.rpp...ppp.qn.p..n...pP....P.p....P.P..N.......PPPRNBQKB.R","from":"c5","to":"d4","note":"Black releases the tension at the right moment.","num":"7...cxd4","turn":"b","check":false,"arrows":[{"f":"c5","t":"d4","k":"move"},{"f":"d4","t":"c3","k":"atk"},{"f":"d4","t":"e3","k":"ctrl"}],"tactics":"Attacks the pawn on c3; controls e3"},{"san":"cxd4","fen":"r.b.kb.rpp...ppp.qn.p..n...pP....P.P....P....N.......PPPRNBQKB.R","from":"c3","to":"d4","note":"Recapturing.","num":"8.cxd4","turn":"w","check":false,"arrows":[{"f":"c3","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"def"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls c5"},{"san":"Nf5","fen":"r.b.kb.rpp...ppp.qn.p......pPn...P.P....P....N.......PPPRNBQKB.R","from":"h6","to":"f5","note":"The knight lands on f5. It attacks d4, cannot easily be kicked, and Black's pressure on the base of the chain is now maximal.","num":"8...Nf5","turn":"b","check":false,"arrows":[{"f":"h6","t":"f5","k":"move"},{"f":"f5","t":"d4","k":"atk"},{"f":"f5","t":"d6","k":"ctrl"},{"f":"f5","t":"e3","k":"ctrl"}],"tactics":"Attacks the pawn on d4; controls d6 and e3"},{"san":"Bb2","fen":"r.b.kb.rpp...ppp.qn.p......pPn...P.P....P....N...B...PPPRN.QKB.R","from":"c1","to":"b2","note":"The bishop finally develops, defending d4 from behind.","num":"9.Bb2","turn":"w","check":false,"arrows":[{"f":"c1","t":"b2","k":"move"},{"f":"b2","t":"d4","k":"def"}],"tactics":"Defends the pawn on d4"},{"san":"Bd7","fen":"r...kb.rpp.b.ppp.qn.p......pPn...P.P....P....N...B...PPPRN.QKB.R","from":"c8","to":"d7","note":"Black develops the bad bishop toward b5 or a4 where it will actually be useful.","num":"9...Bd7","turn":"b","check":false,"arrows":[{"f":"c8","t":"d7","k":"move"}],"tactics":"develops a piece toward the centre"},{"san":"g4","fen":"r...kb.rpp.b.ppp.qn.p......pPn...P.P..P.P....N...B...P.PRN.QKB.R","from":"g2","to":"g4","note":"White must kick the f5-knight, but this weakens the kingside permanently. Both sides have real chances \u2014 Black on the queenside and against d4, White with space and a kingside attack.","num":"10.g4","turn":"w","check":false,"arrows":[{"f":"g2","t":"g4","k":"move"},{"f":"g4","t":"f5","k":"atk"}],"tactics":"Attacks the knight on f5"},{"san":"Nfe7","fen":"r...kb.rpp.bnppp.qn.p......pP....P.P..P.P....N...B...P.PRN.QKB.R","from":"f5","to":"e7","note":"The knight steps back rather than be captured. It is heading for g6, where it will hit h4 and e5 and help defend the kingside.","num":"10...Nfe7","turn":"b","check":false,"arrows":[{"f":"f5","t":"e7","k":"move"},{"f":"e7","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"Nc3","fen":"r...kb.rpp.bnppp.qn.p......pP....P.P..P.P.N..N...B...P.PR..QKB.R","from":"b1","to":"c3","note":"White finally develops the queen's knight, aiming at b5 and a4.","num":"11.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"atk"},{"f":"c3","t":"e4","k":"ctrl"}],"tactics":"Attacks the pawn on d5; controls e4"},{"san":"Ng6","fen":"r...kb.rpp.b.ppp.qn.p.n....pP....P.P..P.P.N..N...B...P.PR..QKB.R","from":"e7","to":"g6","note":"The knight arrives. It attacks e5 and h4 and blocks White's g-pawn from advancing further.","num":"11...Ng6","turn":"b","check":false,"arrows":[{"f":"e7","t":"g6","k":"move"},{"f":"g6","t":"e5","k":"atk"},{"f":"g6","t":"f4","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls f4"},{"san":"h4","fen":"r...kb.rpp.b.ppp.qn.p.n....pP....P.P..PPP.N..N...B...P..R..QKB.R","from":"h2","to":"h4","note":"White pushes on. The kingside pawns are committed now, which means White's king will not be going there.","num":"12.h4","turn":"w","check":false,"arrows":[{"f":"h2","t":"h4","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"h5","fen":"r...kb.rpp.b.pp..qn.p.n....pP..p.P.P..PPP.N..N...B...P..R..QKB.R","from":"h7","to":"h5","note":"The correct answer to a pawn storm: stop it with a pawn of your own. Now g5 is the only advance available.","num":"12...h5","turn":"b","check":false,"arrows":[{"f":"h7","t":"h5","k":"move"},{"f":"h5","t":"g4","k":"atk"}],"tactics":"Attacks the pawn on g4 (undefended!)"},{"san":"g5","fen":"r...kb.rpp.b.pp..qn.p.n....pP.Pp.P.P...PP.N..N...B...P..R..QKB.R","from":"g4","to":"g5","note":"White plays it anyway, gaining space and locking the kingside.","num":"13.g5","turn":"w","check":false,"arrows":[{"f":"g4","t":"g5","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Be7","fen":"r...k..rpp.bbpp..qn.p.n....pP.Pp.P.P...PP.N..N...B...P..R..QKB.R","from":"f8","to":"e7","note":"Development, and the bishop is ready to castle behind.","num":"13...Be7","turn":"b","check":false,"arrows":[{"f":"f8","t":"e7","k":"move"},{"f":"e7","t":"b4","k":"atk"},{"f":"e7","t":"g5","k":"atk"},{"f":"e7","t":"c5","k":"ctrl"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on b4 and the pawn on g5; controls c5 and d6"},{"san":"Bd3","fen":"r...k..rpp.bbpp..qn.p.n....pP.Pp.P.P...PP.NB.N...B...P..R..QK..R","from":"f1","to":"d3","note":"White develops the bishop to its natural diagonal.","num":"14.Bd3","turn":"w","check":false,"arrows":[{"f":"f1","t":"d3","k":"move"},{"f":"d3","t":"g6","k":"atk"},{"f":"d3","t":"e4","k":"ctrl"},{"f":"d3","t":"f5","k":"ctrl"}],"tactics":"Attacks the knight on g6; controls e4 and f5"},{"san":"O-O-O","fen":"..kr...rpp.bbpp..qn.p.n....pP.Pp.P.P...PP.NB.N...B...P..R..QK..R","from":"e8","to":"c8","note":"Black castles queenside \u2014 into the side of the board where White has no attack, and next to the c-file Black is about to use.","num":"14...O-O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"c8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Na4","fen":"..kr...rpp.bbpp..qn.p.n....pP.PpNP.P...PP..B.N...B...P..R..QK..R","from":"c3","to":"a4","note":"White hits the queen and heads for c5, a strong outpost.","num":"15.Na4","turn":"w","check":false,"arrows":[{"f":"c3","t":"a4","k":"move"},{"f":"a4","t":"b6","k":"atk"},{"f":"a4","t":"c5","k":"ctrl"}],"tactics":"Attacks the queen on b6; controls c5"},{"san":"Qc7","fen":"..kr...rppqbbpp...n.p.n....pP.PpNP.P...PP..B.N...B...P..R..QK..R","from":"b6","to":"c7","note":"The queen steps to the file it wants to fight on.","num":"15...Qc7","turn":"b","check":false,"arrows":[{"f":"b6","t":"c7","k":"move"},{"f":"c7","t":"e5","k":"atk"},{"f":"c7","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls d6"},{"san":"Rc1","fen":"..kr...rppqbbpp...n.p.n....pP.PpNP.P...PP..B.N...B...P....RQK..R","from":"a1","to":"c1","note":"Both sides contest the c-file. Note the shape of the game: White's pawns are on the kingside where nobody lives, Black's pieces are on the queenside where White's king will eventually have to go.","num":"16.Rc1","turn":"w","check":false,"arrows":[{"f":"a1","t":"c1","k":"move"},{"f":"c1","t":"c6","k":"atk"},{"f":"c1","t":"c5","k":"ctrl"},{"f":"c1","t":"c4","k":"ctrl"}],"tactics":"Attacks the knight on c6; controls c5 and c4"},{"san":"Kb8","fen":".k.r...rppqbbpp...n.p.n....pP.PpNP.P...PP..B.N...B...P....RQK..R","from":"c8","to":"b8","note":"Tucking the king safely away and preparing ...Rc8.","num":"16...Kb8","turn":"b","check":false,"arrows":[{"f":"c8","t":"b8","k":"move"}],"tactics":"a repositioning move"},{"san":"Qd2","fen":".k.r...rppqbbpp...n.p.n....pP.PpNP.P...PP..B.N...B.Q.P....R.K..R","from":"d1","to":"d2","note":"White connects and prepares to castle long or push in the centre. A rich, unbalanced position \u2014 and a perfect illustration of the French bargain: Black's position looked passive for eight moves and is now the one with a clear plan.","num":"17.Qd2","turn":"w","check":false,"arrows":[{"f":"d1","t":"d2","k":"move"},{"f":"d2","t":"b4","k":"def"},{"f":"d2","t":"g5","k":"def"},{"f":"d2","t":"f4","k":"ctrl"},{"f":"d2","t":"e3","k":"ctrl"}],"tactics":"Defends the pawn on b4 and the pawn on g5; controls f4 and e3"}]}],"progression":{"arc":"The French teaches you pawn chains better than any other opening, and pawn chains are the skeleton of positional chess.","stages":[{"tier":"Foundation","when":"Week one","goal":"Accept the bad bishop and learn the one universal plan.","learn":["The plan in every French: hit the base of White's chain with ...c5, then the front with ...f6. That is the whole opening.","The four things White can do on move three: 3.e5 (Advance), 3.Nc3 (Classical/Winawer), 3.Nd2 (Tarrasch), 3.exd5 (Exchange).","Why ...Qb6 is the key move in the Advance \u2014 it hits d4 a third time and b2 at the same time."],"drill":"Play the Advance from the Black side twenty times, aiming only for ...c5, ...Nc6, ...Qb6 and pressure on d4.","mistake":"Trading on d4 too early. The tension on d4 is your entire source of pressure; releasing it hands White a free hand.","ready":"You can explain, without a board, why ...c5 comes before ...Nf6."},{"tier":"Structure","when":"Weeks two to six","goal":"Solve the light-squared bishop, permanently.","learn":["Route 1: ...b6 and ...Ba6, trading it for White's good bishop.","Route 2: ...Bd7\u2013b5 or ...Bd7\u2013a4, using the queenside.","Route 3: ...Bd7\u2013e8\u2013h5, the slow route to the kingside.","Route 4: leave it and play with pieces on the dark squares instead \u2014 sometimes correct."],"drill":"In your next ten French games, write down on move ten which route you have chosen. If you cannot name one, that is the problem.","mistake":"Playing ...Nf6 and ...Be7 and hoping the bishop sorts itself out. It never does.","ready":"You choose the bishop's route by move ten, deliberately."},{"tier":"Plans","when":"Months two to five","goal":"Counterattack rather than defend.","learn":["The ...f6 break: when it opens the f-file for you and when it just weakens e6.","Queenside play with ...a5, ...Rc8, ...Na5\u2013c4 and the pressure on c3 or c2.","Meeting White's kingside attack: ...h6 and ...g6 are usually wrong; counterattack in the centre instead."],"drill":"Study ten games where Black wins with ...f6 and ten where ...f6 backfires. Write down the difference.","mistake":"Sitting still. The French is cramped, and a cramped position that never breaks out simply loses slowly.","ready":"You have won a game where White attacked the kingside and you won on the other wing."},{"tier":"Mastery","when":"Ongoing","goal":"Handle the sharp lines and the endgames.","learn":["The Winawer with its doubled c-pawns and the Poisoned Pawn \u2014 Black's most ambitious try.","The Tarrasch and the isolated-pawn positions it produces; you need to know both sides of an IQP.","French endgames: the bad bishop is a real long-term problem, so learn which trades help you."],"drill":"Learn the Winawer Poisoned Pawn to move fifteen from both sides, even if you never play it. The patterns appear everywhere.","mistake":"Fearing the Exchange Variation. It looks drawish; play ...Nf6, ...Bd6, ...O-O and ...c6 and play for a win with the extra tempo pattern.","ready":"You are comfortable against all four of White's third moves."}],"study":"Mikhail Botvinnik and Viktor Korchnoi built the modern French. For sharp modern play, look at Alexander Morozevich and Wesley So.","next":"The French and Caro-Kann share almost every idea. Learning the Caro-Kann second is fast and gives you a second answer to 1.e4."}},{"id":"carokann","name":"Caro-Kann Defence","eco":"B10\u2013B19","section":"black-e4","orientation":"black","tagline":"Everything the French does, but without the bad bishop. The most structurally sound reply to 1.e4.","level":"Beginner \u2192 World Championship","theory":{"big_idea":"1...c6 prepares ...d5 with pawn support, exactly like the French \u2014 but with a crucial difference: the c8-bishop gets out to f5 or g4 before the ...e6 pawn locks it in. Black gets a French position with the French's main problem already solved. The price is a tempo (the c-pawn takes two moves to reach c5) and a slightly passive position. The Caro-Kann is the choice of players who want to reach a good endgame with a healthy structure.","structure":"After the Classical (3.Nc3 dxe4 4.Nxe4), Black has pawns on c6, e6 and a solid, symmetrical, weakness-free structure. Black is slightly cramped but has literally nothing to attack. In the Advance Variation the position becomes French-like but with the bishop already outside. In the Panov-Botvinnik, White gets an isolated queen's pawn and a sharp attacking game.","white_plans":["Classical (3.Nc3): trade on e4, chase the bishop with h4\u2013h5, castle queenside and attack.","Advance (3.e5): grab space and harass the f5-bishop with Nf3, Be2 and h4/Nh4.","Panov-Botvinnik (3.exd5 cxd5 4.c4): open the game, take an isolated d-pawn and play for a kingside attack.","Exchange (3.exd5 cxd5 4.Bd3): quiet, symmetrical, with a slow minority attack."],"black_plans":["Develop the light-squared bishop outside the chain first, then play ...e6 \u2014 the whole point of the opening.","Trade off pieces and head for an endgame where the healthy structure counts.","Break with ...c5 (in the Advance) or ...e5 (in the Classical) once development is complete.","Meet a kingside attack by castling queenside or leaving the king in the centre in closed positions."],"traps":["Never play 3.Nc3 dxe4 4.Nxe4 Nd7 5.Qe2 Ngf6?? 6.Nd6# \u2014 the smothered mate every Caro-Kann player must know.","In the Advance, ...Bf5 4.h4!? h5 5.Bd3 is a genuine try \u2014 Black must know to take with ...Bxd3.","After 4...Bf5 5.Ng3 Bg6 6.h4 h6 7.Nf3, do not forget 7...e6! \u2014 7...Nf6? 8.Ne5 is very unpleasant."],"who":"Play this if you want a solid, low-risk defence to 1.e4 that still gives real winning chances in the endgame. Karpov, Anand and Carlsen have all used it as a main weapon."},"lines":[{"name":"Classical Variation \u2014 Main Line","note":"The historical main line. Black develops the bishop outside the pawn chain, then builds a fortress.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"c6","fen":"rnbqkbnrpp.ppppp..p.................P...........PPPP.PPPRNBQKBNR","from":"c7","to":"c6","note":"The Caro-Kann. Same idea as the French \u2014 prepare ...d5 \u2014 but with the c-pawn, so the light-squared bishop keeps its freedom.","num":"1...c6","turn":"b","check":false,"arrows":[{"f":"c7","t":"c6","k":"move"},{"f":"c6","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"d4","fen":"rnbqkbnrpp.ppppp..p................PP...........PPP..PPPRNBQKBNR","from":"d2","to":"d4","note":"White takes the full centre.","num":"2.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"d5","fen":"rnbqkbnrpp..pppp..p........p.......PP...........PPP..PPPRNBQKBNR","from":"d7","to":"d5","note":"Black challenges with support \u2014 exactly as in the French, but the c8-bishop is still free.","num":"2...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"atk"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Attacks the pawn on e4 (undefended!); controls c4"},{"san":"Nc3","fen":"rnbqkbnrpp..pppp..p........p.......PP.....N.....PPP..PPPR.BQKBNR" fends the knight on d7; controls d5 and e4"},{"san":"Bd2","fen":"r..qkb.rpp.n.pp...p.pn.p....N......P.P.P...Q..N.PPPB..P.R...K..R","from":"c1","to":"d2","note":"Development, preparing to castle queenside.","num":"12.Bd2","turn":"w","check":false,"arrows":[{"f":"c1","t":"d2","k":"move"},{"f":"d2","t":"e3","k":"ctrl"}],"tactics":"Controls e3"},{"san":"Qc7","fen":"r...kb.rppqn.pp...p.pn.p....N......P.P.P...Q..N.PPPB..P.R...K..R","from":"d8","to":"c7","note":"The queen takes the c-file post, eyeing c2 and supporting the coming ...c5.","num":"12...Qc7","turn":"b","check":false,"arrows":[{"f":"d8","t":"c7","k":"move"},{"f":"c7","t":"e5","k":"atk"},{"f":"c7","t":"c6","k":"def"},{"f":"c7","t":"d7","k":"def"},{"f":"c7","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on e5; defends the pawn on c6 and the knight on d7; controls d6"},{"san":"O-O-O","fen":"r...kb.rppqn.pp...p.pn.p....N......P.P.P...Q..N.PPPB..P...KR...R","from":"e1","to":"c1","note":"White castles long, which commits the king to the wing Black's queen already aims at.","num":"13.O-O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"c1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"O-O-O","fen":"..kr.b.rppqn.pp...p.pn.p....N......P.P.P...Q..N.PPPB..P...KR...R","from":"e8","to":"c8","note":"Black castles long too. Same-side castling means no pawn storms and a slow, technical game \u2014 exactly what a Caro-Kann player wants.","num":"13...O-O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"c8","k":"move"},{"f":"c8","t":"d7","k":"def"}],"tactics":"Defends the knight on d7"},{"san":"Kb1","fen":"..kr.b.rppqn.pp...p.pn.p....N......P.P.P...Q..N.PPPB..P..K.R...R","from":"c1","to":"b1","note":"A useful prophylactic move, taking the king off the c-file and out of any ...Nb6\u2013c4 tricks.","num":"14.Kb1","turn":"w","check":false,"arrows":[{"f":"c1","t":"b1","k":"move"}],"tactics":"a repositioning move"},{"san":"c5","fen":"..kr.b.rppqn.pp.....pn.p..p.N......P.P.P...Q..N.PPPB..P..K.R...R","from":"c6","to":"c5","note":"The break. This is the move Black has been building toward for twenty-seven moves. It challenges d4 and opens the c-file behind White's king.","num":"14...c5","turn":"b","check":false,"arrows":[{"f":"c6","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"},{"san":"Nxd7","fen":"..kr.b.rppqN.pp.....pn.p..p........P.P.P...Q..N.PPPB..P..K.R...R","from":"e5","to":"d7","note":"White trades off the strong e5-knight before it gets kicked.","num":"15.Nxd7","turn":"w","check":false,"arrows":[{"f":"e5","t":"d7","k":"move"},{"f":"d7","t":"c5","k":"atk"},{"f":"d7","t":"f6","k":"atk"},{"f":"d7","t":"f8","k":"atk"},{"f":"d7","t":"e5","k":"ctrl"}],"tactics":"Attacks the pawn on c5, the knight on f6, and the bishop on f8; controls e5"},{"san":"Rxd7","fen":"..k..b.rppqr.pp.....pn.p..p........P.P.P...Q..N.PPPB..P..K.R...R","from":"d8","to":"d7","note":"Black recaptures with the rook, which lands on the file it wants.","num":"15...Rxd7","turn":"b","check":false,"arrows":[{"f":"d8","t":"d7","k":"move"},{"f":"d7","t":"d4","k":"atk"},{"f":"d7","t":"d5","k":"ctrl"},{"f":"d7","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on d4; controls d5 and d6"},{"san":"dxc5","fen":"..k..b.rppqr.pp.....pn.p..P..........P.P...Q..N.PPPB..P..K.R...R","from":"d4","to":"c5","note":"White resolves the centre.","num":"16.dxc5","turn":"w","check":false,"arrows":[{"f":"d4","t":"c5","k":"move"},{"f":"c5","t":"d6","k":"ctrl"}],"tactics":"Controls d6"},{"san":"Bxc5","fen":"..k....rppqr.pp.....pn.p..b..........P.P...Q..N.PPPB..P..K.R...R","from":"f8","to":"c5","note":"Black recaptures with the bishop, which now stares at the a7\u2013g1 diagonal and at f2.","num":"16...Bxc5","turn":"b","check":false,"arrows":[{"f":"f8","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"ctrl"},{"f":"c5","t":"d6","k":"ctrl"}],"tactics":"Controls d4 and d6"},{"san":"Ne4","fen":"..k....rppqr.pp.....pn.p..b.........NP.P...Q....PPPB..P..K.R...R","from":"g3","to":"e4","note":"Trading again.","num":"17.Ne4","turn":"w","check":false,"arrows":[{"f":"g3","t":"e4","k":"move"},{"f":"e4","t":"c5","k":"atk"},{"f":"e4","t":"f6","k":"atk"},{"f":"e4","t":"d6","k":"ctrl"}],"tactics":"Attacks the bishop on c5 and the knight on f6; controls d6"},{"san":"Nxe4","fen":"..k....rppqr.pp.....p..p..b.........nP.P...Q....PPPB..P..K.R...R","from":"f6","to":"e4","note":"And again. Every trade suits Black, because Black has no weaknesses and White's extra kingside space becomes meaningless without pieces.","num":"17...Nxe4","turn":"b","check":false,"arrows":[{"f":"f6","t":"e4","k":"move"},{"f":"e4","t":"d2","k":"atk"},{"f":"e4","t":"d6","k":"ctrl"}],"tactics":"Attacks the bishop on d2; controls d6"},{"san":"Qxe4","fen":"..k....rppqr.pp.....p..p..b.........QP.P........PPPB..P..K.R...R","from":"d3","to":"e4","note":"White recaptures. Material is level, structures are healthy, queens are still on \u2014 but look at the pawns. White has pawns on a2, b2, c2, f4, g2, h4; Black has a7, b7, e6, f7, g7, h6. Neither side has a weakness, and Black has a completely comfortable game. That is the Caro-Kann's promise, delivered.","num":"18.Qxe4","turn":"w","check":false,"arrows":[{"f":"d3","t":"e4","k":"move"},{"f":"e4","t":"f4","k":"def"},{"f":"e4","t":"e6","k":"atk"},{"f":"e4","t":"b7","k":"atk"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"e5","k":"ctrl"}],"tactics":"Attacks the pawn on e6 and the pawn on b7; defends the pawn on f4; controls d5 and e5"}]}],"progression":{"arc":"The Caro-Kann is the French with the main problem removed. It costs you a tempo and buys you a lifetime of healthy positions.","stages":[{"tier":"Foundation","when":"Week one","goal":"Learn the one rule that defines the whole opening.","learn":["The rule: develop the light-squared bishop before playing ...e6. Break it and you have a worse French.","White's four options: 3.Nc3/3.Nd2 (Classical), 3.e5 (Advance), 3.exd5 (Exchange/Panov), 2.c4 (Accelerated Panov).","The mate you must know: 1.e4 c6 2.d4 d5 3.Nc3 dxe4 4.Nxe4 Nd7 5.Qe2 Ngf6?? 6.Nd6#."],"drill":"Play the Classical twenty times, focusing only on getting ...Bf5, ...e6, ...Nd7 and ...Ngf6 in the right order.","mistake":"Playing ...Bf5 when White can hit it with Qb3 or Nh4 favourably. Check the tactics before every bishop move.","ready":"You never lock the bishop in behind ...e6."},{"tier":"Structure","when":"Weeks two to six","goal":"Learn to be slightly worse and completely safe.","learn":["In the Classical, Black has no weaknesses at all \u2014 the plan is to trade pieces and reach an equal endgame.","In the Advance, the plan is the same as the French: ...c5 at the base of the chain, but with your bishop already out.","In the Panov, you face an isolated queen's pawn \u2014 the most important structure in chess after the Carlsbad."],"drill":"Play the Classical to move twenty and stop. Count your weaknesses. If the answer is zero, you played it correctly.","mistake":"Trying to equalise with an early ...c5 in the Classical. Complete development first; the break comes later.","ready":"You can explain why Black's structure has no weaknesses and why that is worth being cramped."},{"tier":"Plans","when":"Months two to five","goal":"Play for a win, not just a draw.","learn":["Castling queenside in the Classical when White commits to a kingside storm \u2014 the game becomes a race you are well placed for.","The ...c5 and ...e5 breaks and how to prepare them properly.","How to play against the isolated queen's pawn: blockade on d5, trade minor pieces, win the pawn in the endgame."],"drill":"Study ten IQP games from the blockading side. This one structure appears in the Panov, the Tarrasch French, the Nimzo and the QGA.","mistake":"Playing for a draw. The Caro-Kann's solidity is a platform for winning endgames, not a defensive shell.","ready":"You have won a Caro-Kann endgame from a position you would once have called equal."},{"tier":"Mastery","when":"Ongoing","goal":"Cover every White try and refine the endgames.","learn":["The modern 3...c5 and 3...Nd7 systems against the Advance, which are the current fashion.","The Fantasy Variation 3.f3 and the Two Knights 2.Nf3, both common surprise weapons.","Endgames with the healthy 4v4 structure: this is where Caro-Kann players actually score their wins."],"drill":"Prepare a line against 3.f3 and 2.Nf3 specifically. Most Caro-Kann players are unprepared and lose the opening battle immediately.","mistake":"Assuming every White player will enter the Classical. Below master level, most will not.","ready":"You have a written answer to every White second and third move."}],"study":"Anatoly Karpov's Caro-Kann games are the model of risk-free winning. Viswanathan Anand and Magnus Carlsen both use it at the highest level.","next":"Add the French as a sharper alternative, or go the other way and learn the Sicilian when you want to play for a win with Black more often."}},{"id":"kid","name":"King's Indian Defence","eco":"E60\u2013E99","section":"black-d4","orientation":"black","tagline":"Give White the whole centre, then blow up the kingside. The most aggressive answer to 1.d4.","level":"Intermediate \u2192 World Championship","theory":{"big_idea":"Black deliberately allows White to build a huge pawn centre with c4, d4 and e4, then attacks it from a distance with a fianchettoed bishop and the break ...e5. When White closes the centre with d4\u2013d5, the position becomes locked and both sides attack on opposite wings: White pushes c4\u2013c5 on the queenside, Black pushes ...f5\u2013f4 and ...g5\u2013g4 at White's king. It is the purest attacking race in chess, and the side that is one tempo faster usually wins by force.","structure":"The defining structure is the Mar del Plata: locked pawns on c4/d5/e4 for White against c7/d6/e5 for Black. This diagonal pawn wall determines everything \u2014 White's pawns point at the queenside, so White attacks there; Black's point at the kingside, so Black attacks there. Neither side defends. Whoever arrives first wins.","white_plans":["Close the centre with d5, then break with c5 and pile onto the c-file and c7.","Play the S\u00e4misch with f3, Be3 and O-O-O, and storm the kingside instead \u2014 turning Black's own plan against them.","The Fianchetto Variation with g3: a calm, safe way to blunt the Bg7 and steer the game toward a positional Benoni.","Trade off the g7-bishop with Be3\u2013h6 or Bg5 and Qd2 \u2014 Black's attack dies without it."],"black_plans":["Break with ...e5, then re-route the knights (...Ne7 or ...Nd7) out of the way of the f-pawn.","The pawn storm: ...f5, ...f4, ...g5, ...g4, ...h5 and often a rook lift ...Rf6\u2013h6.","Sacrifice material to open the h-file or the g-file. In many KID games Black is a piece down and completely winning.","Meet a queenside break with ...a5 and ...Nc5, blocking the c-file with a knight."],"traps":["Do not play ...e5 too early against 4.e4 \u2014 check that White cannot answer dxe5 favourably.","In the Mar del Plata, if Black plays ...f5 before securing the knight route, White can hit with exf5 gxf5 and Ng5 or f4 with a strong attack.","The Bayonet Attack (9.b4) is White's most testing modern try \u2014 Black must know 9...Nh5 or 9...a5."],"who":"Play this if you want to attack from move one with the black pieces and you accept that you will be objectively worse for the first thirty moves. Fischer, Kasparov and Radjabov made it famous."},"lines":[{"name":"Classical \u2014 Mar del Plata","note":"The main line and the most exciting position in modern chess. Both sides attack on opposite wings and nobody defends.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"Nf6","fen":"rnbqkb.rpppppppp.....n.............P............PPP.PPPPRNBQKBNR","from":"g8","to":"f6","note":"The Indian move order. Black hits e4 before deciding on a pawn structure, keeping every option open.","num":"1...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"d5","k":"ctrl"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Controls d5 and e4"},{"san":"c4","fen":"rnbqkb.rpppppppp.....n............PP............PP..PPPPRNBQKBNR","from":"c2","to":"c4","note":"The Queen's Gambit. Not a real gambit \u2014 after 2...dxc4 Black cannot hold the pawn. The point is to challenge d5 from the side and win the centre.","num":"2.c4","turn":"w","check":false,"arrows":[{"f":"c2","t":"c4","k":"move"},{"f":"c4","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"g6","fen":"rnbqkb.rpppppp.p.....np...........PP............PP..PPPPRNBQKBNR","from":"g7","to":"g6","note":"Black prepares the fianchetto rather than fighting for the centre with pawns.","num":"2...g6","turn":"b","check":false,"arrows":[{"f":"g7","t":"g6","k":"move"},{"f":"g6","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"Nc3","fen":"rnbqkb.rpppppp.p.....np...........PP......N.....PP..PPPPR.BQKBNR","from":"b1","to":"c3","note":"Natural development, adding a second attacker to d5 and e4.","num":"3.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"ctrl"},{"f":"c3","t":"e4","k":"ctrl"}],"tactics":"Controls d5 and e4"},{"san":"Bg7","fen":"rnbqk..rppppppbp.....np...........PP......N.....PP..PPPPR.BQKBNR","from":"f8","to":"g7","note":"The King's Indian bishop. It aims down the long diagonal at d4 and b2 and i
