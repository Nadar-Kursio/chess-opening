.....P......P....P.P...QPBPRNB..RK.","from":"c8","to":"b7","note":"Tucking the king onto the square the b-pawn vacated. In opposite-castling positions one prophylactic king move is almost always worth it.","num":"12...Kb7","turn":"b","check":false,"arrows":[{"f":"c8","t":"b7","k":"move"},{"f":"b7","t":"c6","k":"def"}],"tactics":"Defends the pawn on c6"},{"san":"Nd2","fen":"...r.b.rpkpp.pppbnp.q.......P.....P......P....P.P..NQPBPR.B..RK.","from":"b1","to":"d2","note":"The last piece develops, heading for f3 or e4 to shore up e5.","num":"13.Nd2","turn":"w","check":false,"arrows":[{"f":"b1","t":"d2","k":"move"},{"f":"d2","t":"c4","k":"def"},{"f":"d2","t":"e4","k":"ctrl"}],"tactics":"Defends the pawn on c4; controls e4"},{"san":"Be7","fen":"...r...rpkppbpppbnp.q.......P.....P......P....P.P..NQPBPR.B..RK.","from":"f8","to":"e7","note":"Development, and the bishop covers the dark squares around the king.","num":"13...Be7","turn":"b","check":false,"arrows":[{"f":"f8","t":"e7","k":"move"},{"f":"e7","t":"c5","k":"ctrl"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Controls c5 and d6"},{"san":"Bb2","fen":"...r...rpkppbpppbnp.q.......P.....P......P....P.PB.NQPBPR....RK.","from":"c1","to":"b2","note":"The bishop joins the long diagonal. Two pieces now aim through the doubled c-pawns at Black's king.","num":"14.Bb2","turn":"w","check":false,"arrows":[{"f":"c1","t":"b2","k":"move"},{"f":"b2","t":"e5","k":"def"},{"f":"b2","t":"d4","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls d4"},{"san":"Rhe8","fen":"...rr...pkppbpppbnp.q.......P.....P......P....P.PB.NQPBPR....RK.","from":"h8","to":"e8","note":"The rook swings across to the e-file. Everything Black owns is now aimed at one pawn.","num":"14...Rhe8","turn":"b","check":false,"arrows":[{"f":"h8","t":"e8","k":"move"}],"tactics":"a repositioning move"},{"san":"Rfe1","fen":"...rr...pkppbpppbnp.q.......P.....P......P....P.PB.NQPBPR...R.K.","from":"f1","to":"e1","note":"White contests the same file. Notice that neither side has thrown a single pawn at the enemy king \u2014 in the Scotch the fight is over e5 first.","num":"15.Rfe1","turn":"w","check":false,"arrows":[{"f":"f1","t":"e1","k":"move"}],"tactics":"a repositioning move"},{"san":"f6","fen":"...rr...pkppb.ppbnp.qp......P.....P......P....P.PB.NQPBPR...R.K.","from":"f7","to":"f6","note":"The undermining move. If Black wins e5, White's space advantage disappears and the doubled pawns stop mattering.","num":"15...f6","turn":"b","check":false,"arrows":[{"f":"f7","t":"f6","k":"move"},{"f":"f6","t":"e5","k":"atk"}],"tactics":"Attacks the pawn on e5"},{"san":"Nf3","fen":"...rr...pkppb.ppbnp.qp......P.....P......P...NP.PB..QPBPR...R.K.","from":"d2","to":"f3","note":"White reinforces. The e5-pawn is the entire argument of the position.","num":"16.Nf3","turn":"w","check":false,"arrows":[{"f":"d2","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"def"},{"f":"f3","t":"d4","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls d4"},{"san":"fxe5","fen":"...rr...pkppb.ppbnp.q.......p.....P......P...NP.PB..QPBPR...R.K.","from":"f6","to":"e5","note":"Black cashes in and opens the f-file toward White's king.","num":"16...fxe5","turn":"b","check":false,"arrows":[{"f":"f6","t":"e5","k":"move"},{"f":"e5","t":"d4","k":"ctrl"},{"f":"e5","t":"f4","k":"ctrl"}],"tactics":"Controls d4 and f4"},{"san":"Nxe5","fen":"...rr...pkppb.ppbnp.q.......N.....P......P....P.PB..QPBPR...R.K.","from":"f3","to":"e5","note":"White recaptures with the knight, which lands centrally hitting c6, d7 and f7. Material is level, the structures are unequal, and the whole middlegame turned on one pawn. That is the Scotch in miniature.","num":"17.Nxe5","turn":"w","check":false,"arrows":[{"f":"f3","t":"e5","k":"move"},{"f":"e5","t":"c4","k":"def"},{"f":"e5","t":"c6","k":"atk"},{"f":"e5","t":"d7","k":"atk"},{"f":"e5","t":"d3","k":"ctrl"}],"tactics":"Attacks the pawn on c6 and the pawn on d7; defends the pawn on c4; controls d3"}]}],"progression":{"arc":"The Scotch is the fast route to a real 1.e4 repertoire: open positions, clear plans, and roughly a tenth of the Ruy Lopez's theory.","stages":[{"tier":"Foundation","when":"Week one","goal":"Know what to do after 3...exd4 4.Nxd4 against each of Black's four replies.","learn":["The two main branches: 4...Nf6 (Mieses) and 4...Bc5 (Classical). Learn one line against each and nothing more at first.","Why 5.Nxc6 is played in the Mieses \u2014 it damages Black's structure and buys the tempo for e4\u2013e5.","The refutation of 4...Qh4: 5.Nc3! (never 5.Nf5?? Qxe4+)."],"drill":"Play the Scotch exclusively for two weeks. The positions repeat quickly and you will learn the patterns fast.","mistake":"Answering 4...Bc5 with 5.Nxc6? \u2014 Black plays 5...Qf6! and wins the piece back with a good game.","ready":"You can reach move eight in both main branches without hesitation."},{"tier":"Structure","when":"Weeks two to six","goal":"Learn to play with and against doubled pawns and a space advantage.","learn":["The Mieses structure: Black's doubled c-pawns against White's healthy queenside majority. That majority is your winning plan.","The double edge of the e5-pawn: it grabs space and it is a permanent target for ...Qe7, ...Ba6 and ...O-O-O.","When to castle queenside yourself and turn the game into a race."],"drill":"Play out the Mieses tabiya after 9...O-O-O ten times from both sides. Notice how often the game is decided by whose attack lands first.","mistake":"Defending the e5-pawn passively. It is a spearhead, not a possession \u2014 sometimes you give it up for activity.","ready":"You can explain why the doubled c-pawns matter more in an endgame than a middlegame."},{"tier":"Plans","when":"Months two to four","goal":"Convert the small opening edge into something.","learn":["The queenside pawn majority: how to create a passed pawn against doubled pawns and trade into the endgame.","The kingside expansion with g3, Bg2, f4 and h4 in the opposite-castling lines.","Meeting ...d5 breaks: usually you take and blockade rather than push past."],"drill":"Take five of your own Scotch games and mark the exact move where you stopped having a plan. That is your study list.","mistake":"Trading pieces without a reason. Your edge is space and structure \u2014 trade pawns to keep the structural plus, not pieces at random.","ready":"You have won a Scotch endgame purely on the queenside majority."},{"tier":"Mastery","when":"Ongoing","goal":"Add the gambit lines and the anti-Scotch systems.","learn":["The Scotch Gambit 4.Bc4 as a second weapon, especially against opponents who prepare 4.Nxd4 lines.","The G\u00f6ring Gambit 4.c3 for when you want the game to catch fire.","How Black avoids the Scotch entirely with 2...Nf6 (Petrov) or 2...d6 (Philidor) \u2014 you need a plan against both."],"drill":"Prepare one complete line against the Petrov. It is the most common way strong players sidestep everything you have learned.","mistake":"Assuming Black must play 2...Nc6. At club level roughly one game in five will not.","ready":"Every Black second move has an answer in your file."}],"study":"Garry Kasparov's Scotch games from the early 1990s revived the whole opening. For the modern positional treatment, look at how Ian Nepomniachtchi and Anish Giri handle the Mieses.","next":"The Scotch pairs naturally with the Italian \u2014 same principles, different pace. Learn both and you can choose the character of the game on move three."}},{"id":"fourknights","name":"Four Knights Game","eco":"C46\u2013C49","section":"white-e4","orientation":"white","tagline":"Both knights out before anything else. The most natural, most symmetrical open game there is.","level":"Beginner \u2192 Grandmaster","theory":{"big_idea":"After 1.e4 e5 2.Nf3 Nc6 3.Nc3 Nf6 all four knights are developed to their best squares and nothing is committed yet. The Four Knights is the purest expression of the opening principles: knights before bishops, fight for the centre, castle early. Because it is so symmetrical, the fight is about who breaks the symmetry first and on what terms \u2014 with 4.Bb5 (Spanish), 4.d4 (Scotch), 4.Bc4 (Italian), 4.g3 (Glek), or a gambit. It has a gentle reputation, but it is fully sound and still appears at the very top level.","structure":"Usually the classic Open Game skeleton: pawns on e4 and e5 with the d-pawns still home, all four knights developed. From there the structure depends entirely on White's fourth move. The Spanish keeps the tension and manoeuvres; the Scotch resolves the centre and gives White doubled c-pawns for Black in some lines; the Glek fianchettoes; and the gambits blow the centre open at once.","white_plans":["The Spanish plan (4.Bb5): pin nothing, pressure e5, then the Metger structure with c3, d4 and slow manoeuvring \u2014 the same ideas as the Ruy Lopez but simpler.","The Scotch plan (4.d4): open the centre immediately and play against Black's doubled c-pawns with a small, clear edge.","The Glek plan (4.g3): fianchetto the bishop and treat the position like a reversed King's Indian, playing for d4 or f4 later.","The gambit plans (Belgrade 5.Nd5, Halloween 4.Nxe5): sacrifice a pawn or a piece for a huge lead in development and a big centre \u2014 surprise weapons that win a lot of club games.","The Ruy Lopez crossover: reach a Four Knights via the Morphy move order 3.Bb5 a6 4.Ba4 Nf6 5.Nc3 (the Tarrasch Variation), then use the Nd5 jump \u2014 a way to play the Four Knights with an extra Spanish flavour."],"black_plans":["Break the symmetry with the Rubinstein 4.Bb5 Nd4!, the most respected reply, which sidesteps all the slow manoeuvring.","The fork trick: against 4.Bc4, play 4...Nxe4! 5.Nxe4 d5 forking bishop and knight to reach an easy equal game.","Copy White's development, castle, and hit back in the centre with ...d5 at the right moment.","In the Metger, unpin with ...Bxc3, ...Qe7 and reroute the knight ...Nd8\u2013e6 to kick the g5-bishop and support ...c5 or ...d5."],"traps":["Halloween Gambit shock: 4.Nxe5!? Nxe5 5.d4 forking two knights \u2014 Black is objectively winning a piece but must defend precisely, and many club players collapse under the central pawn roller.","The classic symmetry trap: after 4.Bb5 Bb4 5.O-O O-O 6.d3 d6, never copy blindly \u2014 6...Bxc3 7.bxc3 and if Black keeps mirroring with 7...Ne7?! White gets a strong attack. Break the symmetry in time.","Belgrade Gambit greed: 4.d4 exd4 5.Nd5 Nxe4?! enters forced, only-move complications where one slip loses on the spot; the calm 5...Nxd5 or 5...Be7 is far safer.","Rubinstein point: 4.Bb5 Nd4 5.Bc4 Bc5 6.Nxe5? Qe7! and Black regains the piece with a better game \u2014 White should avoid grabbing e5."],"who":"Play this if you want a sound, principled 1.e4 opening with far less theory than the Ruy Lopez, or if you want gambit surprise weapons (Belgrade, Halloween) that score heavily at club level. It is the perfect bridge from beginner openings to the classical main lines."},"lines":[{"name":"Spanish Four Knights \u2014 Main Line (Metger)","note":"The classical main line: 4.Bb5, symmetry, then Black unpins with the Metger manoeuvre and reroutes the knight to e6.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game and frees the bishop and queen.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"e5","fen":"rnbqkbnrpppp.ppp............p.......P...........PPPP.PPPRNBQKBNR","from":"e7","to":"e5","note":"Black meets force with force \u2014 the Open Game.","num":"1...e5","turn":"b","check":false,"arrows":[{"f":"e7","t":"e5","k":"move"},{"f":"e5","t":"d4","k":"ctrl"},{"f":"e5","t":"f4","k":"ctrl"}],"tactics":"Controls d4 and f4"},{"san":"Nf3","fen":"rnbqkbnrpppp.ppp............p.......P........N..PPPP.PPPRNBQKB.R","from":"g1","to":"f3","note":"Develops, attacks e5, heads for castling. Knights before bishops.","num":"2.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"atk"},{"f":"f3","t":"d4","k":"ctrl"}],"tactics":"Attacks the pawn on e5 (undefended!); controls d4"},{"san":"Nc6","fen":"r.bqkbnrpppp.ppp..n.........p.......P........N..PPPP.PPPRNBQKB.R","from":"b8","to":"c6","note":"The natural defender of e5 and a move toward the centre.","num":"2...Nc6","turn":"b","check":false,"arrows":[{"f":"b8","t":"c6","k":"move"},{"f":"c6","t":"e5","k":"def"},{"f":"c6","t":"d4","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls d4"},{"san":"Nc3","fen":"r.bqkbnrpppp.ppp..n.........p.......P.....N..N..PPPP.PPPR.BQKB.R","from":"b1","to":"c3","note":"The second knight comes out, adding a defender to e4 and a second eye on d5. Three pieces developed, nothing committed.","num":"3.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"Nf6","fen":"r.bqkb.rpppp.ppp..n..n......p.......P.....N..N..PPPP.PPPR.BQKB.R","from":"g8","to":"f6","note":"And the fourth knight. This is the Four Knights tabiya \u2014 the most symmetrical position in all of open-game theory. Now White decides how to break it.","num":"3...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"e4","k":"atk"},{"f":"f6","t":"d5","k":"ctrl"}],"tactics":"Attacks the pawn on e4; controls d5"},{"san":"Bb5","fen":"r.bqkb.rpppp.ppp..n..n...B..p.......P.....N..N..PPPP.PPPR.BQK..R","from":"f1","to":"b5","note":"The Spanish Four Knights. The bishop pressures the c6-knight, indirectly leaning on e5 \u2014 the same nagging idea as the Ruy Lopez, one move earlier.","num":"4.Bb5","turn":"w","check":false,"arrows":[{"f":"f1","t":"b5","k":"move"},{"f":"b5","t":"c6","k":"atk"},{"f":"b5","t":"c4","k":"ctrl"},{"f":"b5","t":"d3","k":"ctrl"}],"tactics":"Attacks the knight on c6; controls c4 and d3"},{"san":"Bb4","fen":"r.bqk..rpppp.ppp..n..n...B..p....b..P.....N..N..PPPP.PPPR.BQK..R","from":"f8","to":"b4","note":"Black mirrors with the Spanish bishop of his own, pinning White's c3-knight. Symmetry, for now.","num":"4...Bb4","turn":"b","check":false,"arrows":[{"f":"f8","t":"b4","k":"move"},{"f":"b4","t":"c3","k":"atk"},{"f":"b4","t":"c5","k":"ctrl"},{"f":"b4","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on c3; controls c5 and d6"},{"san":"O-O","fen":"r.bqk..rpppp.ppp..n..n...B..p....b..P.....N..N..PPPP.PPPR.BQ.RK.","from":"e1","to":"g1","note":"King safety.","num":"5.O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"g1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"O-O","fen":"r.bq.rk.pppp.ppp..n..n...B..p....b..P.....N..N..PPPP.PPPR.BQ.RK.","from":"e8","to":"g8","note":"King safety. Both sides have followed the opening principles to the letter.","num":"5...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"d3","fen":"r.bq.rk.pppp.ppp..n..n...B..p....b..P.....NP.N..PPP..PPPR.BQ.RK.","from":"d2","to":"d3","note":"White supports e4 and prepares the c3\u2013d4 central expansion. Note: not 6.Bxc6, which just helps Black's centre.","num":"6.d3","turn":"w","check":false,"arrows":[{"f":"d2","t":"d3","k":"move"},{"f":"d3","t":"e4","k":"def"},{"f":"d3","t":"c4","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls c4"},{"san":"d6","fen":"r.bq.rk.ppp..ppp..np.n...B..p....b..P.....NP.N..PPP..PPPR.BQ.RK.","from":"d7","to":"d6","note":"Black supports e5 and unblocks the c8-bishop, keeping the mirror going \u2014 but only for one more move.","num":"6...d6","turn":"b","check":false,"arrows":[{"f":"d7","t":"d6","k":"move"},{"f":"d6","t":"e5","k":"def"},{"f":"d6","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls c5"},{"san":"Bg5","fen":"r.bq.rk.ppp..ppp..np.n...B..p.B..b..P.....NP.N..PPP..PPPR..Q.RK.","from":"c1","to":"g5","note":"The pin. White pressures the f6-knight, a defender of e4 and d5. This is the moment the position starts to breathe.","num":"7.Bg5","turn":"w","check":false,"arrows":[{"f":"c1","t":"g5","k":"move"},{"f":"g5","t":"f6","k":"atk"},{"f":"g5","t":"f4","k":"ctrl"},{"f":"g5","t":"e3","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls f4 and e3"},{"san":"Bxc3","fen":"r.bq.rk.ppp..ppp..np.n...B..p.B.....P.....bP.N..PPP..PPPR..Q.RK.","from":"b4","to":"c3","note":"The start of the Metger unpin. Black trades the bishop for the pinned knight, doubling White's c-pawns.","num":"7...Bxc3","turn":"b","check":false,"arrows":[{"f":"b4","t":"c3","k":"move"},{"f":"c3","t":"b2","k":"atk"},{"f":"c3","t":"e5","k":"def"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Attacks the pawn on b2 (undefended!); defends the pawn on e5; controls d4"},{"san":"bxc3","fen":"r.bq.rk.ppp..ppp..np.n...B..p.B.....P.....PP.N..P.P..PPPR..Q.RK.","from":"b2","to":"c3","note":"White recaptures toward the centre. The doubled c-pawns are a slight weakness, but they support a broad centre with d4 to come.","num":"8.bxc3","turn":"w","check":false,"arrows":[{"f":"b2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"Qe7","fen":"r.b..rk.ppp.qppp..np.n...B..p.B.....P.....PP.N..P.P..PPPR..Q.RK.","from":"d8","to":"e7","note":"Breaking the pin on f6 from the other side and preparing the knight's journey. The queen sits behind the e-pawn.","num":"8...Qe7","turn":"b","check":false,"arrows":[{"f":"d8","t":"e7","k":"move"},{"f":"e7","t":"e5","k":"def"},{"f":"e7","t":"f6","k":"def"},{"f":"e7","t":"e6","k":"ctrl"}],"tactics":"Defends the pawn on e5 and the knight on f6; controls e6"},{"san":"Re1","fen":"r.b..rk.ppp.qppp..np.n...B..p.B.....P.....PP.N..P.P..PPPR..QR.K.","from":"f1","to":"e1","note":"The rook takes the half-open e-file it will fight on, and adds a defender to e4.","num":"9.Re1","turn":"w","check":false,"arrows":[{"f":"f1","t":"e1","k":"move"},{"f":"e1","t":"e4","k":"def"},{"f":"e1","t":"e3","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls e3"},{"san":"Nd8","fen":"r.bn.rk.ppp.qppp...p.n...B..p.B.....P.....PP.N..P.P..PPPR..QR.K.","from":"c6","to":"d8","note":"The key Metger regrouping move. The knight retreats to reroute: from d8 it heads to e6, where it hits the g5-bishop and eyes d4, c5 and f4.","num":"9...Nd8","turn":"b","check":false,"arrows":[{"f":"c6","t":"d8","k":"move"},{"f":"d8","t":"e6","k":"ctrl"}],"tactics":"Controls e6"},{"san":"d4","fen":"r.bn.rk.ppp.qppp...p.n...B..p.B....PP.....P..N..P.P..PPPR..QR.K.","from":"d3","to":"d4","note":"White finally plays the central break, building the ideal d4+e4 duo.","num":"10.d4","turn":"w","check":false,"arrows":[{"f":"d3","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"atk"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls c5"},{"san":"Ne6","fen":"r.b..rk.ppp.qppp...pnn...B..p.B....PP.....P..N..P.P..PPPR..QR.K.","from":"d8","to":"e6","note":"The knight completes its journey and attacks the g5-bishop, forcing it to decide.","num":"10...Ne6","turn":"b","check":false,"arrows":[{"f":"d8","t":"e6","k":"move"},{"f":"e6","t":"d4","k":"atk"},{"f":"e6","t":"g5","k":"atk"},{"f":"e6","t":"c5","k":"ctrl"},{"f":"e6","t":"f4","k":"ctrl"}],"tactics":"Attacks the pawn on d4 and the bishop on g5; controls c5 and f4"},{"san":"Bc1","fen":"r.b..rk.ppp.qppp...pnn...B..p......PP.....P..N..P.P..PPPR.BQR.K.","from":"g5","to":"c1","note":"The bishop retreats to safety on c1, keeping the pair and staying flexible for f4 or Bg5 later.","num":"11.Bc1","turn":"w","check":false,"arrows":[{"f":"g5","t":"c1","k":"move"},{"f":"c1","t":"f4","k":"ctrl"},{"f":"c1","t":"e3","k":"ctrl"}],"tactics":"Controls f4 and e3"},{"san":"c5","fen":"r.b..rk.pp..qppp...pnn...Bp.p......PP.....P..N..P.P..PPPR.BQR.K.","from":"c7","to":"c5","note":"Black strikes at the centre. The position is balanced and rich: White has the bishop pair and central space, Black is solid with clear pressure on d4. A model classical middlegame.","num":"11...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"}]},{"name":"Rubinstein Variation \u2014 4...Nd4!","note":"Black's most respected answer to 4.Bb5. Instead of mirroring, the knight jumps to d4 and forces matters, leading to quick simplification.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the game. It grabs two central squares (d5 and f5), and unlocks both the queen and the light-squared bishop in a single move. No other first move frees two pieces at once.","num":"1.e4","turn":"w","check":false,"arrows":[{"f":"e2","t":"e4","k":"move"},{"f":"e4","t":"d5","k":"ctrl"},{"f":"e4","t":"f5","k":"ctrl"}],"tactics":"Controls d5 and f5"},{"san":"e5","fen":"rnbqkbnrpppp.ppp............p.......P...........PPPP.PPPRNBQKBNR","from":"e7","to":"e5","note":"Black meets force with force and stakes an equal claim to the centre. This is the Open Game \u2014 the most classical, most principled reply there is.","num":"1...e5","turn":"b","check":false,"arrows":[{"f":"e7","t":"e5","k":"move"},{"f":"e5","t":"d4","k":"ctrl"},{"f":"e5","t":"f4","k":"ctrl"}],"tactics":"Controls d4 and f4"},{"san":"Nf3","fen":"rnbqkbnrpppp.ppp............p.......P........N..PPPP.PPPRNBQKB.R","from":"g1","to":"f3","note":"Develops a piece, attacks e5, and heads for castling. Knights before bishops: the knight's best square is obvious this early, the bishop's is  for the initiative as Black.","num":"4...Nd4","turn":"b","check":false,"arrows":[{"f":"c6","t":"d4","k":"move"},{"f":"d4","t":"c2","k":"atk"},{"f":"d4","t":"f3","k":"atk"},{"f":"d4","t":"b5","k":"atk"},{"f":"d4","t":"f5","k":"ctrl"},{"f":"d4","t":"e6","k":"ctrl"}],"tactics":"Attacks the pawn on c2, the knight on f3, and the bishop on b5; controls f5 and e6"},{"san":"Nxd4","fen":"r.bqkb.rpppp.ppp.....n...B..p......NP.....N.....PPPP.PPPR.BQK..R","from":"f3","to":"d4","note":"The main line. White trades on d4. The alternatives 5.Ba4, 5.Bc4 and 5.Nxe5 all have independent theory \u2014 and 5.Nxe5? runs into the Rubinstein trap 5...Qe7! regaining the piece.","num":"5.Nxd4","turn":"w","check":false,"arrows":[{"f":"f3","t":"d4","k":"move"},{"f":"d4","t":"f5","k":"ctrl"},{"f":"d4","t":"e6","k":"ctrl"}],"tactics":"Controls f5 and e6"},{"san":"exd4","fen":"r.bqkb.rpppp.ppp.....n...B.........pP.....N.....PPPP.PPPR.BQK..R","from":"e5","to":"d4","note":"Black recaptures with the e-pawn, and now a black pawn on d4 attacks the c3-knight.","num":"5...exd4","turn":"b","check":false,"arrows":[{"f":"e5","t":"d4","k":"move"},{"f":"d4","t":"c3","k":"atk"},{"f":"d4","t":"e3","k":"ctrl"}],"tactics":"Attacks the knight on c3; controls e3"},{"san":"e5","fen":"r.bqkb.rpppp.ppp.....n...B..P......p......N.....PPPP.PPPR.BQK..R","from":"e4","to":"e5","note":"White pushes past, attacking the f6-knight and opening lines while the d4-pawn is loose.","num":"6.e5","turn":"w","check":false,"arrows":[{"f":"e4","t":"e5","k":"move"},{"f":"e5","t":"f6","k":"atk"},{"f":"e5","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls d6"},{"san":"dxc3","fen":"r.bqkb.rpppp.ppp.....n...B..P.............p.....PPPP.PPPR.BQK..R","from":"d4","to":"c3","note":"Black grabs the knight. Everything is now forcing.","num":"6...dxc3","turn":"b","check":false,"arrows":[{"f":"d4","t":"c3","k":"move"},{"f":"c3","t":"b2","k":"atk"},{"f":"c3","t":"d2","k":"atk"}],"tactics":"Attacks the pawn on b2 and the pawn on d2"},{"san":"exf6","fen":"r.bqkb.rpppp.ppp.....P...B................p.....PPPP.PPPR.BQK..R","from":"e5","to":"f6","note":"White takes the f6-knight in return. Material is even and the position is opening up fast.","num":"7.exf6","turn":"w","check":false,"arrows":[{"f":"e5","t":"f6","k":"move"},{"f":"f6","t":"g7","k":"atk"}],"tactics":"Attacks the pawn on g7"},{"san":"Qxf6","fen":"r.b.kb.rpppp.ppp.....q...B................p.....PPPP.PPPR.BQK..R","from":"d8","to":"f6","note":"Black recaptures with the queen, which lands actively in the centre.","num":"7...Qxf6","turn":"b","check":false,"arrows":[{"f":"d8","t":"f6","k":"move"},{"f":"f6","t":"f2","k":"atk"},{"f":"f6","t":"c3","k":"def"},{"f":"f6","t":"e5","k":"ctrl"},{"f":"f6","t":"d4","k":"ctrl"}],"tactics":"Attacks the pawn on f2; defends the pawn on c3; controls e5 and d4"},{"san":"dxc3","fen":"r.b.kb.rpppp.ppp.....q...B................P.....PPP..PPPR.BQK..R","from":"d2","to":"c3","note":"White recaptures the c3-pawn, restoring material balance. The doubled c-pawns are gone.","num":"8.dxc3","turn":"w","check":false,"arrows":[{"f":"d2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"Qe5+","fen":"r.b.kb.rpppp.ppp.........B..q.............P.....PPP..PPPR.BQK..R","from":"f6","to":"e5","note":"A little in-between check that forces the queens off \u2014 the point of Black's whole idea.","num":"8...Qe5+","turn":"b","check":true,"arrows":[{"f":"f6","t":"e5","k":"move"},{"f":"e5","t":"e1","k":"chk"},{"f":"e5","t":"h2","k":"atk"},{"f":"e5","t":"c3","k":"atk"},{"f":"e5","t":"b5","k":"atk"},{"f":"e5","t":"d5","k":"ctrl"},{"f":"e5","t":"d4","k":"ctrl"}],"tactics":"Gives check; attacks the pawn on h2, the pawn on c3, and the bishop on b5 (undefended!); controls d5 and d4"},{"san":"Qe2","fen":"r.b.kb.rpppp.ppp.........B..q.............P.....PPP.QPPPR.B.K..R","from":"d1","to":"e2","note":"White blocks and offers the trade.","num":"9.Qe2","turn":"w","check":false,"arrows":[{"f":"d1","t":"e2","k":"move"},{"f":"e2","t":"b5","k":"def"},{"f":"e2","t":"e5","k":"atk"},{"f":"e2","t":"e4","k":"ctrl"},{"f":"e2","t":"c4","k":"ctrl"}],"tactics":"Attacks the queen on e5 (undefended!); defends the bishop on b5; controls e4 and c4"},{"san":"Qxe2+","fen":"r.b.kb.rpppp.ppp.........B................P.....PPP.qPPPR.B.K..R","from":"e5","to":"e2","note":"Black takes.","num":"9...Qxe2+","turn":"b","check":true,"arrows":[{"f":"e5","t":"e2","k":"move"},{"f":"e2","t":"e1","k":"chk"},{"f":"e2","t":"c2","k":"atk"},{"f":"e2","t":"f2","k":"atk"},{"f":"e2","t":"b5","k":"atk"},{"f":"e2","t":"e5","k":"ctrl"},{"f":"e2","t":"e4","k":"ctrl"}],"tactics":"Gives check; attacks the pawn on c2 (undefended!), the pawn on f2, and the bishop on b5 (undefended!); controls e5 and e4"},{"san":"Kxe2","fen":"r.b.kb.rpppp.ppp.........B................P.....PPP.KPPPR.B....R","from":"e1","to":"e2","note":"White recaptures with the king. The result is a dead-level endgame where both sides have the bishop pair and a symmetrical-ish structure. This is exactly what the Rubinstein promises: a safe, equal game with no memorisation of the slow Metger lines.","num":"10.Kxe2","turn":"w","check":false,"arrows":[{"f":"e1","t":"e2","k":"move"},{"f":"e2","t":"d3","k":"ctrl"},{"f":"e2","t":"e3","k":"ctrl"}],"tactics":"Controls d3 and e3"}]},{"name":"Morphy Defense, Tarrasch Variation (Ruy Lopez \u00d7 Four Knights)","note":"The bridge between the two openings: a Morphy Ruy Lopez (3.Bb5 a6 4.Ba4 Nf6) that transposes to a Four Knights structure with 5.Nc3. ECO literally calls it the 'Ruy Lopez, Four Knights (Tarrasch) Variation'.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"e4","fen":"rnbqkbnrpppppppp....................P...........PPPP.PPPRNBQKBNR","from":"e2","to":"e4","note":"The king's pawn opens the gam "k":"move"},{"f":"c6","t":"e5","k":"def"},{"f":"c6","t":"d4","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls d4"},{"san":"Nc3","fen":"r.bqkbnrpppp.ppp..n.........p.......P.....N..N..PPPP.PPPR.BQKB.R","from":"b1","to":"c3","note":"The second knight comes out, adding a defender to e4 and a second eye on d5. Three pieces developed, nothing committed.","num":"3.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"ctrl"}],"tactics":"Controls d5"},{"san":"Nf6","fen":"r.bqkb.rpppp.ppp..n..n......p.......P.....N..N..PPPP.PPPR.BQKB.R","from":"g8","to":"f6","note":"And the fourth knight. This is the Four Knights tabiya \u2014 the most symmetrical position in all of open-game theory. Now White decides how to break it.","num":"3...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"e4","k":"atk"},{"f":"f6","t":"d5","k":"ctrl"}],"tactics":"Attacks the pawn on e4; controls d5"},{"san":"Bb5","fen":"r.bqkb.rpppp.ppp..n..n...B..p.......P.....N..N..PPPP.PPPR.BQK..R","from":"f1","to":"b5","note":"The Spanish Four Knights. The bishop pressures the c6-knight, indirectly leaning on e5 \u2014 the same nagging idea as the Ruy Lopez, one move earlier.","num":"4.Bb5","turn":"w","check":false,"arrows":[{"f":"f1","t":"b5","k":"move"},{"f":"b5","t":"c6","k":"atk"},{"f":"b5","t":"c4","k":"ctrl"},{"f":"b5","t":"d3","k":"ctrl"}],"tactics":"Attacks the knight on c6; controls c4 and d3"},{"san":"Bb4","fen":"r.bqk..rpppp.ppp..n..n...B..p....b..P.....N..N..PPPP.PPPR.BQK..R","from":"f8","to":"b4","note":"Black mirrors with the Spanish bishop of his own, pinning White's c3-knight. Symmetry, for now.","num":"4...Bb4","turn":"b","check":false,"arrows":[{"f":"f8","t":"b4","k":"move"},{"f":"b4","t":"c3","k":"atk"},{"f":"b4","t":"c5","k":"ctrl"},{"f":"b4","t":"d6","k":"ctrl"}],"tactics":"Attacks the knight on c3; controls c5 and d6"},{"san":"O-O","fen":"r.bqk..rpppp.ppp..n..n...B..p....b..P.....N..N..PPPP.PPPR.BQ.RK.","from":"e1","to":"g1","note":"King safety.","num":"5.O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"g1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"O-O","fen":"r.bq.rk.pppp.ppp..n..n...B..p....b..P.....N..N..PPPP.PPPR.BQ.RK.","from":"e8","to":"g8","note":"King safety. Both sides have followed the opening principles to the letter.","num":"5...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"d3","fen":"r.bq.rk.pppp.ppp..n..n...B..p....b..P.....NP.N..PPP..PPPR.BQ.RK.","from":"d2","to":"d3","note":"White supports e4 and prepares the c3\u2013d4 central expansion. Note: not 6.Bxc6, which just helps Black's centre.","num":"6.d3","turn":"w","check":false,"arrows":[{"f":"d2","t":"d3","k":"move"},{"f":"d3","t":"e4","k":"def"},{"f":"d3","t":"c4","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls c4"},{"san":"d6","fen":"r.bq.rk.ppp..ppp..np.n...B..p....b..P.....NP.N..PPP..PPPR.BQ.RK.","from":"d7","to":"d6","note":"Black supports e5 and unblocks the c8-bishop, keeping the mirror going \u2014 but only for one more move.","num":"6...d6","turn":"b","check":false,"arrows":[{"f":"d7","t":"d6","k":"move"},{"f":"d6","t":"e5","k":"def"},{"f":"d6","t":"c5","k":"ctrl"}],"tactics":"Defends the pawn on e5; controls c5"},{"san":"Bg5","fen":"r.bq.rk.ppp..ppp..np.n...B..p.B..b..P.....NP.N..PPP..PPPR..Q.RK.","from":"c1","to":"g5","note":"The pin. White pressures the f6-knight, a defender of e4 and d5. This is the moment the position starts to breathe.","num":"7.Bg5","turn":"w","check":false,"arrows":[{"f":"c1","t":"g5","k":"move"},{"f":"g5","t":"f6","k":"atk"},{"f":"g5","t":"f4","k":"ctrl"},{"f":"g5","t":"e3","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls f4 and e3"},{"san":"Bxc3","fen":"r.bq.rk.ppp..ppp..np.n...B..p.B.....P.....bP.N..PPP..PPPR..Q.RK.","from":"b4","to":"c3","note":"The start of the Metger unpin. Black trades the bishop for the pinned knight, doubling White's c-pawns.","num":"7...Bxc3","turn":"b","check":false,"arrows":[{"f":"b4","t":"c3","k":"move"},{"f":"c3","t":"b2","k":"atk"},{"f":"c3","t":"e5","k":"def"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Attacks the pawn on b2 (undefended!); defends the pawn on e5; controls d4"},{"san":"bxc3","fen":"r.bq.rk.ppp..ppp..np.n...B..p.B.....P.....PP.N..P.P..PPPR..Q.RK.","from":"b2","to":"c3","note":"White recaptures toward the centre. The doubled c-pawns are a slight weakness, but they support a broad centre with d4 to come.","num":"8.bxc3","turn":"w","check":false,"arrows":[{"f":"b2","t":"c3","k":"move"},{"f":"c3","t":"d4","k":"ctrl"}],"tactics":"Controls d4"},{"san":"Qe7","fen":"r.b..rk.ppp.qppp..np.n...B..p.B.....P.....PP.N..P.P..PPPR..Q.RK.","from":"d8","to":"e7","note":"Breaking the pin on f6 from the other side and preparing the knight's journey. The queen sits behind the e-pawn.","num":"8...Qe7","turn":"b","check":false,"arrows":[{"f":"d8","t":"e7","k":"move"},{"f":"e7","t":"e5","k":"def"},{"f":"e7","t":"f6","k":"def"},{"f":"e7","t":"e6","k":"ctrl"}],"tactics":"Defends the pawn on e5 and the knight on f6; controls e6"},{"san":"Re1","fen":"r.b..rk.ppp.qppp..np.n...B..p.B.....P.....PP.N..P.P..PPPR..QR.K.","from":"f1","to":"e1","note":"The rook takes the half-open e-file it will fight on, and adds a defender to e4.","num":"9.Re1","turn":"w","check":false,"arrows":[{"f":"f1","t":"e1","k":"move"},{"f":"e1","t":"e4","k":"def"},{"f":"e1","t":"e3","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls e3"},{"san":"Nd8","fen":"r.bn.rk.ppp.qppp...p.n...B..p.B.....P.....PP.N..P.P..PPPR..QR.K.","from":"c6","to":"d8","note":"The key Metger regrouping move. The knight retreats to reroute: from d8 it heads to e6, where it hits the g5-bishop and eyes d4, c5 and f4.","num":"9...Nd8","turn":"b","check":false,"arrows":[{"f":"c6","t":"d8","k":"move"},{"f":"d8","t":"e6","k":"ctrl"}],"tactics":"Controls e6"},{"san":"d4","fen":"r.bn.rk.ppp.qppp...p.n...B..p.B....PP.....P..N..P.P..PPPR..QR.K.","from":"d3","to":"d4","note":"White finally plays the central break, building the ideal d4+e4 duo.","num":"10.d4","turn":"w","check":false,"arrows":[{"f":"d3","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"atk"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls c5"},{"san":"Ne6","fen":"r.b..rk.ppp.qppp...pnn...B..p.B....PP.....P..N..P.P..PPPR..QR.K.","from":"d8","to":"e6","note":"The knight completes its journey and attacks the g5-bishop, forcing it to decide.","num":"10...Ne6","turn":"b","check":false,"arrows":[{"f":"d8","t":"e6","k":"move"},{"f":"e6","t":"d4","k":"atk"},{"f":"e6","t":"g5","k":"atk"},{"f":"e6","t":"c5","k":"ctrl"},{"f":"e6","t":"f4","k":"ctrl"}],"tactics":"Attacks the pawn on d4 and the bishop on g5; controls c5 and f4"},{"san":"Bc1","fen":"r.b..rk.ppp.qppp...pnn...B..p......PP.....P..N..P.P..PPPR.BQR.K.","from":"g5","to":"c1","note":"The bishop retreats to safety on c1, keeping the pair and staying flexible for f4 or Bg5 later.","num":"11.Bc1","turn":"w","check":false,"arrows":[{"f":"g5","t":"c1","k":"move"},{"f":"c1","t":"f4","k":"ctrl"},{"f":"c1","t":"e3","k":"ctrl"}],"tactics":"Controls f4 and e3"},{"san":"c5","fen":"r.b..rk.pp..qppp...pnn...Bp.p......PP.....P..N..P.P..PPPR.BQR.K.","from":"c7","to":"c5","note":"Black strikes at the centre. The position is balanced and rich: White has the bishop pair and central space, Black is solid with clear pressure on d4. A model classical middlegame.","num":"11...c5","turn":"b","check":false,"arrows":[{"f":"c7","t":"c5","k":"move"},{"f":"c5","t":"d4","k":"atk"}],"tactics":"Attacks the pawn on d4"},{"san":"d5","fen":"r.b..rk.pp..qppp...pnn...BpPp.......P.....P..N..P.P..PPPR.BQR.K.","from":"d4","to":"d5","note":"White grabs space and kicks the e6-knight. This closes the centre and defines the middlegame: play will happen on the wings.","num":"12.d5","turn":"w","check":false,"arrows":[{"f":"d4","t":"d5","k":"move"},{"f":"d5","t":"e6","k":"atk"}],"tactics":"Attacks the knight on e6"},{"san":"Nf4","fen":"r.b..rk.pp..qppp...p.n...BpPp.......Pn....P..N..P.P..PPPR.BQR.K.","from":"e6","to":"f4","note":"Rather than retreat, the knight leaps to f4, its ideal square \u2014 hitting d3, g2 and e2.","num":"12...Nf4","turn":"b","check":false,"arrows":[{"f":"e6","t":"f4","k":"move"},{"f":"f4","t":"g2","k":"atk"},{"f":"f4","t":"d5","k":"atk"},{"f":"f4","t":"e6","k":"ctrl"},{"f":"f4","t":"d3","k":"ctrl"}],"tactics":"Attacks the pawn on g2 and the pawn on d5; controls e6 and d3"},{"san":"Bxf4","fen":"r.b..rk.pp..qppp...p.n...BpPp.......PB....P..N..P.P..PPPR..QR.K.","from":"c1","to":"f4","note":"White trades it off, because a knight on f4 is worth more than the dark-squared bishop here.","num":"13.Bxf4","turn":"w","check":false,"arrows":[{"f":"c1","t":"f4","k":"move"},{"f":"f4","t":"e5","k":"atk"},{"f":"f4","t":"e3","k":"ctrl"}],"tactics":"Attacks the pawn on e5; controls e3"},{"san":"exf4","fen":"r.b..rk.pp..qppp...p.n...BpP........Pp....P..N..P.P..PPPR..QR.K.","from":"e5","to":"f4","note":"Black recaptures with the pawn. Now Black has the bishop pair and a cramping pawn on f4 that freezes White's kingside, in return for the slightly loose structure.","num":"13...exf4","turn":"b","check":false,"arrows":[{"f":"e5","t":"f4","k":"move"},{"f":"f4","t":"e3","k":"ctrl"}],"tactics":"Controls e3"},{"san":"Nd2","fen":"r.b..rk.pp..qppp...p.n...BpP........Pp....P.....P.PN.PPPR..QR.K.","from":"f3","to":"d2","note":"White begins the knight's journey: d2\u2013f1\u2013e3, heading for the beautiful f5 or d5 outposts. This is the signature Ruy/Four Knights manoeuvre.","num":"14.Nd2","turn":"w","check":false,"arrows":[{"f":"f3","t":"d2","k":"move"},{"f":"d2","t":"e4","k":"def"},{"f":"d2","t":"c4","k":"ctrl"}],"tactics":"Defends the pawn on e4; controls c4"},{"san":"g5","fen":"r.b..rk.pp..qp.p...p.n...BpP..p.....Pp....P.....P.PN.PPPR..QR.K.","from":"g7","to":"g5","note":"Black defends the f4-pawn and grabs kingside space \u2014 the wing where Black's pawns point.","num":"14...g5","turn":"b","check":false,"arrows":[{"f":"g7","t":"g5","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Nf1","fen":"r.b..rk.pp..qp.p...p.n...BpP..p.....Pp....P.....P.P..PPPR..QRNK.","from":"d2","to":"f1","note":"The knight continues to f1, on its way to e3.","num":"15.Nf1","turn":"w","check":false,"arrows":[{"f":"d2","t":"f1","k":"move"},{"f":"f1","t":"e3","k":"ctrl"}],"tactics":"Controls e3"},{"san":"Bd7","fen":"r....rk.pp.bqp.p...p.n...BpP..p.....Pp....P.....P.P..PPPR..QRNK.","from":"c8","to":"d7","note":"Black develops the last minor piece and offers to trade off White's good bishop.","num":"15...Bd7","turn":"b","check":false,"arrows":[{"f":"c8","t":"d7","k":"move"},{"f":"d7","t":"b5","k":"atk"},{"f":"d7","t":"f5","k":"ctrl"},{"f":"d7","t":"e6","k":"ctrl"}],"tactics":"Attacks the bishop on b5 (undefended!); controls f5 and e6"},{"san":"Bxd7","fen":"r....rk.pp.Bqp.p...p.n....pP..p.....Pp....P.....P.P..PPPR..QRNK.","from":"b5","to":"d7","note":"White accepts the trade.","num":"16.Bxd7","turn":"w","check":false,"arrows":[{"f":"b5","t":"d7","k":"move"},{"f":"d7","t":"f5","k":"ctrl"},{"f":"d7","t":"e6","k":"ctrl"}],"tactics":"Controls f5 and e6"},{"san":"Qxd7","fen":"r....rk.pp.q.p.p...p.n....pP..p.....Pp....P.....P.P..PPPR..QRNK.","from":"e7","to":"d7","note":"Black recaptures with the queen.","num":"16...Qxd7","turn":"b","check":false,"arrows":[{"f":"e7","t":"d7","k":"move"},{"f":"d7","t":"f5","k":"ctrl"},{"f":"d7","t":"e6","k":"ctrl"}],"tactics":"Controls f5 and e6"},{"san":"Ne3","fen":"r....rk.pp.q.p.p...p.n....pP..p.....Pp....P.N...P.P..PPPR..QR.K.","from":"f1","to":"e3","note":"The knight reaches e3, eyeing f5 and d5 \u2014 the outposts the closed centre created.","num":"17.Ne3","turn":"w","check":false,"arrows":[{"f":"f1","t":"e3","k":"move"},{"f":"e3","t":"d5","k":"def"},{"f":"e3","t":"f5","k":"ctrl"},{"f":"e3","t":"c4","k":"ctrl"}],"tactics":"Defends the pawn on d5; controls f5 and c4"},{"san":"Qe7","fen":"r....rk.pp..qp.p...p.n....pP..p.....Pp....P.N...P.P..PPPR..QR.K.","from":"d7","to":"e7","note":"Black centralises the queen. A rich, roughly balanced manoeuvring middlegame: White's knight and central space against Black's bishop and kingside pawn majority. This is what the quiet Four Knights is really about \u2014 small, lasting imbalances played out over forty moves.","num":"17...Qe7","turn":"b","check":false,"arrows":[{"f":"d7","t":"e7","k":"move"},{"f":"e7","t":"e4","k":"atk"},{"f":"e7","t":"e5","k":"ctrl"},{"f":"e7","t":"e6","k":"ctrl"}],"tactics":"Attacks the pawn on e4 (undefended!); controls e5 and e6"}]}],"progression":{"arc":"The Four Knights is the ideal first 'real' opening: it rewards the principles you already know, then quietly teaches you the manoeuvring ideas of the Ruy Lopez without the mountain of theory.","stages":[{"tier":"Foundation","when":"Week one","goal":"Reach the tabiya and pick your fourth move.","learn":["The starting moves 1.e4 e5 2.Nf3 Nc6 3.Nc3 Nf6 \u2014 pure opening principles, played on autopilot.","Choose one fourth move to start with: 4.Bb5 (Spanish, classical) or 4.d4 (Scotch, low-theory and direct).","Why symmetry is dangerous for the copier: at some point Black must break it, and if White breaks it first with tempo, White is better."],"drill":"Play twenty games committing to one fourth move. Notice how often opponents simply mirror you into trouble.","mistake":"Copying Black's moves back forever as White, or as Black copying White past the point where a concrete threat appears.","ready":"You reach the four-knights position without thinking and always have a plan for move four."},{"tier":"Structure","when":"Weeks two to four","goal":"Understand the Metger structure and the doubled c-pawns.","learn":["The Metger unpin: ...Bxc3, ...Qe7, ...Nd8\u2013e6, and why the knight goes the long way round.","How doubled c-pawns are both a weakness (a target) and a strength (they support a big centre) \u2014 the central Four Knights bargain.","The two freeing breaks for Black: ...d5 (in the Scotch and Glek) and ...c5 (in the Spanish)."],"drill":"Play out the Metger main line to move twelve from both sides five times. Learn the knight route by hand.","mistake":"Trading on c6 too early as White \u2014 it repairs Black's structure and hands over the bishop pair for nothing.","ready":"You can explain what the doubled c-pawns do for and against you."},{"tier":"Plans","when":"Months two to four","goal":"Play the middlegame the opening produces.","learn":["The knight manoeuvre Nf3\u2013d2\u2013f1\u2013e3\u2013f5, the same slow build-up as the Ruy Lopez.","When to close the centre with d5 (play on the wings) versus keep the tension (piece play).","Meeting Black's ...Nd4 (Rubinstein) and the fork trick (against 4.Bc4) without getting worse."],"drill":"Study ten Metger middlegames and mark where each side's knights ended up. Patterns will repeat.","mistake":"Drifting without a plan once development is done \u2014 the Four Knights punishes aimless play more than tactical openings do.","ready":"You have re-routed a knight to f5 or d5 and won a game from the resulting bind."},{"tier":"Mastery","when":"Ongoing","goal":"Add sharpness and cover the gambits from both sides.","learn":["The Belgrade Gambit (5.Nd5) as an occasional surprise weapon, and the sound defences 5...Nxd5 and 5...Be7.","The Halloween Gambit (4.Nxe5) \u2014 how to attack with it, and, more importantly, how to refute it and keep the extra piece.","The Glek 4.g3 as a low-risk positional alternative when you want to avoid all the main-line theory."],"drill":"Learn the Halloween Gambit refutation cold. You will be on the receiving end of it sooner or later.","mistake":"Entering the Belgrade's 5...Nxe4 complications unprepared \u2014 it is all forcing, only-move theory.","ready":"You are comfortable on both sides of at least one Four Knights gambit."}],"study":"For the classical Spanish Four Knights, study Savielly Tartakower and the old masters; for the modern positional Glek, look at Igor Glek's own games. Kasparov and Anand have both used the Scotch Four Knights at the top level.","next":"The Four Knights flows straight into the Ruy Lopez and the Scotch \u2014 the ideas transfer almost move for move. When you want more depth, those are the natural next steps."}},{"id":"queensgambit","name":"Queen's Gambit","eco":"D06\u2013D69","section":"white-d4","orientation":"white","tagline":"The most trusted 1.d4 opening in history. Not really a gambit at all.","level":"Beginner \u2192 World Championship","theory":{"big_idea":"White attacks Black's d5-pawn from the side with c4 instead of head-on. If Black takes with ...dxc4, the pawn cannot be held (b5 is always met by a4), and White simply recovers it while building a big centre with e4. If Black declines with ...e6 or ...c6, Black must accept a small structural or developmental concession. The whole opening is a fight over whether White gets to play e2\u2013e4.","structure":"The defining structure is the Carlsbad: White pawns on a2, b2, c3, d4, e3 against Black pawns on a7, b7, c6, d5, f7. It arises from the Exchange Variation and it hands both sides a completely clear plan \u2014 White attacks on the queenside with a minority attack, Black attacks on the kingside with a piece storm. Learning the Carlsbad teaches you more about middlegame planning than any tactics book.","white_plans":["The minority attack: push b2\u2013b4\u2013b5 to trade off on c6, leaving Black with a weak backward c-pawn on an open file.","Play for the e3\u2013e4 break, converting the space advantage into an attack.","In the Accepted, regain the pawn with Bxc4 and build the ideal centre with e4, accepting an isolated d-pawn for activity.","Pile up on the c-file and infiltrate on c7/c8."],"black_plans":["Break with ...c5 (Tarrasch style) or ...e5, freeing the position at the cost of structure.","In the Carlsbad, attack on the kingside with ...Ne4, ...f5, ...Ng6 and a piece storm \u2014 Black is faster there because White's pawns are committed to the other wing.","Trade off pieces with the Tartakower plan (...b6, ...Bb7) to relieve the cramp.","The 'freeing manoeuvre' ...Nd7\u2013f8\u2013g6 or ...Nf6\u2013e4 to trade a pair of pieces."],"traps":["The Elephant Trap: 1.d4 d5 2.c4 e6 3.Nc3 Nf6 4.Bg5 Nbd7 5.cxd5 exd5 6.Nxd5?? Nxd5! 7.Bxd8 Bb4+! 8.Qd2 Bxd2+ 9.Kxd2 Kxd8 and Black is a piece up.","Never try to defend the c4-pawn with 2...dxc4 3.e3 b5?? 4.a4 c6 5.axb5 cxb5 6.Qf3! forking a8 and b7.","The Rubinstein Trap: Black playing ...Nbd7 and then ...Re8 too early can drop a pawn to Nxd5!"],"who":"Play this if you want the most solid, most respected 1.d4 opening there is. Every world champion from Steinitz to Ding has played it."},"lines":[{"name":"Exchange Variation \u2014 The Minority Attack","note":"The single most instructive plan in all of chess. Learn this and you will understand what a 'plan' actually means.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"d5","fen":"rnbqkbnrppp.pppp...........p.......P............PPP.PPPPRNBQKBNR","from":"d7","to":"d5","note":"Black mirrors in the centre. The Closed Games, where structure matters more than tempo.","num":"1...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"ctrl"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"c4","fen":"rnbqkbnrppp.pppp...........p......PP............PP..PPPPRNBQKBNR","from":"c2","to":"c4","note":"The Queen's Gambit. White does not really give a pawn \u2014 the point is to deflect the d5-pawn so that e2\u2013e4 becomes possible.","num":"2.c4","turn":"w","check":false,"arrows":[{"f":"c2","t":"c4","k":"move"},{"f":"c4","t":"d5","k":"atk"}],"tactics":"Attacks the pawn on d5"},{"san":"e6","fen":"rnbqkbnrppp..ppp....p......p......PP............PP..PPPPRNBQKBNR","from":"e7","to":"e6","note":"The Queen's Gambit Declined. Rock-solid: Black supports d5 with a pawn. The cost is that the c8-bishop is temporarily locked behind its own pawn chain.","num":"2...e6","turn":"b","check":false,"arrows":[{"f":"e7","t":"e6","k":"move"},{"f":"e6","t":"d5","k":"def"},{"f":"e6","t":"f5","k":"ctrl"}],"tactics":"Defends the pawn on d5; controls f5"},{"san":"Nc3","fen":"rnbqkbnrppp..ppp....p......p......PP......N.....PP..PPPPR.BQKBNR","from":"b1","to":"c3","note":"Developing and adding a third attacker to d5.","num":"3.Nc3","turn":"w","check":false,"arrows":[{"f":"b1","t":"c3","k":"move"},{"f":"c3","t":"d5","k":"atk"},{"f":"c3","t":"e4","k":"ctrl"}],"tactics":"Attacks the pawn on d5; controls e4"},{"san":"Nf6","fen":"rnbqkb.rppp..ppp....pn.....p......PP......N.....PP..PPPPR.BQKBNR","from":"g8","to":"f6","note":"Black develops and defends d5 for the third time.","num":"3...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"d5","k":"def"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Defends the pawn on d5; controls e4"},{"san":"cxd5","fen":"rnbqkb.rppp..ppp....pn.....P.......P......N.....PP..PPPPR.BQKBNR","from":"c4","to":"d5","note":"The Exchange Variation. White resolves the tension deliberately, creating the Carlsbad structure and a clear long-term plan.","num":"4.cxd5","turn":"w","check":false,"arrows":[{"f":"c4","t":"d5","k":"move"},{"f":"d5","t":"e6","k":"atk"}],"tactics":"Attacks the pawn on e6"},{"san":"exd5","fen":"rnbqkb.rppp..ppp.....n.....p.......P......N.....PP..PPPPR.BQKBNR","from":"e6","to":"d5","note":"Black must recapture with the e-pawn: 4...Nxd5 would concede the centre and 4...Qxd5 loses time to Nc3.","num":"4...exd5","turn":"b","check":false,"arrows":[{"f":"e6","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"ctrl"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"Bg5","fen":"rnbqkb.rppp..ppp.....n.....p..B....P......N.....PP..PPPPR..QKBNR","from":"c1","to":"g5","note":"Pinning the f6-knight, which is d5's main defender.","num":"5.Bg5","turn":"w","check":false,"arrows":[{"f":"c1","t":"g5","k":"move"},{"f":"g5","t":"f6","k":"atk"},{"f":"g5","t":"f4","k":"ctrl"},{"f":"g5","t":"e3","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls f4 and e3"},{"san":"c6","fen":"rnbqkb.rpp...ppp..p..n.....p..B....P......N.....PP..PPPPR..QKBNR","from":"c7","to":"c6","note":"Black shores up d5 a third time. This is the Carlsbad structure: White has pawns a2-b2-c3-d4-e3, Black has a7-b7-c6-d5-f7.","num":"5...c6","turn":"b","check":false,"arrows":[{"f":"c7","t":"c6","k":"move"},{"f":"c6","t":"d5","k":"def"}],"tactics":"Defends the pawn on d5"},{"san":"e3","fen":"rnbqkb.rpp...ppp..p..n.....p..B....P......N.P...PP...PPPR..QKBNR","from":"e2","to":"e3","note":"Modest but essential \u2014 it supports d4 and opens the f1-bishop.","num":"6.e3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"},{"f":"e3","t":"f4","k":"ctrl"}],"tactics":"Controls f4"},{"san":"Be7","fen":"rnbqk..rpp..bppp..p..n.....p..B....P......N.P...PP...PPPR..QKBNR","from":"f8","to":"e7","note":"Breaking the pin and preparing to castle.","num":"6...Be7","turn":"b","check":false,"arrows":[{"f":"f8","t":"e7","k":"move"},{"f":"e7","t":"f6","k":"def"},{"f":"e7","t":"c5","k":"ctrl"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Defends the knight on f6; controls c5 and d6"},{"san":"Bd3","fen":"rnbqk..rpp..bppp..p..n.....p..B....P......NBP...PP...PPPR..QK.NR","from":"f1","to":"d3","note":"The bishop takes its best diagonal, aiming at h7 and supporting a future e4.","num":"7.Bd3","turn":"w","check":false,"arrows":[{"f":"f1","t":"d3","k":"move"},{"f":"d3","t":"h7","k":"atk"},{"f":"d3","t":"e4","k":"ctrl"},{"f":"d3","t":"f5","k":"ctrl"}],"tactics":"Attacks the pawn on h7; controls e4 and f5"},{"san":"Nbd7","fen":"r.bqk..rpp.nbppp..p..n.....p..B....P......NBP...PP...PPPR..QK.NR","from":"b8","to":"d7","note":"The knight goes to d7 rather than c6 so it does not block the c-pawn, and it heads for f8 and g6.","num":"7...Nbd7","turn":"b","check":false,"arrows":[{"f":"b8","t":"d7","k":"move"},{"f":"d7","t":"f6","k":"def"},{"f":"d7","t":"e5","k":"ctrl"},{"f":"d7","t":"c5","k":"ctrl"}],"tactics":"Defends the knight on f6; controls e5 and c5"},{"san":"Qc2","fen":"r.bqk..rpp.nbppp..p..n.....p..B....P......NBP...PPQ..PPPR...K.NR","from":"d1","to":"c2","note":"Battery on the b1\u2013h7 diagonal, and the queen also eyes the c-file where the action will be.","num":"8.Qc2","turn":"w","check":false,"arrows":[{"f":"d1","t":"c2","k":"move"}],"tactics":"a repositioning move"},{"san":"O-O","fen":"r.bq.rk.pp.nbppp..p..n.....p..B....P......NBP...PPQ..PPPR...K.NR","from":"e8","to":"g8","note":"King safety.","num":"8...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"},{"f":"g8","t":"h7","k":"def"}],"tactics":"Defends the pawn on h7"},{"san":"Nge2","fen":"r.bq.rk.pp.nbppp..p..n.....p..B....P......NBP...PPQ.NPPPR...K..R","from":"g1","to":"e2","note":"Note: the knight goes to e2, not f3, so that the f-pawn stays free and the knight can go to g3 or f4. A key Carlsbad subtlety.","num":"9.Nge2","turn":"w","check":false,"arrows":[{"f":"g1","t":"e2","k":"move"},{"f":"e2","t":"f4","k":"ctrl"}],"tactics":"Controls f4"},{"san":"Re8","fen":"r.bqr.k.pp.nbppp..p..n.....p..B....P......NBP...PPQ.NPPPR...K..R","from":"f8","to":"e8","note":"Black's rook eyes the e-file and supports a future ...Ne4.","num":"9...Re8","turn":"b","check":false,"arrows":[{"f":"f8","t":"e8","k":"move"}],"tactics":"a repositioning move"},{"san":"O-O","fen":"r.bqr.k.pp.nbppp..p..n.....p..B....P......NBP...PPQ.NPPPR....RK.","from":"e1","to":"g1","note":"White is fully developed and now commits to the plan.","num":"10.O-O","turn":"w","check":false,"arrows":[{"f":"e1","t":"g1","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Nf8","fen":"r.bqrnk.pp..bppp..p..n.....p..B....P......NBP...PPQ.NPPPR....RK.","from":"d7","to":"f8","note":"Black's standard defensive manoeuvre: the knight heads for g6 or e6 to guard the kingside.","num":"10...Nf8","turn":"b","check":false,"arrows":[{"f":"d7","t":"f8","k":"move"},{"f":"f8","t":"h7","k":"def"},{"f":"f8","t":"e6","k":"ctrl"}],"tactics":"Defends the pawn on h7; controls e6"},{"san":"Rab1","fen":"r.bqrnk.pp..bppp..p..n.....p..B....P......NBP...PPQ.NPPP.R...RK.","from":"a1","to":"b1","note":"The minority attack begins. White will play b4, then a4, then b5 \u2014 attacking Black's three queenside pawns with two. When the pawns trade on c6, Black is left with a backward c-pawn on an open file, and White wins it in the endgame. That is the plan for the next twenty moves.","num":"11.Rab1","turn":"w","check":false,"arrows":[{"f":"a1","t":"b1","k":"move"}],"tactics":"a repositioning move"}]},{"name":"Queen's Gambit Declined \u2014 Tartakower","note":"Black's most reliable equalising system. Fianchetto the bishop and trade pieces.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","nu :"def"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Defends the pawn on d5; controls e4"},{"san":"Bg5","fen":"rnbqkb.rppp..ppp....pn.....p..B...PP......N.....PP..PPPPR..QKBNR","from":"c1","to":"g5","note":"The classical development, pinning the knight and pressuring d5 indirectly.","num":"4.Bg5","turn":"w","check":false,"arrows":[{"f":"c1","t":"g5","k":"move"},{"f":"g5","t":"f6","k":"atk"},{"f":"g5","t":"f4","k":"ctrl"},{"f":"g5","t":"e3","k":"ctrl"}],"tactics":"Attacks the knight on f6; controls f4 and e3"},{"san":"Be7","fen":"rnbqk..rppp.bppp....pn.....p..B...PP......N.....PP..PPPPR..QKBNR","from":"f8","to":"e7","note":"Breaking the pin by interposing. Black's setup is passive but extremely tough.","num":"4...Be7","turn":"b","check":false,"arrows":[{"f":"f8","t":"e7","k":"move"},{"f":"e7","t":"f6","k":"def"},{"f":"e7","t":"c5","k":"ctrl"},{"f":"e7","t":"d6","k":"ctrl"}],"tactics":"Defends the knight on f6; controls c5 and d6"},{"san":"e3","fen":"rnbqk..rppp.bppp....pn.....p..B...PP......N.P...PP...PPPR..QKBNR","from":"e2","to":"e3","note":"Solid: supports d4, opens the bishop. White is not in a hurry.","num":"5.e3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"},{"f":"e3","t":"f4","k":"ctrl"}],"tactics":"Controls f4"},{"san":"O-O","fen":"rnbq.rk.ppp.bppp....pn.....p..B...PP......N.P...PP...PPPR..QKBNR","from":"e8","to":"g8","note":"King safety.","num":"5...O-O","turn":"b","check":false,"arrows":[{"f":"e8","t":"g8","k":"move"}],"tactics":"castles \u2014 tucks the king to safety and connects the rooks"},{"san":"Nf3","fen":"rnbq.rk.ppp.bppp....pn.....p..B...PP......N.PN..PP...PPPR..QKB.R","from":"g1","to":"f3","note":"Development. White is in no hurry: every piece has an obvious square and there is nothing to attack.","num":"6.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"ctrl"}],"tactics":"Controls e5"},{"san":"h6","fen":"rnbq.rk.ppp.bpp.....pn.p...p..B...PP......N.PN..PP...PPPR..QKB.R","from":"h7","t :"ctrl"}],"tactics":"Attacks the pawn on d4 and the bishop on g5 (undefended!); controls c5 and f4"},{"san":"Bxf6","fen":"r.bqr.k.pp..bppp..p.nB.....p.......P......NBP...PPQ.NPPP.R...RK.","from":"g5","to":"f6","note":"White trades off the good bishop to remove a defender of the queenside dark squares and to gain a tempo.","num":"12.Bxf6","turn":"w","check":false,"arrows":[{"f":"g5","t":"f6","k":"move"},{"f":"f6","t":"d4","k":"def"},{"f":"f6","t":"e7","k":"atk"},{"f":"f6","t":"g7","k":"atk"},{"f":"f6","t":"e5","k":"ctrl"}],"tactics":"Attacks the bishop on e7 and the pawn on g7; defends the pawn on d4; controls e5"},{"san":"Bxf6","fen":"r.bqr.k.pp...ppp..p.nb.....p.......P......NBP...PPQ.NPPP.R...RK.","from":"e7","to":"f6","note":"Black recaptures with the bishop, which now looks impressive on the long diagonal but does nothing about the coming pawns.","num":"12...Bxf6","turn":"b","check":false,"arrows":[{"f":"e7","t":"f6","k":"move"},{"f":"f6","t":"d4","k":"atk"},{"f":"f6","t":"e5","k":"ctrl"}],"tactics":"Attacks the pawn on d4; controls e5"},{"san":"b4","fen":"r.bqr.k.pp...ppp..p.nb.....p.....P.P......NBP...P.Q.NPPP.R...RK.","from":"b2","to":"b4","note":"The minority attack begins. Two pawns are about to advance against three.","num":"13.b4","turn":"w","check":false,"arrows":[{"f":"b2","t":"b4","k":"move"},{"f":"b4","t":"c5","k":"ctrl"}],"tactics":"Controls c5"},{"san":"a6","fen":"r.bqr.k..p...pppp.p.nb.....p.....P.P......NBP...P.Q.NPPP.R...RK.","from":"a7","to":"a6","note":"Black stops b5 for a moment and prepares to meet it.","num":"13...a6","turn":"b","check":false,"arrows":[{"f":"a7","t":"a6","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"a4","fen":"r.bqr.k..p...pppp.p.nb.....p....PP.P......NBP.....Q.NPPP.R...RK.","from":"a2","to":"a4","note":"White simply prepares b5 again. The attack cannot be stopped, only delayed \u2014 that is why it is such a reliable plan.","num":"14.a4","turn":"w","check":false,"arrows":[{"f":"a2","t":"a4","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"Bd7","fen":"r..qr.k..p.b.pppp.p.nb.....p....PP.P......NBP.....Q.NPPP.R...RK.","from":"c8","to":"d7","note":"Black develops and prepares to defend c6 with pieces.","num":"14...Bd7","turn":"b","check":false,"arrows":[{"f":"c8","t":"d7","k":"move"}],"tactics":"develops a piece toward the centre"},{"san":"b5","fen":"r..qr.k..p.b.pppp.p.nb...P.p....P..P......NBP.....Q.NPPP.R...RK.","from":"b4","to":"b5","note":"The break arrives.","num":"15.b5","turn":"w","check":false,"arrows":[{"f":"b4","t":"b5","k":"move"},{"f":"b5","t":"a6","k":"atk"},{"f":"b5","t":"c6","k":"atk"}],"tactics":"Attacks the pawn on a6 and the pawn on c6"},{"san":"axb5","fen":"r..qr.k..p.b.ppp..p.nb...p.p....P..P......NBP.....Q.NPPP.R...RK.","from":"a6","to":"b5","note":"Black must take, otherwise bxc6 comes anyway with an extra tempo.","num":"15...axb5","turn":"b","check":false,"arrows":[{"f":"a6","t":"b5","k":"move"},{"f":"b5","t":"a4","k":"atk"},{"f":"b5","t":"c4","k":"ctrl"}],"tactics":"Attacks the pawn on a4; controls c4"},{"san":"axb5","fen":"r..qr.k..p.b.ppp..p.nb...P.p.......P......NBP.....Q.NPPP.R...RK.","from":"a4","to":"b5","note":"Recapturing, and now the a-file is open too \u2014 a second front that Black did not ask for.","num":"16.axb5","turn":"w","check":false,"arrows":[{"f":"a4","t":"b5","k":"move"},{"f":"b5","t":"c6","k":"atk"}],"tactics":"Attacks the pawn on c6"},{"san":"Ra3","fen":"...qr.k..p.b.ppp..p.nb...P.p.......P....r.NBP.....Q.NPPP.R...RK.","from":"a8","to":"a3","note":"Black grabs the open file first. Good defence: activity is the only real answer to a structural attack.","num":"16...Ra3","turn":"b","check":false,"arrows":[{"f":"a8","t":"a3","k":"move"},{"f":"a3","t":"c3","k":"atk"}],"tactics":"Attacks the knight on c3"},{"san":"bxc6","fen":"...qr.k..p.b.ppp..P.nb.....p.......P....r.NBP.....Q.NPPP.R...RK.","from":"b5","to":"c6","note":"The point of the whole plan. White exchanges two pawns for one and hands Black a permanent problem.","num":"17.bxc6","turn":"w","check":false,"arrows":[{"f":"b5","t":"c6","k":"move"},{"f":"c6","t":"b7","k":"atk"},{"f":"c6","t":"d7","k":"atk"}],"tactics":"Attacks the pawn on b7 (undefended!) and the bishop on d7"},{"san":"bxc6","fen":"...qr.k....b.ppp..p.nb.....p.......P....r.NBP.....Q.NPPP.R...RK.","from":"b7","to":"c6","note":"Forced. Black now has a backward pawn on c6, sitting on a half-open file, unable ever to be defended by another pawn.","num":"17...bxc6","turn":"b","check":false,"arrows":[{"f":"b7","t":"c6","k":"move"},{"f":"c6","t":"d5","k":"def"}],"tactics":"Defends the pawn on d5"},{"san":"Nc1","fen":"...qr.k....b.ppp..p.nb.....p.......P....r.NBP.....Q..PPP.RN..RK.","from":"e2","to":"c1","note":"The knight redeploys toward b3 and a5 or d3 and c5, to attack the pawn White just created. Everything from here is technique: pile on c6, trade into an endgame, win the pawn. This plan has decided thousands of grandmaster games.","num":"18.Nc1","turn":"w","check":false,"arrows":[{"f":"e2","t":"c1","k":"move"}],"tactics":"develops a piece toward the centre"}]}],"progression":{"arc":"The Queen's Gambit is the best strategic education in chess. Learn it and you will understand pawn structures for the rest of your life.","stages":[{"tier":"Foundation","when":"Weeks one to two","goal":"Know why the pawn cannot be held and get a healthy position against each defence.","learn":["Why 2...dxc4 does not win a pawn: 3.e3 b5? 4.a4 c6 5.axb5 cxb5 6.Qf3! forks a8 and b7.","Your basic setup against the Declined: Nc3, Nf3, Bg5, e3, Bd3, Qc2, O-O. Same seven moves nearly every game.","The three main defences you will actually face: 2...e6 (Declined), 2...c6 (Slav), 2...dxc4 (Accepted)."],"drill":"Play twenty games with the Exchange Variation. One structure, one plan, endless repetition \u2014 this is the fastest way to improve at chess.","mistake":"Playing cxd5 at random. The Exchange is a commitment: you get a clear plan and Black gets the e-file and a free hand on the kingside.","ready":"You can set up the seven-move scheme against any Black move order."},{"tier":"Structure","when":"Weeks three to eight","goal":"Master the Carlsbad structure. It is the single most valuable structure in chess.","learn":["The pawn skeleton: White a2-b2-c3-d4-e3 against Black a7-b7-c6-d5-f7. Learn to recognise it from any move order.","Why White plays on the queenside and Black on the kingside: your pawns point that way, and pawns decide where you attack.","The knight to e2 rather than f3 \u2014 it keeps the f-pawn free and allows Ng3 or Nf4."],"drill":"Set up the Carlsbad and play only the minority attack: b4, a4, b5, bxc6. Do it ten times. Feel how the backward c-pawn appears.","mistake":"Starting the minority attack before your pieces are placed. Rab1 and Qc2 come first, then the pawns.","ready":"You can draw the Carlsbad structure from memory and name both sides' plans."},{"tier":"Plans","when":"Months two to five","goal":"Learn the four plans available in the Carlsbad and how to choose between them.","learn":["Plan A, the minority attack (b4\u2013b5) \u2014 the workhorse.","Plan B, the central break e3\u2013e4 \u2014 stronger when Black has committed to a kingside attack.","Plan C, the kingside pawn storm with f3 and g4 \u2014 for when Black's minor pieces have left that wing.","Plan D, piece pressure on the c-file with Rc1, Na4 and Nc5."],"drill":"Take the position after 11.Rab1 and play each of the four plans once against an engine. Note which one it defends worst.","mistake":"Switching plans halfway. Each plan commits pawns, and pawns do not come back.","ready":"You choose your plan based on where Black's pieces are, not on habit."},{"tier":"Mastery","when":"Ongoing","goal":"Cover the whole 1.d4 d5 landscape and the resulting endgames.","learn":["The Queen's Gambit Accepted, including the isolated-queen's-pawn positions that come with it.","The Slav and Semi-Slav \u2014 you will face them constantly, and the Meran and Botvinnik lines are theory-heavy.","Rook endgames with a queenside majority. Most Carlsbad games end there."],"drill":"Study twenty of Botvinnik's or Karpov's Carlsbad games. Cover the moves and guess each one.","mistake":"Neglecting the Slav because the Declined is more common in books. In practice the Slav is everywhere.","ready":"You have a prepared answer to 2...e6, 2...c6, 2...dxc4 and 2...Nf6."}],"study":"Capablanca and Botvinnik for the classical minority attack, Karpov for the modern squeeze, Kramnik and Ding Liren for the current treatment.","next":"Add the Catalan. It uses the same c4/d4 pawns with a different bishop and gives you a second, quieter way to play for a win."}},{"id":"london","name":"London System","eco":"D02 / A46","section":"white-d4","orientation":"white","tagline":"One setup against almost anything. The lowest-theory way to play 1.d4 well.","level":"Beginner \u2192 Grandmaster","theory":{"big_idea":"White plays the same first five or six moves regardless of what Black does: d4, Bf4, e3, Nf3, c3, Bd3 (and often Nbd2, h3, O-O). The bishop gets outside the pawn chain before e3 locks it in \u2014 this is the single most important move-order point in the whole system. The result is a solid, flexible position with no weaknesses, from which White plays either Ne5 with a kingside attack or a slow queenside expansion.","structure":"White pawns on d4, e3, c3 form a small pyramid \u2014 extremely hard to attack. The dark-squared bishop sits outside on f4 or g3 controlling the b8\u2013h2 diagonal. The signature attacking pattern is Ne5, f4, Qf3\u2013h3 and Rf3\u2013h3, throwing pieces at h7.","white_plans":["Plant a knight on e5, support it with f4 and Nd2\u2013f3, then swing the queen and rook to the h-file.","Trade dark-squared bishops on d6, then use the resulting dark-square control and pressure on c7/e5.","Queenside expansion with b4, a4 and Nb3\u2013c5, especially when Black castles kingside and plays ...c5.","The 'Barry/Jobava' aggressive version: Nc3 and e4 for a fast central break."],"black_plans":["Hit d4 immediately with ...c5 and ...Qb6 pressuring b2 \u2014 the sharpest test of the system.","Play ...Bd6 to trade off White's good bishop, then ...Qxd6 and ...e5.","Set up a King's Indian structure with ...g6, ...Bg7, ...d6, ...Nbd7 and break with ...e5.","Develop the c8-bishop early with ...Bf5 before ...e6 \u2014 the mirror image of White's own idea."],"traps":["If White plays e3 before Bf4, the bishop is stuck behind the pawn chain \u2014 this is the mistake that turns a good London into a bad one.","After ...Qb6 hitting b2, White should not panic: Qb3, Nc3 (offering the pawn) or Qc1 all hold. Grabbing with ...Qxb2 often costs Black the queen after Nb5 and Rb1 ideas.","Watch out for ...Nh5 hitting the f4-bishop. Standard answers: Bg3 or Be5, or pre-empt with h3 and Bh2."],"who":"Play this if you want to spend your study time on middlegames and endgames instead of opening theory. It is genuinely sound \u2014 Carlsen, Kamsky and Gukesh all use it."},"lines":[{"name":"Main Line vs ...e6 \u2014 The Ne5 Attack","note":"The standard London against Black's most common setup, with the classic kingside attacking scheme.","plies":[{"san":"","fen":"rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR","from":null,"to":null,"note":"The starting position. White moves first \u2014 and that single tempo is the whole reason opening theory exists.","num":"","turn":"w"},{"san":"d4","fen":"rnbqkbnrpppppppp...................P............PPP.PPPPRNBQKBNR","from":"d2","to":"d4","note":"The queen's pawn. Unlike 1.e4 it is defended from the start by the queen, which is why 1.d4 openings tend to be slower, tougher and more strategic than tactical.","num":"1.d4","turn":"w","check":false,"arrows":[{"f":"d2","t":"d4","k":"move"},{"f":"d4","t":"e5","k":"ctrl"},{"f":"d4","t":"c5","k":"ctrl"}],"tactics":"Controls e5 and c5"},{"san":"d5","fen":"rnbqkbnrppp.pppp...........p.......P............PPP.PPPPRNBQKBNR","from":"d7","to":"d5","note":"Black mirrors solidly.","num":"1...d5","turn":"b","check":false,"arrows":[{"f":"d7","t":"d5","k":"move"},{"f":"d5","t":"e4","k":"ctrl"},{"f":"d5","t":"c4","k":"ctrl"}],"tactics":"Controls e4 and c4"},{"san":"Bf4","fen":"rnbqkbnrppp.pppp...........p.......P.B..........PPP.PPPPRN.QKBNR","from":"c1","to":"f4","note":"The defining move, and the reason to play the London in this move order. The bishop gets outside the pawn chain before e3 shuts it in.","num":"2.Bf4","turn":"w","check":false,"arrows":[{"f":"c1","t":"f4","k":"move"},{"f":"f4","t":"c7","k":"atk"},{"f":"f4","t":"e5","k":"ctrl"},{"f":"f4","t":"d6","k":"ctrl"}],"tactics":"Attacks the pawn on c7; controls e5 and d6"},{"san":"Nf6","fen":"rnbqkb.rppp.pppp.....n.....p.......P.B..........PPP.PPPPRN.QKBNR","from":"g8","to":"f6","note":"Natural development.","num":"2...Nf6","turn":"b","check":false,"arrows":[{"f":"g8","t":"f6","k":"move"},{"f":"f6","t":"e4","k":"ctrl"}],"tactics":"Controls e4"},{"san":"e3","fen":"rnbqkb.rppp.pppp.....n.....p.......P.B......P...PPP..PPPRN.QKBNR","from":"e2","to":"e3","note":"Now the pawn chain is complete: d4, e3 and soon c3. Small, but there is nothing to attack.","num":"3.e3","turn":"w","check":false,"arrows":[{"f":"e2","t":"e3","k":"move"}],"tactics":"a quiet pawn move, shoring up the structure"},{"san":"e6","fen":"rnbqkb.rppp..ppp....pn.....p.......P.B......P...PPP..PPPRN.QKBNR","from":"e7","to":"e6","note":"Black develops and prepares to challenge with ...c5.","num":"3...e6","turn":"b","check":false,"arrows":[{"f":"e7","t":"e6","k":"move"},{"f":"e6","t":"f5","k":"ctrl"}],"tactics":"Controls f5"},{"san":"Nf3","fen":"rnbqkb.rppp..ppp....pn.....p.......P.B......PN..PPP..PPPRN.QKB.R","from":"g1","to":"f3","note":"Supporting d4 and preparing to castle.","num":"4.Nf3","turn":"w","check":false,"arrows":[{"f":"g1","t":"f3","k":"move"},{"f":"f3","t":"e5","k":"ctrl"}],"tactics":"Controls e5"},{"san":"c5","fen":"rnbqkb.rpp...ppp....pn....pp.......P.B......PN..PPP..PPP
