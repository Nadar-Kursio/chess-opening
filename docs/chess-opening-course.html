    return `<li>
      <span class="pgname">${op.name} <em>${op.lines[li].name}</em></span>
      <span class="pgscore">${r.right}/${r.asked} first try &middot; ${pct}%</span>
      <button class="ctl" data-act="gotoline" data-op="${opId}" data-line="${li}">Open</button>
    </li>`;
  }).join("");

  return `
  <div class="ophead">
    <div class="opkicker"><span>Start here</span><span class="sep">/</span><span>Your progress</span></div>
    <h2 class="opname">Your progress</h2>
    <p class="optag">What you have drilled, and how it went.</p>
  </div>

  <div class="progpage">
    ${dbOK?"":`<p class="warn-note">This browser isn't saving progress — the page was
      opened from a file and storage is blocked. Your session still counts; use Export
      below to keep it.</p>`}
    ${dbFrozen?`<p class="warn-note">This progress was written by a newer version of the
      course, so it is being read but not overwritten.</p>`:""}

    <div class="card">
      <p class="cardhead">Lines drilled</p>
      ${rows ? `<ul class="pglist">${rows}</ul>` : `<p>Nothing yet. Open any opening and
        switch the study panel to Drill.</p>`}
    </div>

    <div class="card">
      <p class="cardhead">Keep or move your progress</p>
      <p>Progress lives in this browser only. Export it to keep a copy, or to carry it
        to another machine.</p>
      <div class="pgacts">
        <button class="ctl" data-act="export">Export</button>
        <button class="ctl" data-act="import">Import</button>
        <button class="ctl" data-act="reset">Reset…</button>
      </div>
      <textarea class="pgbox" id="pgbox" spellcheck="false"
        placeholder="Exported progress appears here. Paste a previous export and press Import."></textarea>
      <p class="pgmsg" id="pgmsg"></p>
    </div>
  </div>`;
}

ACTIONS.gotoline = t=>{
  state.view = "op"; state.opId = t.dataset.op;
  const op = DATA.find(o=>o.id===state.opId);
  state.line = Math.min(+t.dataset.line, op.lines.length-1);
  state.ply = 0;
  state.flip = op.orientation === "black";
  buildRail(); render(); window.scrollTo({top:0,behavior:"instant"});
};
ACTIONS.export = ()=>{
  document.getElementById("pgbox").value = dbExport();
  document.getElementById("pgmsg").textContent = "Copied into the box below — select it all and copy.";
};
ACTIONS.import = ()=>{
  const err = dbImport(document.getElementById("pgbox").value);
  const msg = document.getElementById("pgmsg");
  if(err){ msg.textContent = err; return; }
  // The import replaced the whole store, theme included.
  themeSet(themeResolve(db.ui.theme));
  syncChrome();
  msg.textContent = "Imported.";
  dxSay("Progress imported.");
};
ACTIONS.reset = (t)=>{
  // Two-step rather than a confirm() dialog, which some embedded viewers suppress.
  if(t.dataset.armed !== "1"){
    t.dataset.armed = "1";
    t.textContent = "Really reset?";
    return;
  }
  dbReset();
  // A reset drops the stored choice, so the page goes back to following the
  // system rather than sitting on a theme nothing records any more.
  themeSet(themeResolve(db.ui.theme));
  syncChrome();
  render();
  dxSay("Progress reset.");
};

/* ---------------- sidebar ---------------- */
function buildRail(){
  const rail = document.getElementById("rail");
  const sel  = document.getElementById("mobsel");
  let html = "", opts = "";

  html += `<div class="railgroup">
    <div class="railhead"><span class="glyph">\u2637</span> Start here</div>
    <button class="railitem${state.view==="primer"?" on":""}" data-go="primer">
      How openings actually work<span class="eco">Principles &middot; glossary</span></button>
    <button class="railitem${state.view==="progress"?" on":""}" data-go="progress">
      Your progress<span class="eco">Scores &middot; export</span></button>
  </div>`;
  opts += `<option value="primer"${state.view==="primer"?" selected":""}>How openings actually work</option>`;
  opts += `<option value="progress"${state.view==="progress"?" selected":""}>Your progress</option>`;

  let lastGroup = "";
  SECTIONS.forEach(sec=>{
    const ops = DATA.filter(o=>o.section===sec.id);
    if(sec.group!==lastGroup){
      html += `<div class="railgroup"><div class="railhead"><span class="glyph">${sec.glyph}</span> ${sec.group}</div>`;
      opts += `<optgroup label="${sec.group}">`;
      lastGroup = sec.group;
    }
    html += `<div class="railsub">${sec.label}</div>`;
    ops.forEach(o=>{
      const on = state.view==="op" && state.opId===o.id;
      const lv = opLevel(o);
      const tag = DX_LEVELS[lv].tag;
      html += `<button class="railitem${on?" on":""}" data-go="${o.id}" title="${opLevelTitle(o)}">`
            + `<span class="railtop">${o.name}<b class="lvtag lv${lv}">${tag}</b></span>`
            + `<span class="eco">${o.eco}</span></button>`;
      opts += `<option value="${o.id}"${on?" selected":""}>${sec.label} — ${o.name} · ${tag}</option>`;
    });
    const nextGroup = SECTIONS[SECTIONS.indexOf(sec)+1];
    if(!nextGroup || nextGroup.group!==sec.group){ html += `</div>`; opts += `</optgroup>`; }
  });

  // Both groups vanish entirely when their data is empty, so the rail is
  // unchanged until an opening actually ships structures or games.
  if(STRUCTURES.length){
    html += `<div class="railgroup"><div class="railhead"><span class="glyph">⬒</span> Pawn structures</div>`;
    opts += `<optgroup label="Pawn structures">`;
    STRUCTURES.filter(s=>tierVisible(s.tier)).forEach(s=>{
      const on = state.view==="structure" && state.structId===s.id;
      html += `<button class="railitem${on?" on":""}" data-go="structure:${s.id}">${s.name}</button>`;
      opts += `<option value="structure:${s.id}"${on?" selected":""}>${s.name}</option>`;
    });
    html += `</div>`; opts += `</optgroup>`;
  }
  if(GAMES.length){
    html += `<div class="railgroup"><div class="railhead"><span class="glyph">♟</span> Model games</div>`;
    opts += `<optgroup label="Model games">`;
    GAMES.filter(g=>tierVisible(g.tier)).forEach(g=>{
      const on = state.view==="game" && state.gameId===g.id;
      html += `<button class="railitem${on?" on":""}" data-go="game:${g.id}">${g.name}</button>`;
      opts += `<option value="game:${g.id}"${on?" selected":""}>${g.name}</option>`;
    });
    html += `</div>`; opts += `</optgroup>`;
  }

  rail.innerHTML = html;
  sel.innerHTML = opts;
  rail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  sel.onchange = ()=>go(sel.value);
}

function go(id){
  stopPlay();
  state.branch = null;
  state.pick = false;
  state.sel = null;
  if(id==="primer" || id==="progress"){ state.view=id; }
  else if(id.indexOf("structure:")===0){ state.view="structure"; state.structId=id.slice(10); }
  else if(id.indexOf("game:")===0){
    state.view="game"; state.gameId=id.slice(5); state.ply=0; state.flip=false;
  }
  else { state.view="op"; state.opId=id; state.line=0; state.ply=0;
         state.flip = DATA.find(o=>o.id===id).orientation==="black"; }
  dbRemember();
  buildRail(); render();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------------- board ---------------- */
/* Pure HTML/CSS: an 8x8 grid of divs inside a square wrapper.
   Rows and columns are both 1fr of a definite-height square box, so every
   square is mathematically equal. No SVG, no aspect-ratio, no container queries. */
function boardCells(fen, from, to, checkSide, flip){
  let out = "";
  const order = [];
  for(let i=0;i<64;i++) order.push(i);
  if(flip) order.reverse();

  order.forEach((i, pos)=>{
    const file = i%8, rank = 7-((i/8)|0);
    const name = FILES[file] + (rank+1);
    const light = (file+rank)%2===1;
    const cls = ["sq", light ? "l" : "d"];
    if(name===from || name===to) cls.push("hl");
    const ch = fen[i];
    let extra = "";
    if(ch!=="."){
      const isW = ch===ch.toUpperCase();
      if(checkSide && ch.toLowerCase()==="k" && (isW?"w":"b")===checkSide) cls.push("chk");
      extra = `<span class="pc ${isW?"wp":"bp"}${name===to?" moved":""}">${GLYPH[ch.toLowerCase()]}</span>`;
    }
    const col = pos%8, row = (pos/8)|0;
    // Labels always show the square's TRUE file/rank; flipping changes position, not identity.
    let co = "";
    if(row===7) co += `<span class="coord f">${FILES[file]}</span>`;
    if(col===0) co += `<span class="coord r">${rank+1}</span>`;
    out += `<div class="${cls.join(" ")}" data-sq="${name}">${co}${extra}</div>`;
  });
  return `<div class="board" id="board">${out}</div>`;
}

/* Size the pieces to the actual rendered square, so they always fit at any board size.
   Runs after every render and on window resize -- pure JS, works in every browser.
   Every board on the page, not just the study board: a page may carry a second
   diagram alongside it. */
function sizeBoard(){
  document.querySelectorAll(".board").forEach(b=>{
    const sq = b.clientWidth / 8;
    if(sq > 0){
      b.style.fontSize = (sq * 0.74) + "px";
      b.querySelectorAll(".coord").forEach(c=>{ c.style.fontSize = Math.max(7, sq*0.16) + "px"; });
    }
  });
}
window.addEventListener("resize", sizeBoard);

/* ---- Canvas arrow overlay (chess.com-style). Robust: uses Canvas 2D, not SVG. ---- */
const ARROW_COLORS = {
  atk:  "rgba(210,75,60,0.82)",
  def:  "rgba(78,138,214,0.80)",
  move: "rgba(124,163,90,0.72)",
  chk:  "rgba(234,59,51,0.92)",
  ctrl: "rgba(224,180,74,0.85)"
};
const ARROW_ON = { move:true, atk:true, chk:true, def:true, ctrl:true };

// Bold the square coordinates inside the auto-generated tactics sentence.
function tacticsHTML(t){
  t = t.charAt(0).toUpperCase() + t.slice(1);
  return t.replace(/\b([a-h][1-8])\b/g, "<b>$1</b>");
}

function sqCenter(name, sq, flip){
  const file = FILES.indexOf(name[0]), rank = (+name[1]) - 1;
  const col = flip ? 7-file : file;
  const row = flip ? rank  : 7-rank;
  return { x:(col+0.5)*sq, y:(row+0.5)*sq };
}
function colrow(name, flip){
  const file = FILES.indexOf(name[0]), rank = (+name[1]) - 1;
  return { col: flip ? 7-file : file, row: flip ? rank : 7-rank };
}
function center(cr, sq){ return { x:(cr.col+0.5)*sq, y:(cr.row+0.5)*sq }; }

function drawArrows(){
  const cv = document.getElementById("arrowlayer");
  const board = document.getElementById("board");
  if(!cv || !board) return;
  const size = board.clientWidth;
  if(!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = size * dpr; cv.height = size * dpr;
  cv.style.width = size + "px"; cv.style.height = size + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  if(!state.arrows) return;

  const ply = curPly();
  const arrows = (ply && ply.arrows) || [];
  const sq = size/8;

  // draw control rings first (under the lines)
  arrows.filter(a=>a.k==="ctrl" && ARROW_ON.ctrl).forEach(a=>{
    const c = sqCenter(a.t, sq, state.flip);
    ctx.beginPath();
    ctx.arc(c.x, c.y, sq*0.34, 0, Math.PI*2);
    ctx.lineWidth = Math.max(2, sq*0.05);
    ctx.strokeStyle = ARROW_COLORS.ctrl;
    ctx.setLineDash([sq*0.14, sq*0.10]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // then the arrows, move first (so attack/check sit on top)
  const order = {move:0, def:1, atk:2, chk:3};
  arrows.filter(a=>a.k!=="ctrl" && ARROW_ON[a.k])
        .sort((a,b)=>(order[a.k]||0)-(order[b.k]||0))
        .forEach(a=>{
    const color = ARROW_COLORS[a.k]||"#999";
    const width = a.k==="chk" ? sq*0.16 : (a.k==="move" ? sq*0.10 : sq*0.13);
    const A = colrow(a.f, state.flip), B = colrow(a.t, state.flip);
    const dcol = Math.abs(A.col-B.col), drow = Math.abs(A.row-B.row);
    const isKnight = (dcol===1 && drow===2) || (dcol===2 && drow===1);
    if(isKnight){
      drawBentArrow(ctx, A, B, color, width, sq);   // L-shaped, chess.com style
    } else {
      const p1 = center(A, sq), p2 = center(B, sq);
      drawArrow(ctx, p1.x, p1.y, p2.x, p2.y, color, width, sq);
    }
  });
}

function arrowHead(ctx, tipx, tipy, ux, uy, head){
  const ang = Math.atan2(uy, ux), a = 0.42;
  ctx.beginPath();
  ctx.moveTo(tipx, tipy);
  ctx.lineTo(tipx - head*Math.cos(ang-a), tipy - head*Math.sin(ang-a));
  ctx.lineTo(tipx - head*Math.cos(ang+a), tipy - head*Math.sin(ang+a));
  ctx.closePath(); ctx.fill();
}

function drawArrow(ctx, x1, y1, x2, y2, color, width, sq){
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
  const ux = dx/len, uy = dy/len;
  const head = Math.max(sq*0.28, width*2.4);
  const startGap = sq*0.30, endGap = sq*0.34;
  const sx = x1 + ux*startGap, sy = y1 + uy*startGap;
  const exLine = x2 - ux*(endGap+head*0.55), eyLine = y2 - uy*(endGap+head*0.55);
  const tipx = x2 - ux*endGap, tipy = y2 - uy*endGap;
  ctx.lineCap = "round";
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(exLine,eyLine); ctx.stroke();
  arrowHead(ctx, tipx, tipy, ux, uy, head);
}

// L-shaped knight arrow: long leg (2 squares) first, then the short leg (1 square).
function drawBentArrow(ctx, A, B, color, width, sq){
  const bend = (Math.abs(A.col-B.col)===2) ? {col:B.col, row:A.row}   // long leg horizontal
                                            : {col:A.col, row:B.row};  // long leg vertical
  const pA = center(A, sq), pM = center(bend, sq), pB = center(B, sq);
  const head = Math.max(sq*0.28, width*2.4);
  const startGap = sq*0.30, endGap = sq*0.34;

  // first leg direction (origin -> bend), used only to trim the start
  const d1x = pM.x-pA.x, d1y = pM.y-pA.y, L1 = Math.hypot(d1x,d1y)||1;
  const sx = pA.x + d1x/L1*startGap, sy = pA.y + d1y/L1*startGap;

  // second leg direction (bend -> target), used for the head
  const d2x = pB.x-pM.x, d2y = pB.y-pM.y, L2 = Math.hypot(d2x,d2y)||1;
  const ux2 = d2x/L2, uy2 = d2y/L2;
  const tipx = pB.x - ux2*endGap, tipy = pB.y - uy2*endGap;
  const basex = tipx - ux2*head*0.55, basey = tipy - uy2*head*0.55;

  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(pM.x, pM.y);     // the corner
  ctx.lineTo(basex, basey);   // stop short of the tip
  ctx.stroke();
  arrowHead(ctx, tipx, tipy, ux2, uy2, head);
}

window.addEventListener("resize", drawArrows);

/* ---------------- move helpers ---------------- */
/* No chess rules live here. The build is the only thing that knows legality;
   this file reads the 64-char board string and whatever the build chose to ship
   alongside it. */

/* The board string runs rank 8 first, so index = (7 - rank) * 8 + file --
   the same indexing boardCells() already assumes. */
function mvIdx(sq){
  return (8 - (+sq[1])) * 8 + FILES.indexOf(sq[0]);
}
function mvPieceAt(fen, sq){
  const ch = fen[mvIdx(sq)];
  return ch === "." ? "" : ch;
}
function mvSideOf(ch){ return ch === ch.toUpperCase() ? "w" : "b"; }
function mvIsOwn(fen, sq, side){
  const ch = mvPieceAt(fen, sq);
  return !!ch && mvSideOf(ch) === side;
}

const MV_NAMES = {k:"king", q:"queen", r:"rook", b:"bishop", n:"knight", p:"pawn"};
function mvPieceName(ch){ return MV_NAMES[String(ch).toLowerCase()] || "piece"; }

/* `legal` is fixed-width 4-char UCI records. A match has to land on a record
   boundary: a plain indexOf would happily match the tail of one move against the
   head of the next and call an illegal move legal. */
function mvIsLegal(ply, from, to){
  if(!ply || !ply.legal) return null;        // this line ships no legal data
  const i = ply.legal.indexOf(from + to);
  return i >= 0 && i % 4 === 0;
}
function mvTargets(ply, from){
  const out = [];
  if(!ply || !ply.legal) return out;
  for(let i=0;i<ply.legal.length;i+=4){
    if(ply.legal.slice(i, i+2) === from) out.push(ply.legal.slice(i+2, i+4));
  }
  return out;
}

/* Castling can be expressed either way -- king two squares, or king onto its own
   rook. They are the same move, and the data records the king's from/to. */
function mvNormalise(fen, from, to){
  const p = mvPieceAt(fen, from), t = mvPieceAt(fen, to);
  if(p && t && p.toLowerCase()==="k" && t.toLowerCase()==="r" && mvSideOf(p)===mvSideOf(t)){
    return [from, (to[0] === "h" ? "g" : "c") + from[1]];
  }
  return [from, to];
}

/* Enough of a move name to quote the learner's attempt back at them. Not real
   SAN -- no disambiguation, no check marks -- and it never needs to be, because
   it only ever appears inside feedback. */
function mvName(fen, from, to){
  const ch = mvPieceAt(fen, from);
  if(!ch) return to;
  const kind = ch.toLowerCase();
  const takes = mvPieceAt(fen, to) !== "";
  if(kind === "k" && Math.abs(FILES.indexOf(to[0]) - FILES.indexOf(from[0])) === 2){
    return FILES.indexOf(to[0]) > FILES.indexOf(from[0]) ? "O-O" : "O-O-O";
  }
  if(kind === "p") return (takes ? from[0] + "x" : "") + to;
  return ch.toUpperCase() + (takes ? "x" : "") + to;
}

/* ---------------- drill ---------------- */
/* Move first, then read. The next move is hidden and you play it on the board;
   the explanation arrives as the answer to your attempt rather than as a preamble
   to it.

   How sharp the feedback can be depends on what the build shipped for the line:
     0  exact match only. A wrong move is "not the move this line plays" -- never
        "illegal", because with no legal-move list we genuinely cannot tell.
     1  `legal` present: real illegal-move rejection, and target hints.
     2  `branches` present: the author's reply to the move you actually played.
   Level 0 needs no content work, so every opening in the catalogue is drillable
   today and simply gets better as data lands. */
function dxLevel(line){
  const p = line.plies;
  for(let i=0;i<p.length;i++) if(p[i].bx !== undefined) return 2;
  for(let i=0;i<p.length;i++) if(p[i].legal) return 1;
  return 0;
}
/* One vocabulary for the depth of feedback, used by the sidebar badge and the
   study panel alike. Naming them for what they DO avoids calling the shallow
   end unfinished: a Core line drills perfectly well, it just cannot tell an
   illegal move from a merely off-book one, and it says so. */
const DX_LEVELS = [
  {tag:"Core",
   blurb:"drills the line; cannot yet tell an illegal move from an off-book one"},
  {tag:"Checked",
   blurb:"knows every legal move, so it tells an illegal move from an off-book one"},
  {tag:"Coached",
   blurb:"answers the move you actually played"},
];

/* An opening is only as good as its weakest line -- claiming Coached because
   one line out of four is would be a promise the other three break. */
function opLevel(op){
  return op.lines.reduce((low, line)=>Math.min(low, dxLevel(line)), 2);
}

function opLevelTitle(op){
  const lv = opLevel(op);
  const devs = (op.branchsets || []).reduce((n,s)=>n+s.length, 0);
  return `${DX_LEVELS[lv].tag} — ${DX_LEVELS[lv].blurb}`
       + (devs ? `, with ${devs} deviations written` : "");
}

let dxTimer = null;

function dxOn(){ return state.view === "op" && state.mode === "drill"; }
function dxAsking(){ return dxOn() && state.drill.phase === "ask"; }
function dxHideArrows(){ return dxAsking(); }

function dxOp(){ return DATA.find(o=>o.id===state.opId); }
function dxLine(){ const op = dxOp(); return op && op.lines[state.line]; }
function dxSide(){ const op = dxOp(); return op && op.orientation === "black" ? "b" : "w"; }

/* The move the learner is being asked for: the one after the position on screen. */
function dxAnswer(){ return curSeq()[state.ply + 1] || null; }

function dxLearnerPlies(line){
  const side = dxSide();
  return line.plies.filter((p,i)=>i>0 && p.turn===side).length;
}

function dxSetMode(mode){
  stopPlay();
  state.mode = mode;
  state.sel = null;
  db.ui.mode = mode;
  if(mode === "drill") dxStart();
  else { state.drill.phase = "ask"; render(); }
  dbSave();
}

function dxStart(){
  const d = state.drill;
  d.phase = "ask"; d.hint = 0; d.tries = 0; d.seen = {};
  d.msg = ""; d.tone = ""; d.cursor = state.flip ? "e5" : "e4";
  d.streak = db.streak.cur | 0;
  state.ply = 0;
  state.sel = null;
  dxAdvanceToAsk();
  render();
  dxSay("Drill started. Play the move on the board.");
}

/* Play the opponent's moves for them until it is the learner's turn again.
   In an opening line that is exactly one move, but the loop is what makes the
   function correct rather than the alternation happening to hold. */
function dxAdvanceToAsk(){
  const side = dxSide();
  let next = dxAnswer();
  while(next && next.turn !== side){
    state.ply += 1;
    next = dxAnswer();
  }
  if(next) state.drill.phase = "ask";
  else dxFinish();
}

function dxFinish(){
  const d = state.drill;
  const line = dxLine();
  const asked = dxLearnerPlies(line);
  const right = Object.keys(d.seen).filter(k=>d.seen[k]==="right").length;
  const hints = Object.keys(d.seen).filter(k=>d.seen[k]==="assisted").length;
  const key = dbLineKey(state.opId, state.line);
  const prev = db.lines[key];
  const score = asked ? right / asked : 0;
  db.lines[key] = {
    asked, right, hints, done:true,
    best: Math.max(score, (prev && prev.best) || 0),
  };
  db.streak.cur = d.streak;
  dbSave();
  syncChrome();
  d.phase = "done";
}

/* ---- attempts ---- */

function dxTry(from, to){
  if(!dxOn() || state.drill.phase === "done") return;
  const here = curSeq()[state.ply];
  const answer = dxAnswer();
  if(!answer) return;

  const pair = mvNormalise(here.fen, from, to);
  from = pair[0]; to = pair[1];

  if(from === answer.from && to === answer.to){ dxRight(answer); return; }

  if(mvIsLegal(here, from, to) === false){ dxNope(here, from, to); return; }

  // An authored deviation answers the move actually played, which is the whole
  // point -- a generic "wrong" is what the level-0 fallback below is for.
  const hit = brMatch(state.ply, from, to);
  if(hit >= 0){
    state.drill.tries += 1;
    state.drill.streak = 0;
    db.streak.cur = 0;
    if(state.drill.seen[state.ply + 1] === undefined) state.drill.seen[state.ply + 1] = "wrong";
    brEnter(state.ply, hit, "drill");
    return;
  }
  dxWrong(here, from, to);
}

function dxRight(answer){
  const d = state.drill;
  const clean = d.tries === 0 && d.hint === 0;
  if(d.seen[state.ply + 1] === undefined) d.seen[state.ply + 1] = clean ? "right" : "assisted";
  if(clean){
    d.streak += 1;
    if(d.streak > (db.streak.best | 0)) db.streak.best = d.streak;
  }
  db.streak.cur = d.streak;
  state.sel = null;
  state.ply += 1;
  d.phase = "right"; d.tries = 0; d.hint = 0;
  d.msg = ""; d.tone = "ok";
  render();
  dxSay("Correct. " + answer.num + ".");
}

/* Legal but not this line's move. Deliberately not an error: most deviations are
   simply playable, and treating every one as a mistake teaches the wrong reflex.
   The author's specific answer arrives at level 2. */
function dxWrong(here, from, to){
  const d = state.drill;
  d.tries += 1;
  d.streak = 0;
  db.streak.cur = 0;
  if(d.seen[state.ply + 1] === undefined) d.seen[state.ply + 1] = "wrong";
  const name = mvName(here.fen, from, to);
  const level = dxLevel(dxLine());
  d.phase = "wrong";
  d.tone = level >= 1 ? "flat" : "warn";
  d.msg = level >= 1
    ? `<b>${name}</b> is legal — it just isn't the move this line teaches. ${dxPrinciple(here, from, to)}`
    : `<b>${name}</b> is not the move this line plays. Try another, or take a hint.`;
  state.sel = null;
  render();
  dxSay(name + ". Not this line's move.");
}

function dxNope(here, from, to){
  const d = state.drill;
  d.phase = "wrong";
  d.tone = "bad";
  d.msg = `That isn't a legal move here.`;
  state.sel = null;
  render();
  const sq = document.querySelector(`[data-sq="${to}"]`);
  if(sq){ sq.classList.add("dxnope"); setTimeout(()=>sq.classList.remove("dxnope"), 450); }
  dxSay("Not a legal move.");
}

/* True, and derivable from the board alone -- no authoring. The point is to tell
   a learner who has just played something reasonable that it WAS reasonable. */
function dxPrinciple(here, from, to){
  const ch = mvPieceAt(here.fen, from);
  const kind = String(ch).toLowerCase();
  const home = /^[a-h][18]$/.test(from);
  if(mvPieceAt(here.fen, to)) return "Taking material is rarely wrong; this line has a bigger idea in mind.";
  if(kind === "q" && state.ply < 8) return "Bringing the queen out this early usually costs time once it is attacked.";
  if(kind === "k") return "Moving the king before castling gives up the right to castle.";
  if((kind === "n" || kind === "b") && home) return "Developing a piece toward the centre is rarely wrong.";
  if(kind === "p") return "A quiet pawn move is playable — just slower than what this line wants.";
  return "Playable. This line has a specific idea in mind instead.";
}

/* ---- hints ---- */

function dxHint(){
  const d = state.drill;
  if(!dxOn() || d.phase === "done") return;
  if(d.hint >= 3){ return; }
  d.hint += 1;
  if(d.hint === 3){ dxShow(); return; }
  d.phase = "ask";
  render();
  dxSay(d.hint === 1 ? "Hint: which piece." : "Hint: the idea.");
}

function dxShow(){
  const d = state.drill;
  const answer = dxAnswer();
  if(!answer) return;
  if(d.seen[state.ply + 1] === undefined) d.seen[state.ply + 1] = "assisted";
  d.streak = 0;
  db.streak.cur = 0;
  state.sel = null;
  state.ply += 1;
  d.phase = "reveal"; d.hint = 0; d.tries = 0;
  d.msg = ""; d.tone = "flat";
  render();
  dxSay("The move is " + answer.san + ".");
}

function dxContinue(){
  const d = state.drill;
  if(d.phase === "done") return;
  d.msg = ""; d.tone = ""; d.hint = 0; d.tries = 0;
  state.sel = null;
  dxAdvanceToAsk();
  render();
}

function dxRetry(){
  if(!dxOn()) return;
  dxStart();
}

/* Mask the answer inside prose written for a reader who can already see it.
   Necessary, not cosmetic: an Italian note reads "the knight begins its famous
   journey: d2-f1-g3", which hands over the next two moves. */
function dxRedact(text, answer){
  if(!text || !answer) return text;
  let out = String(text);
  if(answer.san) out = out.split(answer.san).join("…");
  if(answer.to) out = out.replace(new RegExp("\\b" + answer.to + "\\b", "g"), "…");
  return out;
}

/* ---- view ---- */

function dxBarHTML(line){
  const level = dxLevel(line);
  return `
      <div class="dxbar">
        <div class="dxmodes" role="tablist" aria-label="Study mode">
          <button class="dxmode${state.mode==="read"?" on":""}" data-act="mode" data-v="read"
            role="tab" aria-selected="${state.mode==="read"}">Read</button>
          <button class="dxmode${state.mode==="drill"?" on":""}" data-act="mode" data-v="drill"
            role="tab" aria-selected="${state.mode==="drill"}"
            title="Play each move before it is shown">Drill</button>
        </div>
        <div class="dxbarend">
          <span class="dxlvl lv${level}" title="How much this line can tell you about a wrong move">${DX_LEVELS[level].tag}<em> — ${DX_LEVELS[level].blurb}</em></span>
          <button class="dxdev${state.pick?" on":""}" data-act="deviate"
            ${state.branch?"disabled":""}>They deviated&hellip; <kbd>D</kbd></button>
        </div>
      </div>`;
}

function dxScoreHTML(line){
  const d = state.drill;
  const asked = dxLearnerPlies(line);
  const done = Object.keys(d.seen).length;
  const right = Object.keys(d.seen).filter(k=>d.seen[k]==="right").length;
  const pct = asked ? Math.round(100 * done / asked) : 0;
  return `
        <div class="dxhead">
          <span class="dxturn">${d.phase==="done" ? "Line complete"
            : `Your move &mdash; <b>${dxSide()==="w"?"White":"Black"}</b>`}</span>
          <span class="dxscore"><b>${right}</b> of <b>${asked}</b> first try
            <span class="sep">&middot;</span> streak <b>${d.streak}</b></span>
        </div>
        <div class="dxprogress" role="progressbar" aria-valuenow="${done}"
          aria-valuemin="0" aria-valuemax="${asked}"><i style="width:${pct}%"></i></div>`;
}

function dxHintsHTML(){
  const d = state.drill;
  const answer = dxAnswer();
  if(!answer || !d.hint) return "";
  const rungs = [];
  if(d.hint >= 1){
    const here = curSeq()[state.ply];
    rungs.push(`<li class="rung">Move your <b>${mvPieceName(mvPieceAt(here.fen, answer.from))}</b>.</li>`);
  }
  if(d.hint >= 2){
    const why = dxRedact(answer.note, answer) || dxRedact(answer.tactics, answer);
    rungs.push(`<li class="rung">${why}</li>`);
  }
  return `<ol class="dxhints">${rungs.join("")}</ol>`;
}

function dxPanelHTML(line){
  const d = state.drill;
  const played = curSeq()[state.ply];

  if(d.phase === "done"){
    const asked = dxLearnerPlies(line);
    const right = Object.keys(d.seen).filter(k=>d.seen[k]==="right").length;
    return `
      <div class="drill" data-phase="done" data-tone="ok">
        ${dxScoreHTML(line)}
        <p class="dxprompt">You played ${right} of ${asked} first time.</p>
        <div class="dxacts">
          <button class="ctl" data-act="retry">Drill again <kbd>R</kbd></button>
          <button class="ctl" data-act="mode" data-v="read">Read this line</button>
        </div>
      </div>`;
  }

  if(d.phase === "right" || d.phase === "reveal"){
    return `
      <div class="drill" data-phase="${d.phase}" data-tone="${d.tone}">
        ${dxScoreHTML(line)}
        <div class="cmtop">
          <span class="cmmove">${played.num}</span>
          <span class="cmwho">${d.phase==="right" ? "You played it" : "Shown to you"}</span>
        </div>
        <p class="cmtext">${played.note}</p>
        ${played.tactics?`<div class="tactics"><span class="lbl">On the board</span><span class="body">${tacticsHTML(played.tactics)}.</span></div>`:""}
        <div class="dxacts">
          <button class="ctl wide" data-act="continue">Continue &#8594; <kbd>↵</kbd></button>
        </div>
      </div>`;
  }

  // asking, or just answered wrongly
  return `
      <div class="drill" data-phase="${d.phase}" data-tone="${d.tone||"flat"}">
        ${dxScoreHTML(line)}
        ${d.msg?`<p class="dxmsg">${d.msg}</p>`:""}
        <p class="dxprompt">Play ${dxSide()==="w"?"White":"Black"}&rsquo;s move on the board.</p>
        ${played.note?`<p class="dxcontext">${dxRedact(played.note, dxAnswer())}</p>`:""}
        ${dxHintsHTML()}
        <div class="dxacts">
          <button class="ctl" data-act="hint">Hint <kbd>H</kbd></button>
          <button class="ctl" data-act="show">Show me <kbd>S</kbd></button>
          <button class="ctl" data-act="retry">Restart line <kbd>R</kbd></button>
        </div>
      </div>`;
}

/* ---- board input ---- */
/* Selection, hover targets and drag are class-only mutations. A render() here
   would delete the node under the pointer mid-drag, and the focused square
   mid-keystroke. */
function dxArm(){
  if(!dxArmed()) return;
  const board = document.getElementById("board");
  if(!board) return;
  board.classList.add("dxlive");
  board.setAttribute("role", "grid");
  const cur = state.drill.cursor;
  board.querySelectorAll("[data-sq]").forEach(sq=>{
    sq.setAttribute("role", "gridcell");
    sq.setAttribute("tabindex", sq.dataset.sq === cur ? "0" : "-1");
  });
  dxPaint();
}

function dxPaint(){
  const board = document.getElementById("board");
  if(!board) return;
  const here = curSeq()[state.ply];
  const targets = state.sel ? mvTargets(here, state.sel) : [];
  board.querySelectorAll("[data-sq]").forEach(sq=>{
    const name = sq.dataset.sq;
    sq.classList.toggle("dxsel", name === state.sel);
    sq.classList.toggle("dxcur", name === state.drill.cursor);
    const isTarget = targets.indexOf(name) >= 0;
    sq.classList.toggle("dxhint", isTarget);
    sq.classList.toggle("dxcap", isTarget && mvPieceAt(here.fen, name) !== "");
  });
}

/* Whose move it is in the position on screen -- which in drill is always the
   learner, and with the deviation picker open is always the opponent. */
function dxMoverSide(){
  const next = curSeq()[state.ply + 1];
  return next ? next.turn : (state.ply % 2 === 0 ? "w" : "b");
}

/* The board is live in two situations, and they want different answers. */
function dxArmed(){
  if(state.branch) return false;
  if(state.pick) return true;
  return dxOn() && (state.drill.phase === "ask" || state.drill.phase === "wrong");
}

function dxBoardMove(from, to){
  if(state.pick) brTry(from, to);
  else dxTry(from, to);
}

/* Read mode: the learner is showing me what the opponent played. */
function brTry(from, to){
  const here = curSeq()[state.ply];
  const pair = mvNormalise(here.fen, from, to);
  from = pair[0]; to = pair[1];

  const hit = brMatch(state.ply, from, to);
  if(hit >= 0){ brEnter(state.ply, hit, "read"); return; }

  const name = mvName(here.fen, from, to);
  if(mvIsLegal(here, from, to) === false){
    state.drill.msg = `<b>${name}</b> isn't a legal move in this position.`;
    state.drill.tone = "bad";
  } else {
    const next = curSeq()[state.ply + 1];
    state.drill.msg = `<b>${name}</b> isn't one I have notes on. `
      + (next?`This line plays <b>${next.san}</b>. `:"")
      + dxPrinciple(here, from, to);
    state.drill.tone = "flat";
  }
  state.sel = null;
  render();
  dxSay(name + ".");
}

function dxPick(sq){
  const here = curSeq()[state.ply];
  if(state.sel === sq){ state.sel = null; dxPaint(); return; }
  if(state.sel){ const from = state.sel; state.sel = null; dxBoardMove(from, sq); return; }
  if(!mvIsOwn(here.fen, sq, dxMoverSide())) return;
  state.sel = sq;
  state.drill.cursor = sq;
  dxPaint();
}

document.getElementById("content").addEventListener("pointerdown", e=>{
  if(!dxArmed()) return;
  const cell = e.target.closest("[data-sq]");
  if(!cell) return;
  const sq = cell.dataset.sq;
  const here = curSeq()[state.ply];
  e.preventDefault();

  if(!state.sel && mvIsOwn(here.fen, sq, dxMoverSide())){
    state.drag = {from:sq, id:e.pointerId};
    try{ cell.setPointerCapture(e.pointerId); }catch(err){}
  }
  dxPick(sq);
});

document.getElementById("content").addEventListener("pointerup", e=>{
  const drag = state.drag;
  if(!drag || drag.id !== e.pointerId) return;
  state.drag = null;
  const cell = document.elementFromPoint(e.clientX, e.clientY);
  const drop = cell && cell.closest && cell.closest("[data-sq]");
  if(!drop || drop.dataset.sq === drag.from) return;   // a click, not a drag
  state.sel = null;
  dxBoardMove(drag.from, drop.dataset.sq);
});

/* ---- keyboard ---- */
/* Returns true when it has handled the key, so the page-level handler can bail. */
function dxKey(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return false;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return false;
  if(state.view !== "op") return false;

  const k = e.key;
  const d = state.drill;

  // Escape unwinds one layer at a time, innermost first.
  if(k === "Escape"){
    if(state.sel){ state.sel = null; dxPaint(); return true; }
    if(state.pick){ state.pick = false; render(); return true; }
    if(state.branch){ brExit(); return true; }
    return false;
  }
  if(k === "d" || k === "D"){ if(!state.branch){ ACTIONS.deviate(); return true; } return false; }
  if(state.branch){
    if(k === "ArrowRight"){ step(1); return true; }
    if(k === "ArrowLeft"){ step(-1); return true; }
    return false;
  }
  if(k === "m" || k === "M"){ dxSetMode(state.mode === "drill" ? "read" : "drill"); return true; }
  if(!dxOn()) return false;

  if(k === "h" || k === "H"){ dxHint(); return true; }
  if(k === "s" || k === "S"){ dxShow(); return true; }
  if(k === "r" || k === "R"){ dxRetry(); return true; }

  if((k === "Enter" || k === " ") && (d.phase === "right" || d.phase === "reveal")){
    dxContinue(); return true;
  }

  const board = document.getElementById("board");
  const onBoard = board && board.contains(document.activeElement);
  if(!onBoard) return dxAsking() && (k === "ArrowRight" || k === "End");   // never reveal by stepping

  if(k === "Enter" || k === " "){ dxPick(d.cursor); return true; }
  // Not `step`: that is the global that moves through a line, and shadowing it
  // here puts the earlier step() calls in this function into its dead zone.
  const delta = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,1], ArrowDown:[0,-1]}[k];
  if(delta){
    const file = FILES.indexOf(d.cursor[0]) + (state.flip ? -delta[0] : delta[0]);
    const rank = (+d.cursor[1]) + (state.flip ? -delta[1] : delta[1]);
    if(file >= 0 && file < 8 && rank >= 1 && rank <= 8){
      d.cursor = FILES[file] + rank;
      dxPaint();
      const cell = board.querySelector(`[data-sq="${d.cursor}"]`);
      if(cell){ board.querySelectorAll("[data-sq]").forEach(s=>s.setAttribute("tabindex","-1"));
                cell.setAttribute("tabindex","0"); cell.focus(); }
    }
    return true;
  }
  return false;
}

ACTIONS.mode     = t=>dxSetMode(t.dataset.v);
ACTIONS.hint     = ()=>dxHint();
ACTIONS.show     = ()=>dxShow();
ACTIONS.retry    = ()=>dxRetry();
ACTIONS.continue = ()=>dxContinue();

/* ---------------- deviations ---------------- */
/* "They played something else" is the most common thing that happens to a
   prepared opening, so it is a first-class move here rather than a failure
   state. Three buckets, and only one of them is a mistake:

     blunder     there is a refutation, and here it is
     inaccuracy  small and lasting, here is what you get
     playable    a real move. Nothing to refute. Develop and carry on.

   Most deviations are the third kind. Tools that answer every one of them with
   a red cross teach a reflex that loses games -- hunting for a refutation that
   was never there. */

const BR_SEV = {
  blunder:    {label:"Blunder",    gist:"loses material or the game"},
  inaccuracy: {label:"Inaccuracy", gist:"playable, but it costs something"},
  playable:   {label:"Playable",   gist:"a real move — nothing to refute"},
};

/* The branch sets are shared between every line that reaches the position, so
   the move THIS line plays has to be dropped: from here it is the main line,
   not a deviation from it. */
function brAt(ply){
  const op = DATA.find(o=>o.id===state.opId);
  if(!op || !op.branchsets) return [];
  const line = op.lines[state.line];
  const here = line && line.plies[ply];
  if(!here || here.bx === undefined) return [];
  const next = line.plies[ply + 1];
  return op.branchsets[here.bx].filter(b=>
    (!next || b.san !== next.san) && tierVisible(b.tier));
}

function brSeq(){
  const list = brAt(state.branch.fromPly);
  const one = list[state.branch.idx];
  return one ? one.plies : [];
}
function brCur(){
  const list = brAt(state.branch.fromPly);
  return list[state.branch.idx] || null;
}

function brEnter(fromPly, idx, origin){
  state.branch = {fromPly, idx, at:0, origin:origin || "read"};
  state.pick = false;
  state.sel = null;
  render();
  const b = brCur();
  if(b) dxSay(`${BR_SEV[b.sev].label}. ${b.san}.`);
}

function brExit(){
  const origin = state.branch && state.branch.origin;
  state.branch = null;
  state.sel = null;
  if(origin === "drill" && state.mode === "drill"){
    state.drill.phase = "ask";
    state.drill.msg = ""; state.drill.tone = "";
  }
  render();
  dxSay("Back to the line.");
}

/* Does a played move match an authored deviation from this position? */
function brMatch(ply, from, to){
  const list = brAt(ply);
  for(let i=0;i<list.length;i++){
    const first = list[i].plies[0];
    if(first && first.from === from && first.to === to) return i;
  }
  return -1;
}

function brPickerHTML(){
  const list = brAt(state.ply);
  const line = DATA.find(o=>o.id===state.opId).lines[state.line];
  const next = line.plies[state.ply + 1];
  return `
      <div class="deviate" id="deviate">
        <p class="devlead">${next
          ? `What did they play instead of <b>${next.num}</b>?`
          : `What did they play here?`}</p>
        ${list.length?`<div class="devchips">
          ${list.map((b,i)=>`<button class="brchip sev-${b.sev}" data-act="branch" data-i="${i}">
            ${b.san} <em>${BR_SEV[b.sev].label}</em></button>`).join("")}
        </div>`:""}
        <p class="develse">${list.length
          ? "…or play their move on the board and I'll tell you what I can."
          : "Play their move on the board and I'll tell you what I can."}</p>
        <button class="devcancel" data-act="devcancel">Cancel <kbd>Esc</kbd></button>
      </div>`;
}

function brTapeHTML(b){
  return b.plies.map((p,i)=>{
    const num = p.turn==="w" ? `<span class="mvnum">${Math.ceil((i+1)/2)}.</span>` : "";
    const cls = i===state.branch.at ? "mv on" : (i<state.branch.at ? "mv seen" : "mv");
    return `${num}<button class="${cls}" data-act="brat" data-i="${i}">${p.san}</button>`;
  }).join("");
}

function brPanelHTML(){
  const b = brCur();
  if(!b) return "";
  const sev = BR_SEV[b.sev];
  const at = state.branch.at;
  const p = b.plies[at];
  const last = at >= b.plies.length - 1;
  return `
      <div class="branch sev-${b.sev}">
        <div class="brtop">
          <span class="brsev">${sev.label}</span>
          <span class="brmove">${b.plies[0].num}</span>
          ${b.name?`<span class="brname">${b.name}</span>`:""}
          <button class="brclose" data-act="brexit" title="Back to the line (Esc)">&#10005;</button>
        </div>
        <p class="brwhy">${b.why}</p>
        ${b.plies.length>1?`
        <div class="brtape">${brTapeHTML(b)}</div>
        <div class="cmtop">
          <span class="cmmove">${p.num}</span>
          <span class="cmwho">${p.turn==="w"?"White to have moved":"Black to have moved"}</span>
        </div>
        ${p.tactics?`<div class="tactics"><span class="lbl">On the board</span><span class="body">${tacticsHTML(p.tactics)}.</span></div>`:""}
        <div class="brnav">
          <button class="ctl" data-act="brprev" ${at===0?"disabled":""}>&#8592; Back</button>
          <button class="ctl" data-act="brnext" ${last?"disabled":""}>Next &#8594;</button>
          <button class="ctl brret" data-act="brexit">Return to the line</button>
        </div>`:`
        <div class="brnav">
          <button class="ctl brret" data-act="brexit">Return to the line</button>
        </div>`}
      </div>`;
}

ACTIONS.deviate = ()=>{
  if(state.branch) return;
  state.pick = !state.pick;
  state.sel = null;
  render();
};
ACTIONS.devcancel = ()=>{ state.pick = false; render(); };
ACTIONS.branch = t=>brEnter(state.ply, +t.dataset.i, state.mode === "drill" ? "drill" : "read");
ACTIONS.brexit = ()=>brExit();
ACTIONS.brprev = ()=>step(-1);
ACTIONS.brnext = ()=>step(1);
ACTIONS.brat   = t=>{ state.branch.at = +t.dataset.i; render(); };

/* ---------------- the end of a line ---------------- */
/* "I reached the end of my preparation and had no idea what to do" is the second
   most common complaint about opening study, and the course used to end a line
   with nothing but the last move. Every line now finishes with a card.

   Two versions. `planCardHTML` is what an author wrote; `planEndHTML` is derived
   from data every opening already has, so a line with no authored plan still
   ends with something useful rather than silence. */

function planStructure(id){ return STRUCTURES.find(s=>s.id===id) || null; }

function planCardHTML(op, line){
  const plan = line.plan;
  const st = plan.structure ? planStructure(plan.structure) : null;
  return `
      <div class="plan">
        <p class="cardhead">You're on your own from here</p>
        <p class="planpoint">${plan.point}</p>
        ${st?`<button class="planstruct" data-act="structure" data-id="${st.id}">
          <span class="planstructlbl">The structure you reached</span>
          <span class="planstructname">${st.name}</span>
        </button>`:""}
        ${plan.next && plan.next.length?`
        <p class="plansub">What usually happens next</p>
        <ul class="plannext">${plan.next.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
        ${plan.endgame?`<p class="planend"><b>If it simplifies.</b> ${plan.endgame}</p>`:""}
      </div>`;
}

/* No authoring at all: the plans are the ones the opening already states, and
   naming them here is the difference between a line that stops and a line that
   hands over. */
function planEndHTML(op, line){
  const mine = op.orientation === "black" ? op.theory.black_plans : op.theory.white_plans;
  return `
      <div class="plan generic">
        <p class="cardhead">You're on your own from here</p>
        <p class="planpoint">${line.name} ends here. There is no move ${
          Math.ceil(line.plies.length/2)+1} written down &mdash; from this position you are
          playing on the ideas, not the moves.</p>
        <p class="plansub">What you are trying to do in this opening</p>
        <ul class="plannext">${mine.slice(0,3).map(x=>`<li>${x}</li>`).join("")}</ul>
        <p class="planend"><b>The structure.</b> ${op.theory.structure}</p>
      </div>`;
}

function planHTML(op, line){
  if(state.branch || state.mode === "drill") return "";
  if(curIdx() < curSeq().length - 1) return "";
  return line.plan ? planCardHTML(op, line) : planEndHTML(op, line);
}

ACTIONS.structure = t=>{
  state.view = "structure";
  state.structId = t.dataset.id;
  state.branch = null; state.pick = false;
  buildRail(); render();
  window.scrollTo({top:0,behavior:"instant"});
};

/* ---------------- pawn structures and model games ---------------- */
/* A structure is not a paragraph belonging to one opening. It is the thing
   several openings arrive at, which is the whole reason studying one pays out in
   the others -- learn the isolani once and it serves the Panov, the Queen's
   Gambit Accepted and the Nimzo Rubinstein too.

   `openings` is derived by the build from the lines that point here. `also_in`
   is authored, and names the openings in this course that reach the same
   structure but do not yet carry a plan card. */

function structureHTML(st){
  if(!st) return primerHTML();
  return `
  <div class="ophead">
    <div class="opkicker">
      <span>Pawn structures</span><span class="sep">/</span><span>${st.taxonomy?"In the literature":"Structure"}</span>
      ${st.tier?`<span class="sep">/</span><span class="lvl">${st.tier}</span>`:""}
    </div>
    <h2 class="opname">${st.name}</h2>
    ${st.taxonomy?`<p class="optag">${st.taxonomy}</p>`:""}
  </div>

  <div class="structpage">
    <div class="structdiag">
      <div class="boardframe">
        <div class="boardwrap">${boardCells(st.board, null, null, null, false)}</div>
      </div>
      <p class="structcap">A representative position. The pieces will differ; the pawns are the point.</p>
    </div>

    <div class="structcards">
      <div class="card">
        <p class="cardhead">♔ White's plans</p>
        <ul>${st.white_plans.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <p class="cardhead">♚ Black's plans</p>
        <ul>${st.black_plans.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <p class="cardhead">Key squares</p>
        <ul>${st.key_squares.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <p class="cardhead">The pawn breaks</p>
        <ul>${st.pawn_breaks.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="card warn span">
        <p class="cardhead">What goes wrong</p>
        <ul>${st.pitfalls.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="card span">
        <p class="cardhead">If it reaches an endgame</p>
        <p>${st.endgame_note}</p>
      </div>
    </div>

    <div class="structops">
      <p class="cardhead">Where this comes from</p>
      ${st.openings.length?`<ul class="structreach">${st.openings.map(o=>
        `<li><button data-act="goop" data-id="${o.id}">${o.name}</button>
         <span class="structline">${o.line}</span></li>`).join("")}</ul>`:""}
      ${st.also_in && st.also_in.length?`
        <p class="plansub">Also reached by</p>
        <ul class="structalso">${st.also_in.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    </div>
  </div>`;
}

function gameHTML(g){
  if(!g) return primerHTML();
  const seq = curSeq();
  const p = seq[state.ply] || seq[0];
  const op = DATA.find(o=>o.id===g.op);
  const tape = seq.slice(1).map((q,i)=>{
    const idx = i+1;
    const num = q.turn==="w" ? `<span class="mvnum">${Math.ceil(idx/2)}.</span>` : "";
    const cls = idx===state.ply ? "mv on" : (idx<state.ply ? "mv seen" : "mv");
    return `${num}<button class="${cls}" data-ply="${idx}">${q.san}</button>`;
  }).join("");

  return `
  <div class="ophead">
    <div class="opkicker">
      <span>Model game</span>${op?`<span class="sep">/</span><span>${op.name}</span>`:""}
      ${g.tier?`<span class="sep">/</span><span class="lvl">${g.tier}</span>`:""}
    </div>
    <h2 class="opname">${g.name}</h2>
  </div>

  <section class="study gamestudy">
    <div class="boardcol">
      <div class="boardframe">
        <div class="boardwrap">${boardCells(p.fen,p.from,p.to,p.check?(p.turn==="w"?"b":"w"):null,state.flip)}<canvas class="arrows" id="arrowlayer"></canvas></div>
      </div>
      <div class="controls">
        <button class="ctl" id="b-first" ${state.ply===0?"disabled":""} title="Start (Home)">&#8676;</button>
        <button class="ctl wide" id="b-prev" ${state.ply===0?"disabled":""} title="Back (←)">&#8592; Back</button>
        <button class="ctl wide" id="b-next" ${state.ply>=seq.length-1?"disabled":""} title="Forward (→)">Next &#8594;</button>
        <button class="ctl" id="b-last" ${state.ply>=seq.length-1?"disabled":""} title="End (End)">&#8677;</button>
      </div>
      <div class="ctlbar2">
        <button class="ctl${state.timer?" on":""}" id="b-play">${state.timer?"■ Stop":"▶ Play through"}</button>
        <button class="ctl" id="b-flip">⇅ Flip board</button>
        <button class="ctl" id="b-arrows" disabled>↗ Arrows: n/a</button>
      </div>
      <div class="counter">Move ${state.ply} of ${seq.length-1} &nbsp;·&nbsp; ${state.flip?"Black":"White"} at the bottom</div>
      <div class="hint">Use ← and → keys, or click any move in the list.</div>
    </div>

    <div class="studycol">
      <div class="tape" id="tape">${tape}</div>
      <div class="commentary">
        <div class="cmtop">
          <span class="cmmove">${state.ply===0?"Before the game":p.num}</span>
          <span class="cmwho">${state.ply===0?"":(p.turn==="w"?"White to have moved":"Black to have moved")}</span>
        </div>
        <p class="cmtext">${p.note || "&mdash;"}</p>
      </div>
    </div>
  </section>`;
}

ACTIONS.goop = t=>go(t.dataset.id);
ACTIONS.game = t=>{
  state.view = "game";
  state.gameId = t.dataset.id;
  state.ply = 0; state.flip = false;
  state.branch = null; state.pick = false;
  buildRail(); render();
  window.scrollTo({top:0,behavior:"instant"});
};

/* ---------------- render ---------------- */
/* One full innerHTML rewrite per state change, deliberately: the page is small
   enough that diffing would cost more than it saves. The view is split into
   partials only so each piece is addressable -- render() itself stays a router. */
function render(){
  const el = document.getElementById("content");
  el.innerHTML = viewHTML();
  bindView(el);
  afterRender();
}

function viewHTML(){
  switch(state.view){
    case "primer":    return primerHTML();
    case "progress":  return progressHTML();
    case "structure": return structureHTML(STRUCTURES.find(s=>s.id===state.structId));
    case "game":      return gameHTML(GAMES.find(g=>g.id===state.gameId));
    default:          return opHTML();
  }
}

function opHTML(){
  const op = DATA.find(o=>o.id===state.opId);
  const line = op.lines[state.line];
  return opHeadHTML(op) + jumpHTML(op) + studyHTML(op, line, curPly())
       + theoryHTML(op) + pathHTML(op);
}

function opHeadHTML(op){
  const sec = SECTIONS.find(s=>s.id===op.section);
  return `
  <div class="ophead">
    <div class="opkicker">
      <span>${sec.group}</span><span class="sep">/</span><span>${sec.label}</span>
      <span class="sep">/</span><span class="lvl">${op.eco}</span>
      <span class="sep">/</span><span class="lvl">${op.level}</span>
    </div>
    <h2 class="opname">${op.name}</h2>
    <p class="optag">${op.tagline}</p>
  </div>
`;
}

function jumpHTML(op){
  return `
  <nav class="jump">
    <a href="#study-${op.id}">Play through the moves</a>
    <a href="#theory-${op.id}">Strategy</a>
    <a href="#path-${op.id}">Learning path</a>
  </nav>
`;
}

function tapeHTML(line){
  const hide = state.mode === "drill";
  return line.plies.slice(1).map((q,i)=>{
    const idx = i+1;
    const num = q.turn==="w" ? `<span class="mvnum">${Math.ceil(idx/2)}.</span>` : "";
    // In drill the move list is the answer sheet, so everything ahead is masked.
    if(hide && idx > state.ply) return `${num}<span class="mv mask" aria-hidden="true">••</span>`;
    const cls = idx===state.ply ? "mv on" : (idx<state.ply ? "mv seen" : "mv");
    return `${num}<button class="${cls}" data-ply="${idx}">${q.san}</button>`;
  }).join("");
}

function commentaryHTML(p){
  return `
      <div class="commentary">
        <div class="cmtop">
          <span class="cmmove">${state.ply===0?"Start":p.num}</span>
          <span class="cmwho">${state.ply===0?"Before the first move":(p.turn==="w"?"White to have moved":"Black to have moved")}</span>
        </div>
        <p class="cmtext">${p.note}</p>
        ${state.ply>0 && p.tactics?`<div class="tactics"><span class="lbl">On the board</span><span class="body">${tacticsHTML(p.tactics)}.</span></div>`:""}
      </div>`;
}

function studyHTML(op, line, p){
  const inBranch = !!state.branch;
  const seq = curSeq(), idx = curIdx();
  const atEnd = idx >= seq.length-1;
  const atStart = idx === 0;
  const locked = dxAsking();     // stepping forward in drill would reveal the answer
  const showArrows = state.arrows && !dxHideArrows();
  return `
  <section class="study" id="study-${op.id}">
    ${dxBarHTML(line)}
    <div class="boardcol">
      <div class="boardframe">
        <div class="boardwrap">${boardCells(p.fen,p.from,p.to,p.check?(p.turn==="w"?"b":"w"):null,state.flip)}<canvas class="arrows" id="arrowlayer"></canvas></div>
      </div>
      <div class="controls">
        <button class="ctl" id="b-first" ${atStart?"disabled":""} title="Start (Home)">&#8676;</button>
        <button class="ctl wide" id="b-prev" ${atStart?"disabled":""} title="Back (\u2190)">&#8592; Back</button>
        <button class="ctl wide" id="b-next" ${atEnd||locked?"disabled":""} title="Forward (\u2192)">Next &#8594;</button>
        <button class="ctl" id="b-last" ${atEnd||locked?"disabled":""} title="End (End)">&#8677;</button>
      </div>
      <div class="ctlbar2">
        <button class="ctl${state.timer?" on":""}" id="b-play" ${state.mode==="drill"?"disabled":""}>${state.timer?"\u25A0 Stop":"\u25B6 Play through"}</button>
        <button class="ctl" id="b-flip">\u21C5 Flip board</button>
        <button class="ctl${state.arrows?" on":""}" id="b-arrows" ${dxHideArrows()?"disabled":""}>\u2197 Arrows: ${state.arrows?"On":"Off"}</button>
      </div>
      ${showArrows?`<div class="legend">
        <span><i class="mv"></i>the move</span>
        <span><i class="atk"></i>attacks</span>
        <span><i class="chk"></i>check</span>
        <span><i class="def"></i>defends</span>
        <span><i class="ctrl"></i>controls a key square</span>
      </div>`:""}
      <div class="counter">${inBranch
        ? `Deviation &mdash; move ${idx+1} of ${seq.length}`
        : `Move ${state.ply} of ${line.plies.length-1}`} &nbsp;\u00B7&nbsp; ${state.flip?"Black":"White"} at the bottom</div>
      <div class="hint">${state.mode==="drill"
        ? "Click a piece then its square, or drag it. <b>H</b> hint &middot; <b>S</b> show &middot; <b>M</b> back to reading."
        : "Use \u2190 and \u2192 keys, or click any move in the list."}</div>
    </div>

    <div class="studycol">
      <div class="vartabs">
        ${op.lines.map((l,i)=>`<button class="vartab${i===state.line?" on":""}" data-line="${i}">${l.name}</button>`).join("")}
      </div>
      <p class="varnote">${line.note}</p>
      <div class="tape${inBranch?" brmuted":""}" id="tape">${tapeHTML(line)}</div>
      ${state.pick ? brPickerHTML() : ""}
      ${inBranch ? brPanelHTML()
        : state.mode==="drill" ? dxPanelHTML(line) : commentaryHTML(p)}
      ${planHTML(op, line)}
    </div>
  </section>
`;
}

function theoryHTML(op){
  const t = op.theory;
  return `
  <div class="theory" id="theory-${op.id}">
    <div class="card span">
      <p class="cardhead">The idea in one paragraph</p>
      <p>${t.big_idea}</p>
    </div>
    <div class="card span">
      <p class="cardhead">The pawn structure</p>
      <p>${t.structure}</p>
    </div>
    <div class="card">
      <p class="cardhead">\u2654 White's plans</p>
      <ul>${t.white_plans.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <p class="cardhead">\u265A Black's plans</p>
      <ul>${t.black_plans.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>
    <div class="card warn span">
      <p class="cardhead">Traps and things that lose games</p>
      <ul>${t.traps.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>
    <div class="who"><p>${t.who}</p></div>
  </div>
`;
}

function pathHTML(op){
  const pr = op.progression;
  const shown = pr.stages.filter(st=>tierVisible(st.tier));
  const hidden = pr.stages.length - shown.length;
  return `
  <section class="prog" id="path-${op.id}">
    <p class="cardhead">Your learning path &mdash; ${op.name}</p>
    <p class="progarc">${pr.arc}</p>
    <ol class="steps">
      ${shown.map(st=>`
        <li>
          <div class="steptop"><span class="tier">${st.tier}</span><span class="when">${st.when}</span></div>
          <p class="goal"><b>Goal.</b> ${st.goal}</p>
          <ul class="learn">${st.learn.map(x=>`<li>${x}</li>`).join("")}</ul>
          <div class="micro"><b>Drill</b><span>${st.drill}</span></div>
          <div class="micro warn"><b>Common mistake</b><span>${st.mistake}</span></div>
          <div class="micro ok"><b>Move on when</b><span>${st.ready}</span></div>
        </li>`).join("")}
    </ol>
    ${hidden?`<p class="tiermore">${hidden} later stage${hidden===1?"":"s"} hidden &mdash;
      raise <b>Show</b> above ${state.tier} to see ${hidden===1?"it":"them"}.</p>`:""}
    <div class="progfoot">
      <div class="card"><p class="cardhead">Whose games to study</p><p>${pr.study}</p></div>
      <div class="card"><p class="cardhead">What to learn after this</p><p>${pr.next}</p></div>
    </div>
  </section>
`;
}

function bindView(el){
  if(state.view!=="op" && state.view!=="game") return;
  const jump = n=>{ if(state.branch) state.branch.at=n; else state.ply=n; render(); };
  document.getElementById("b-first").onclick = ()=>{stopPlay();jump(0)};
  document.getElementById("b-prev").onclick  = ()=>{stopPlay();step(-1)};
  document.getElementById("b-next").onclick  = ()=>{stopPlay();step(1)};
  document.getElementById("b-last").onclick  = ()=>{stopPlay();jump(curSeq().length-1)};
  document.getElementById("b-flip").onclick  = ()=>{state.flip=!state.flip;render()};
  document.getElementById("b-arrows").onclick = ()=>{state.arrows=!state.arrows;render()};
  document.getElementById("b-play").onclick  = togglePlay;
  el.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{
    stopPlay(); state.branch=null; state.pick=false;
    state.line=+b.dataset.line; state.ply=0;
    if(state.mode==="drill") dxStart(); else render();
  });
  el.querySelectorAll("[data-ply]").forEach(b=>b.onclick=()=>{
    stopPlay(); state.branch=null; state.pick=false;
    state.ply=+b.dataset.ply; render();
  });
}

function afterRender(){
  sizeBoard();
  drawArrows();
  dxArm();
  const on = document.querySelector(".mv.on");
  if(on && on.scrollIntoView) on.scrollIntoView({block:"nearest"});
  dbRemember();   // debounced, so stepping a line with the arrow keys costs one write
}

function step(d){
  const seq = curSeq();
  const n = curIdx() + d;
  if(n<0 || n>seq.length-1) return false;
  if(state.branch) state.branch.at = n; else state.ply = n;
  render(); return true;
}
function togglePlay(){
  if(state.timer){ stopPlay(); render(); return; }
  state.timer = setInterval(()=>{ if(!step(1)) { stopPlay(); render(); } }, 1500);
  render();
}
function stopPlay(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  if(dxTimer){ clearTimeout(dxTimer); dxTimer=null; }
}

/* One delegated listener on #content. render() refills that node but never
   replaces it, so a control declared with data-act stays wired through every
   rewrite and costs no rebinding line. */
document.getElementById("content").addEventListener("click", e=>{
  const hit = e.target.closest("[data-act]");
  if(!hit) return;
  const fn = ACTIONS[hit.dataset.act];
  if(!fn) return;
  e.preventDefault();
  fn(hit, e);
});

document.addEventListener("keydown",e=>{
  if(dxKey(e)){ e.preventDefault(); return; }
  if(state.view!=="op" && state.view!=="game") return;
  const jump = n=>{ if(state.branch) state.branch.at=n; else state.ply=n; render(); };
  if(e.key==="ArrowRight"){ stopPlay(); step(1); e.preventDefault(); }
  if(e.key==="ArrowLeft"){ stopPlay(); step(-1); e.preventDefault(); }
  if(e.key==="Home"){ stopPlay(); jump(0); e.preventDefault(); }
  if(e.key==="End"){ stopPlay(); jump(curSeq().length-1); e.preventDefault(); }
});

/* ---------------- primer ---------------- */
/* Static prose, authored as HTML in primer.html and inlined into a <template>. */
function primerHTML(){
  return document.getElementById("primer").innerHTML;
}

/* ---------------- boot ---------------- */
/* The masthead counts are derived, not written down: they drifted badly once,
   claiming 12/36/721 against a real 13/59/1359, and cannot drift again. */
function mastheadText(){
  const lines = DATA.reduce((n,o)=>n+o.lines.length, 0);
  const moves = DATA.reduce((n,o)=>n+o.lines.reduce((m,l)=>m+l.plies.length-1, 0), 0);
  const count = (n,word)=>`${n.toLocaleString("en")} ${word}${n===1?"":"s"}`;
  return ["Interactive course",
          count(DATA.length,"opening"),
          count(lines,"annotated line"),
          count(moves,"move")].join(" · ");
}

document.getElementById("eyebrow").textContent = mastheadText();
dbRestore();
buildChrome();
buildRail();
render();

</script>
</body>
</html>
