name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The build concatenates the app's JavaScript without parsing it, so
      # tests/test_smoke.py loads the built page in a DOM and drives it. jsdom is
      # all it needs, the version is pinned, and nothing from node_modules is
      # committed or published -- only docs/ is uploaded below.
      - run: npm install --no-save jsdom@30.0.1

      - run: python3 -m unittest discover tests

      - run: python3 src/build.py

      # The Next.js rewrite under web/, fed by the same validated build via
      # --emit. It ships to its own Pages project (chesslab-next) until it
      # reaches parity; chesslab.dev stays on the single-file site above.
      - run: python3 src/build.py --emit

      - run: npm ci --prefix web

      - run: npm run build --prefix web

      # The artifact smoke drives the exported pages in jsdom -- a red run
      # blocks both deploys, same as the tests above.
      - run: npm test --prefix web

      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=chesslab --branch=${{ github.head_ref || github.ref_name }}

      # First run only: creating a project that exists fails, and that is fine.
      - uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create chesslab-next --production-branch=main

      - uses: cloudflare/wrangler-action@v3
        id: deploy-next
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=chesslab-next --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment the preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Pages derives a branch alias by lowercasing and hyphenating; it is the
          # stable URL, whereas deployment-url changes with every commit.
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          body="📖 Current site: https://${alias}.chesslab.pages.dev
          ✨ New app (WIP): https://${alias}.chesslab-next.pages.dev

          This commit: ${DEPLOY_URL:-_not reported_}"
          gh pr comment "${{ github.event.number }}" --body "$body" --edit-last \
            || gh pr comment "${{ github.event.number }}" --body "$body"
